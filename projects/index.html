<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f1f0f4;--ink:#1a1720;--muted:#726c7a;--line:#dad6e0;--accent:#5e2b54}
  *{box-sizing:border-box;margin:0}
  html{color-scheme:light}
  body{background:var(--paper);color:var(--ink);
    font-family:"Archivo",system-ui,sans-serif;font-size:16px;line-height:1.55;
    -webkit-font-smoothing:antialiased;min-height:100svh;display:flex;flex-direction:column;
    padding:clamp(24px,5vw,44px) clamp(22px,7vw,60px) clamp(40px,8vw,72px)}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:3px}

  .back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);
    font-family:"Archivo",system-ui,sans-serif;font-weight:500;font-size:.95rem;
    letter-spacing:.01em;transition:color .2s}
  .back svg{width:16px;height:16px}
  .back .t{position:relative}
  .back .t::after{content:"";position:absolute;left:0;bottom:-2px;height:1.5px;width:0;
    background:var(--accent);transition:width .26s cubic-bezier(.2,.7,.3,1)}
  .back:hover{color:var(--accent)}
  .back:hover .t::after,.back:focus-visible .t::after{width:100%}

  .wrap{width:100%;max-width:640px;margin:0 auto;flex:1}

  .title{font-family:"Fraunces",Georgia,serif;font-weight:500;
    font-size:clamp(2.6rem,9vw,4.4rem);line-height:1.02;letter-spacing:-.015em;
    font-optical-sizing:auto;margin:clamp(30px,7vw,64px) 0 clamp(28px,6vw,48px)}

  .cat{padding:clamp(22px,4vw,32px) 0;border-top:1px solid var(--line)}
  .cat:last-child{border-bottom:1px solid var(--line)}
  .cat h2{font-family:"Archivo",system-ui,sans-serif;font-weight:600;
    font-size:clamp(1.5rem,5.5vw,2.1rem);letter-spacing:-.01em}
  .cat .lead{color:var(--muted);font-size:.9rem;margin-top:5px}

  .items{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
  .items:empty{display:none}
  .items li a{position:relative;display:flex;align-items:baseline;gap:12px;
    padding:9px 0;font-size:1rem;transition:color .18s}
  .items li a span{color:var(--muted);font-size:.9rem;flex:1}
  .items li a::after{content:"";position:absolute;left:0;bottom:5px;height:1.5px;width:0;
    background:var(--accent);transition:width .24s cubic-bezier(.2,.7,.3,1)}
  .items li a:hover{color:var(--accent)}
  .items li a:hover span{color:var(--ink)}
  .items li a:hover::after,.items li a:focus-visible::after{width:1.4em}

  @media (prefers-reduced-motion:no-preference){
    .reveal{opacity:0;transform:translateY(9px);animation:rise .55s cubic-bezier(.2,.7,.3,1) forwards}
    .title{animation-delay:.04s}
    .c1{animation-delay:.12s}.c2{animation-delay:.19s}.c3{animation-delay:.26s}.c4{animation-delay:.33s}
    @keyframes rise{to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
