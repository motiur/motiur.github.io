<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photos</title>
<!--
  ALBUM PAGE  (place at  album/index.html , NO front matter.)

  WHERE / WHEN under each photo comes from, in order of preference:
    1. MANUAL_META below  (keyed by filename — always wins)
    2. Filename shortcut   (see below)
    3. EXIF in the photo   (capture time; GPS -> place via OpenStreetMap)

  FILENAME SHORTCUTS (rename a file to embed info, no code editing):
    @Place Name   ->  place label      e.g.  boat-ride@Cox's Bazar.jpg
    --caption     ->  caption          e.g.  boat-ride--evening on the water.jpg
    YYYYMMDD      ->  date (fallback)  e.g.  20220528_boat.jpg
  You can combine them:  20220528--evening on the water@Cox's Bazar.jpg

  Note: Facebook/most social exports strip EXIF, so those photos have no
  embedded date or GPS — use MANUAL_META or the @ shortcut for those.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<style>
  :root{
    --paper:#f1f0f4;--surface:#e9e7ee;--ink:#1a1720;--muted:#726c7a;
    --line:#dad6e0;--accent:#5e2b54;--radius:12px;--stage-h:min(68svh,600px);
  }
  *{box-sizing:border-box;margin:0}
  html{color-scheme:light}
  body{background:var(--paper);color:var(--ink);
    font-family:"Archivo",system-ui,sans-serif;font-size:16px;line-height:1.55;
    -webkit-font-smoothing:antialiased;min-height:100svh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

  header{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:clamp(24px,5vw,44px) clamp(20px,5vw,40px) 12px;max-width:900px;width:100%;margin:0 auto}
  .back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);
    font-family:"Archivo",system-ui,sans-serif;font-weight:500;
    font-size:.95rem;letter-spacing:.01em;transition:color .2s}
  .back svg{width:16px;height:16px}
  .back .t{position:relative}
  .back .t::after{content:"";position:absolute;left:0;bottom:-2px;height:1.5px;width:0;
    background:var(--accent);transition:width .26s cubic-bezier(.2,.7,.3,1)}
  .back:hover{color:var(--accent)}
  .back:hover .t::after,.back:focus-visible .t::after{width:100%}
  .count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;flex-shrink:0}

  main{width:100%;max-width:900px;margin:0 auto;padding:6px clamp(20px,5vw,40px) 48px;flex:1}

  .stage{position:relative;background:var(--surface);border-radius:var(--radius);overflow:hidden;
    box-shadow:0 24px 55px -34px rgba(94,43,84,.5)}
  .stage img{display:block;width:100%;height:var(--stage-h);object-fit:cover;
    user-select:none;-webkit-user-drag:none}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;
    border-radius:50%;background:rgba(20,16,24,.34);backdrop-filter:blur(3px);
    border:1px solid rgba(255,255,255,.35);
    display:flex;align-items:center;justify-content:center;color:#fff;
    opacity:0;transition:opacity .18s ease,background .18s}
  .nav.prev{left:16px}.nav.next{right:16px}
  .nav svg{width:22px;height:22px}
  .stage:hover .nav,.nav:focus-visible{opacity:1}
  .nav:hover{background:var(--accent)}
  @media (hover:none){.nav{opacity:.95}}

  .meta{display:flex;align-items:flex-start;gap:14px;padding:16px 2px 0;min-height:46px}
  .caption{flex:1;min-width:0}
  .caption .cap{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:400;
    font-size:clamp(1.05rem,3.2vw,1.25rem);line-height:1.3;color:var(--ink)}
  .caption .cap:empty{display:none}
  .metaline{display:flex;flex-wrap:wrap;gap:5px 16px;margin-top:7px;color:var(--muted);font-size:.82rem}
  .mitem{display:inline-flex;align-items:center;gap:5px}
  .mitem[hidden]{display:none}
  .mitem svg{width:13px;height:13px;color:var(--accent);flex-shrink:0}
  .views{display:inline-flex;align-items:center;gap:7px;flex-shrink:0;background:#fff;
    border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--muted);
    font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
  .views[hidden]{display:none}
  .views svg{width:15px;height:15px;color:var(--accent)}
  .views .num{color:var(--ink);font-weight:600}
  .views.loading .num{color:var(--muted)}

  .strip{display:flex;gap:9px;overflow-x:auto;padding:18px 2px 6px;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .strip button{flex:0 0 auto;width:66px;height:50px;border-radius:8px;overflow:hidden;
    border:1px solid var(--line);padding:0;opacity:.6;background:#fff;
    transition:opacity .15s,border-color .15s}
  .strip img{width:100%;height:100%;object-fit:cover;display:block}
  .strip button:hover{opacity:.9}
  .strip button[aria-current="true"]{opacity:1;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

  .note{padding:60px 24px;text-align:center;color:var(--muted);
    border:1px dashed var(--line);border-radius:var(--radius);line-height:1.7}
  .note code{color:var(--ink)}
  .note.err{border-color:#c8a3bf;color:#8a3a6e}

  @media (prefers-reduced-motion:no-preference){
    .stage{opacity:0;transform:translateY(8px);animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards}
    @keyframes rise{to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<header>
  <span class="count" id="counter" aria-live="polite"></span>
</header>
<main>
  <figure class="stage" id="stage" hidden>
    <img id="photo" alt="" decoding="async">
    <button class="nav prev" id="prev" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="nav next" id="next" aria-label="Next photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </figure>
  <div class="meta" id="meta" hidden>
    <div class="caption">
      <span class="cap" id="cap"></span>
      <span class="metaline">
        <span class="mitem" id="m-place" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <span id="m-place-txt"></span>
        </span>
        <span class="mitem" id="m-time" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span id="m-time-txt"></span>
        </span>
      </span>
    </div>
    <span class="views" id="views" hidden aria-live="polite" title="Views">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      <span class="num" id="views-num">—</span>
    </span>
  </div>
  <div class="strip" id="strip" role="tablist" aria-label="All photos" hidden></div>
  <div class="note" id="status">Loading photos&hellip;</div>
</main>
<script>
/* ============ SET THESE ============ */
const REPO = "motiur/motiur.github.io";
const DIR  = "album/photos";
const ABACUS_NS = "motiur-album";
const ABACUS    = "https://abacus.jasoncameron.dev";

/* Overrides / gap-fillers, keyed by filename. Always win.
   Fill these for photos whose location was stripped (e.g. Facebook exports). */
const MANUAL_META = {
  // "792176906_10216446709356700_6740821373407791264_n.jpg": { place:"Dhaka, Bangladesh", date:"2019-06-01" },
  // "IMG_20220528_174840.jpg": { place:"Cox's Bazar, Bangladesh" },
};
/* =================================== */

const $ = id => document.getElementById(id);
let PHOTOS = [], i = 0;

function meta(name){
  let base = name.replace(/\.[^.]+$/,"");
  let place = "";
  const at = base.lastIndexOf("@");
  if(at > -1){ place = base.slice(at+1).replace(/[-_]/g," ").trim(); base = base.slice(0, at); }
  let caption = "";
  if(base.includes("--")) caption = base.split("--").slice(1).join(" ").replace(/[-_]/g," ").trim();
  const m = base.match(/(20\d{2})[-_]?(\d{2})[-_]?(\d{2})/);
  const date = m ? m[1]+"-"+m[2]+"-"+m[3] : "";
  return { caption, date, place };
}
function keyFor(name){ return name.replace(/\.[^.]+$/,"").replace(/[^A-Za-z0-9_.-]/g,"_").slice(0,64); }
/* iPhone HEIC/HEIF: convert to a JPEG blob URL in-browser; everything else passes through. */
function resolveSrc(p){
  if(!/\.(heic|heif)$/i.test(p.name)) return Promise.resolve(p.src);
  if(p._url) return Promise.resolve(p._url);
  if(p._conv) return p._conv;
  if(!window.heic2any) return Promise.resolve(p.src);
  p._conv = fetch(p.src).then(function(r){ if(!r.ok) throw 0; return r.blob(); })
    .then(function(b){ return heic2any({blob:b, toType:"image/jpeg", quality:0.9}); })
    .then(function(out){ var blob = Array.isArray(out)? out[0] : out; p._url = URL.createObjectURL(blob); return p._url; })
    .catch(function(){ return p.src; });
  return p._conv;
}

function fmtDate(d, withTime){
  try{
    const opts = withTime
      ? {day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}
      : {day:"numeric",month:"short",year:"numeric"};
    return new Intl.DateTimeFormat("en-GB", opts).format(d);
  }catch(e){ return ""; }
}
function fileDateText(s){ if(!s) return ""; const d=new Date(s+"T12:00:00"); return isNaN(d)? s : fmtDate(d,false); }

function updateViews(name){
  const v=$("views"), num=$("views-num");
  const key=keyFor(name), seen="viewed:"+ABACUS_NS+":"+key;
  let already=false; try{ already=localStorage.getItem(seen)==="1"; }catch(e){}
  v.hidden=false; v.classList.add("loading"); num.textContent="—";
  fetch(ABACUS+(already?"/get/":"/hit/")+encodeURIComponent(ABACUS_NS)+"/"+encodeURIComponent(key))
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){ if(name!==PHOTOS[i].name) return;
      v.classList.remove("loading"); num.textContent=Number(d.value).toLocaleString();
      if(!already){ try{ localStorage.setItem(seen,"1"); }catch(e){} } })
    .catch(function(){ v.hidden=true; });
}

function geocode(lat,lon){
  const key="geo:"+lat.toFixed(4)+","+lon.toFixed(4);
  try{ const c=localStorage.getItem(key); if(c!==null) return Promise.resolve(c); }catch(e){}
  const url="https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=en&zoom=12&addressdetails=1&lat="+lat+"&lon="+lon;
  return fetch(url).then(function(r){ return r.ok? r.json():null; }).then(function(d){
    let label="";
    if(d&&d.address){ const a=d.address;
      const loc=a.city||a.town||a.village||a.hamlet||a.suburb||a.county||a.state_district||a.state||"";
      label=[loc,a.country].filter(Boolean).join(", ");
    } else if(d&&d.display_name){ label=d.display_name.split(",").slice(0,2).join(",").trim(); }
    try{ localStorage.setItem(key,label); }catch(e){} return label;
  }).catch(function(){ return ""; });
}

function applyMeta(p){
  if(!PHOTOS[i] || p.name!==PHOTOS[i].name) return;
  const man=MANUAL_META[p.name]||{};
  const place = man.place || p.place || p._geoPlace || "";
  const time  = man.datetime || (man.date? fileDateText(man.date):"") || p._exifTime || fileDateText(p.date);
  const mp=$("m-place"), mt=$("m-time");
  if(place){ mp.hidden=false; $("m-place-txt").textContent=place; } else mp.hidden=true;
  if(time){  mt.hidden=false; $("m-time-txt").textContent=time; }   else mt.hidden=true;
}
function enrich(p){
  p._metaTried=true;
  if(!window.exifr) return;
  window.exifr.parse(p.src,{gps:true}).then(function(x){
    if(!x) return;
    if(x.DateTimeOriginal) p._exifTime=fmtDate(x.DateTimeOriginal,true);
    if(x.latitude!=null && x.longitude!=null){
      return geocode(x.latitude,x.longitude).then(function(pl){ if(pl) p._geoPlace=pl; });
    }
  }).catch(function(){}).then(function(){ applyMeta(p); });
}

function render(){
  if(!PHOTOS.length){ $("status").innerHTML='No images found in <code>'+DIR+'</code>. Upload some through GitHub and refresh.'; return; }
  $("status").hidden=true; $("stage").hidden=$("meta").hidden=$("strip").hidden=false;
  const strip=$("strip"); strip.innerHTML="";
  PHOTOS.forEach(function(p,k){
    const b=document.createElement("button");
    b.setAttribute("aria-label","Photo "+(k+1)+(p.caption? ": "+p.caption : ""));
    const t=document.createElement("img"); t.alt=""; t.loading="lazy"; resolveSrc(p).then(function(u){ t.src=u; });
    b.appendChild(t); b.addEventListener("click", function(){ show(k); }); strip.appendChild(b);
  });
  show(0);
}
function show(k, focusStrip){
  i=(k+PHOTOS.length)%PHOTOS.length;
  const p=PHOTOS[i], img=$("photo");
  img.alt=p.caption||"Photo "+(i+1); resolveSrc(p).then(function(u){ if(PHOTOS[i]===p) img.src=u; });
  $("cap").textContent=p.caption||"";
  $("counter").textContent=(i+1)+" / "+PHOTOS.length;
  document.querySelectorAll("#strip button").forEach(function(b,k2){
    b.setAttribute("aria-current", k2===i?"true":"false");
    if(k2===i && focusStrip) b.scrollIntoView({inline:"nearest",block:"nearest"});
  });
  [i+1,i-1].forEach(function(n){ const q=PHOTOS[(n+PHOTOS.length)%PHOTOS.length]; if(q) resolveSrc(q).then(function(u){ const im=new Image(); im.src=u; }); });
  applyMeta(p); if(!p._metaTried) enrich(p); updateViews(p.name);
}

fetch("https://api.github.com/repos/"+REPO+"/contents/"+DIR,{headers:{"Accept":"application/vnd.github+json"}})
  .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(function(files){
    if(!Array.isArray(files)) throw new Error("Folder not found");
    const pagePrefix=DIR.replace(/^.*?\//,"");
    PHOTOS=files.filter(function(f){ return f.type==="file" && /\.(jpe?g|png|gif|webp|avif|heic|heif)$/i.test(f.name); })
      .sort(function(a,b){ return a.name.localeCompare(b.name); })
      .map(function(f){ const m=meta(f.name); return { name:f.name, src:pagePrefix+"/"+f.name, caption:m.caption, date:m.date, place:m.place }; });
    render();
  })
  .catch(function(err){
    $("status").className="note err";
    $("status").innerHTML='Could not load the photo list ('+err.message+').<br>Check <code>REPO</code> and <code>DIR</code>, and that the repo is public.';
  });

$("prev").addEventListener("click", function(){ show(i-1,true); });
$("next").addEventListener("click", function(){ show(i+1,true); });
addEventListener("keydown", function(e){
  if(e.target.closest("input,textarea,iframe")) return;
  if(e.key==="ArrowLeft")  show(i-1,true);
  if(e.key==="ArrowRight") show(i+1,true);
});
let x0=null;
$("stage").addEventListener("touchstart", function(e){ x0=e.touches[0].clientX; }, {passive:true});
$("stage").addEventListener("touchend", function(e){
  if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; x0=null;
  if(Math.abs(dx)>40) show(dx<0? i+1:i-1, true);
}, {passive:true});
</script>
</body>
</html>
