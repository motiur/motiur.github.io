<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Journal</title>
<!--
  Photos auto-load from your repo folder (set REPO + DIR below).
  Each photo shows a VIEW COUNTER powered by Abacus, a free no-signup
  counting service (abacus.jasoncameron.dev). Each photo's count is
  keyed to its filename, so counts are per-photo.

  How the count behaves: the first time a given browser sees a photo it
  counts +1; after that the same browser only reads the number (so one
  person refreshing doesn't inflate it). If the service is down the
  counter just hides itself — the carousel still works.

  Honest limits: the number is public (anyone can read/increment the key),
  and it's an approximate "people reached", not a verified unique count.
  Fine for a personal album; not analytics-grade.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#141216;--surface:#1e1b22;--line:#2c2833;--text:#edeaf1;--muted:#8e8798;--safelight:#f2a33c;--radius:10px}
  *{box-sizing:border-box;margin:0}
  html{color-scheme:dark}
  body{background:var(--bg);color:var(--text);font-family:"Archivo",system-ui,sans-serif;font-size:15px;line-height:1.55;min-height:100svh;display:flex;flex-direction:column}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--safelight);outline-offset:2px;border-radius:4px}
  header{display:flex;align-items:baseline;justify-content:space-between;padding:20px clamp(16px,4vw,32px) 8px;max-width:920px;width:100%;margin:0 auto}
  header h1{font-size:15px;font-weight:600;letter-spacing:.02em;font-variation-settings:"wdth" 110}
  header .count{color:var(--muted);font-size:13px}
  main{width:100%;max-width:920px;margin:0 auto;padding:8px clamp(16px,4vw,32px) 40px;flex:1}
  .stage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .stage img{display:block;width:100%;height:min(66svh,560px);object-fit:contain;background:var(--surface);user-select:none;-webkit-user-drag:none}
  .nav{position:absolute;top:0;bottom:0;width:22%;min-width:56px;display:flex;align-items:center;color:var(--text);opacity:0;transition:opacity .18s ease}
  .nav:hover,.nav:focus-visible{opacity:1}
  .nav svg{width:30px;height:30px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.7))}
  .nav.prev{left:0;justify-content:flex-start;padding-left:12px;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent)}
  .nav.next{right:0;justify-content:flex-end;padding-right:12px;background:linear-gradient(270deg,rgba(0,0,0,.35),transparent)}
  @media (hover:none){.nav{opacity:.85;background:none}}
  .meta{display:flex;align-items:center;gap:12px;padding:12px 2px 0;min-height:44px}
  .caption{flex:1;color:var(--text)}
  .caption small{display:block;color:var(--muted);font-size:12.5px}
  .views{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;color:var(--muted);font-size:13px;
    border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums;
    transition:opacity .2s;white-space:nowrap}
  .views[hidden]{display:none}
  .views svg{width:15px;height:15px}
  .views .num{color:var(--text);font-weight:600}
  .views.loading .num{color:var(--muted)}
  .strip{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .strip button{flex:0 0 auto;width:64px;height:48px;border-radius:6px;overflow:hidden;border:1px solid var(--line);padding:0;opacity:.55;transition:opacity .15s,border-color .15s}
  .strip img{width:100%;height:100%;object-fit:cover;display:block}
  .strip button:hover{opacity:.85}
  .strip button[aria-current="true"]{opacity:1;border-color:var(--safelight)}
  .note{padding:64px 24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);line-height:1.7}
  .note code{color:var(--text)}
  .note.err{border-color:#5a3a3a;color:#d8a3a3}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<header>
  <h1 id="site-title">Photo Journal</h1>
  <span class="count" id="counter" aria-live="polite"></span>
</header>
<main>
  <figure class="stage" id="stage" hidden>
    <img id="photo" alt="" decoding="async">
    <button class="nav prev" id="prev" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="nav next" id="next" aria-label="Next photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </figure>
  <div class="meta" id="meta" hidden>
    <div class="caption"><span id="cap"></span><small id="date"></small></div>
    <span class="views" id="views" hidden aria-live="polite" title="Views">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      <span class="num" id="views-num">—</span>
    </span>
  </div>
  <div class="strip" id="strip" role="tablist" aria-label="All photos" hidden></div>
  <div class="note" id="status">Loading photos&hellip;</div>
</main>
<script>
/* ============ SET THESE TWO ============ */
const REPO = "motiur/motiur.github.io";   // owner/repo -- change if different
const DIR  = "album/photos";              // folder path from repo root where images live
/* If images sit in a photos/ folder at the repo root instead, use  "photos"  */

/* Counter service + a namespace unique to your album so keys don't
   collide with anyone else using the same free service. */
const ABACUS_NS = "motiur-album";          // anything unique to you
const ABACUS    = "https://abacus.jasoncameron.dev";
/* ====================================== */

const $ = id => document.getElementById(id);
let PHOTOS = [], i = 0;

function meta(name){
  const base = name.replace(/\.[^.]+$/,"");
  let caption = "";
  if(base.includes("--")) caption = base.split("--").slice(1).join(" ").replace(/[-_]/g," ").trim();
  const m = base.match(/(20\d{2})[-_]?(\d{2})[-_]?(\d{2})/);
  const date = m ? m[1]+"-"+m[2]+"-"+m[3] : "";
  return { caption, date };
}
/* a safe counter key from a filename */
function keyFor(name){ return name.replace(/\.[^.]+$/,"").replace(/[^A-Za-z0-9_.-]/g,"_").slice(0,64); }

function updateViews(name){
  const v = $("views"), num = $("views-num");
  const key = keyFor(name);
  const seen = "viewed:" + ABACUS_NS + ":" + key;
  let already = false;
  try { already = localStorage.getItem(seen) === "1"; } catch(e){}
  const endpoint = already ? "/get/" : "/hit/";   // hit = +1, get = read only
  v.hidden = false; v.classList.add("loading"); num.textContent = "—";

  fetch(ABACUS + endpoint + encodeURIComponent(ABACUS_NS) + "/" + encodeURIComponent(key))
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){
      if(name !== PHOTOS[i].name) return;         // user moved on; ignore stale response
      v.classList.remove("loading");
      num.textContent = Number(d.value).toLocaleString();
      if(!already){ try { localStorage.setItem(seen,"1"); } catch(e){} }
    })
    .catch(function(){ v.hidden = true; });        // service down -> just hide it
}

function render(){
  if(!PHOTOS.length){
    $("status").innerHTML = 'No images found in <code>'+DIR+'</code>. Upload some through GitHub and refresh.';
    return;
  }
  $("status").hidden = true;
  $("stage").hidden = $("meta").hidden = $("strip").hidden = false;
  const strip = $("strip"); strip.innerHTML = "";
  PHOTOS.forEach(function(p,k){
    const b = document.createElement("button");
    b.setAttribute("aria-label","Photo "+(k+1)+(p.caption? ": "+p.caption : ""));
    const t = document.createElement("img");
    t.src = p.src; t.alt = ""; t.loading = "lazy";
    b.appendChild(t);
    b.addEventListener("click", function(){ show(k); });
    strip.appendChild(b);
  });
  show(0);
}

function show(k, focusStrip){
  i = (k + PHOTOS.length) % PHOTOS.length;
  const p = PHOTOS[i], img = $("photo");
  img.src = p.src; img.alt = p.caption || "Photo "+(i+1);
  $("cap").textContent  = p.caption || "";
  $("date").textContent = p.date || "";
  $("counter").textContent = (i+1)+" / "+PHOTOS.length;
  document.querySelectorAll("#strip button").forEach(function(b,k2){
    b.setAttribute("aria-current", k2===i ? "true":"false");
    if(k2===i && focusStrip) b.scrollIntoView({inline:"nearest",block:"nearest"});
  });
  [i+1,i-1].forEach(function(n){ const q=PHOTOS[(n+PHOTOS.length)%PHOTOS.length]; if(q){const im=new Image();im.src=q.src;} });
  updateViews(p.name);
}

fetch("https://api.github.com/repos/"+REPO+"/contents/"+DIR, { headers:{ "Accept":"application/vnd.github+json" } })
  .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(function(files){
    if(!Array.isArray(files)) throw new Error("Folder not found");
    const pagePrefix = DIR.replace(/^.*?\//,"");
    PHOTOS = files
      .filter(function(f){ return f.type==="file" && /\.(jpe?g|png|gif|webp|avif)$/i.test(f.name); })
      .sort(function(a,b){ return a.name.localeCompare(b.name); })
      .map(function(f){ const m=meta(f.name); return { name:f.name, src: pagePrefix+"/"+f.name, caption:m.caption, date:m.date }; });
    render();
  })
  .catch(function(err){
    $("status").className = "note err";
    $("status").innerHTML = 'Could not load the photo list ('+err.message+').<br>Check <code>REPO</code> and <code>DIR</code>, and that the repo is public.';
  });

$("prev").addEventListener("click", function(){ show(i-1,true); });
$("next").addEventListener("click", function(){ show(i+1,true); });
addEventListener("keydown", function(e){
  if(e.target.closest("input,textarea,iframe")) return;
  if(e.key==="ArrowLeft")  show(i-1,true);
  if(e.key==="ArrowRight") show(i+1,true);
});
let x0=null;
$("stage").addEventListener("touchstart", function(e){ x0=e.touches[0].clientX; }, {passive:true});
$("stage").addEventListener("touchend", function(e){
  if(x0===null) return;
  const dx=e.changedTouches[0].clientX-x0; x0=null;
  if(Math.abs(dx)>40) show(dx<0? i+1:i-1, true);
}, {passive:true});
</script>
</body>
</html>
