<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mohammad Motiur Rahman</title>
<meta name="description" content="Mohammad Motiur Rahman — computer science lecturer at Independent University, Bangladesh.">
<!-- HOMEPAGE. Place at repo root as index.html, NO front matter. Delete index.md. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f1f0f4;--ink:#1a1720;--muted:#726c7a;--line:#dad6e0;--accent:#5e2b54}
  *{box-sizing:border-box;margin:0}
  html{color-scheme:light}
  body{background:var(--paper);color:var(--ink);
    font-family:"Archivo",system-ui,sans-serif;font-size:16px;line-height:1.55;
    -webkit-font-smoothing:antialiased;min-height:100svh;display:flex;flex-direction:column;
    padding:clamp(28px,7vw,80px) clamp(22px,7vw,60px)}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:3px}

  .wrap{width:100%;max-width:640px;margin:auto 0}

  .name{font-family:"Fraunces",Georgia,serif;font-weight:500;
    font-size:clamp(2.6rem,9vw,4.4rem);line-height:1.02;letter-spacing:-.015em;font-optical-sizing:auto}
  .role{margin-top:16px;color:var(--muted);
    font-size:clamp(.98rem,2.4vw,1.08rem);line-height:1.5;max-width:34ch}

  .rule{height:1px;background:var(--line);border:0;margin:clamp(32px,6vw,52px) 0}

  nav{display:flex;flex-direction:column}
  .dest{position:relative;display:flex;align-items:baseline;gap:16px;
    padding:clamp(15px,3vw,22px) 0}
  .dest + .dest{border-top:1px solid var(--line)}
  .dest .label{font-size:clamp(1.5rem,5.5vw,2.1rem);font-weight:500;
    letter-spacing:-.01em;line-height:1;transition:color .2s ease}
  .dest .desc{color:var(--muted);font-size:.9rem;flex:1;transition:color .2s ease}
  .dest .arrow{color:var(--accent);flex-shrink:0;
    transition:transform .22s cubic-bezier(.2,.7,.3,1)}
  .dest .arrow svg{width:22px;height:22px;display:block}
  .dest .label::after{content:"";position:absolute;left:0;bottom:clamp(13px,2.7vw,19px);
    height:2px;width:100%;max-width:var(--uw,0);background:var(--accent);
    transition:max-width .26s cubic-bezier(.2,.7,.3,1)}
  @media (hover:hover){
    .dest:hover .label,.dest:focus-within .label{color:var(--accent)}
    .dest:hover .desc{color:var(--ink)}
    .dest:hover .arrow,.dest:focus-within .arrow{transform:translateX(6px)}
    .dest:hover .label,.dest:focus-within .label{--uw:2.2em}
  }
  @media (hover:none){ .dest .arrow{transform:translateX(2px)} }

  footer{display:flex;gap:26px;margin-top:clamp(30px,6vw,50px);font-size:.95rem;color:var(--muted)}
  footer a{border-bottom:1px solid transparent;padding-bottom:2px;transition:color .18s,border-color .18s}
  footer a:hover{color:var(--accent);border-color:var(--accent)}

  @media (prefers-reduced-motion:no-preference){
    .reveal{opacity:0;transform:translateY(10px);animation:rise .6s cubic-bezier(.2,.7,.3,1) forwards}
    .name{animation-delay:.02s}.role{animation-delay:.10s}
    .r1{animation-delay:.20s}.r2{animation-delay:.28s}.r3{animation-delay:.36s}
    footer.reveal{animation-delay:.46s}
    @keyframes rise{to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="name reveal">Mohammad<br>Motiur Rahman</h1>
    <p class="role reveal">Computer science lecturer at Independent University, Bangladesh.</p>
    <hr class="rule">
    <nav aria-label="Sections">
      <a class="dest reveal r1" href="/projects">
        <span class="label">Projects</span>
        <span class="desc">research &amp; code</span>
        <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
      <a class="dest reveal r2" href="/teaching">
        <span class="label">Teaching</span>
        <span class="desc">courses &amp; materials</span>
        <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
      <a class="dest reveal r3" href="/album">
        <span class="label">Photos</span>
        <span class="desc">a personal album</span>
        <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
    </nav>
    <footer class="reveal">
      <a href="mailto:mohammadmmotiurrahman@gmail.com">email</a>
      <a href="https://github.com/motiur">github</a>
    </footer>
  </div>
</body>
</html>
