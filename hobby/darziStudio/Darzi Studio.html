<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Darzi Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a tailor's bench. Parts drawer on the left, a sheet of dotted pattern paper with an inch tape in the middle,
   fitting notes on the right. On phones the drawer and the notes share one bottom sheet. */
:root{
  --bg:#e7e9f3; --surface:#fbfbfe; --ink:#1a1f47; --muted:#5c6289; --line:#d3d7e8; --chip:#eceef7;
  --accent:#b3125a; --on-accent:#ffffff; --drop:#d98a00;
  --sheet:#f8f9fd; --sheet-dot:#c6cbe0; --sheet-ink:#454b75; --tape:#f4d35e; --tape-ink:#3d3200; --mark:#b3125a;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14162c; --surface:#1d2040; --ink:#eceefb; --muted:#a4a9cc; --line:#343963; --chip:#272b52;
    --accent:#ff6aa8; --on-accent:#2a0016; --drop:#ffbf3c;
    --sheet:#e3e6f3; --sheet-dot:#b1b7d2; --sheet-ink:#3a3f66; --tape:#efcd55; --tape-ink:#3d3200; --mark:#b3125a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14162c; --surface:#1d2040; --ink:#eceefb; --muted:#a4a9cc; --line:#343963; --chip:#272b52;
  --accent:#ff6aa8; --on-accent:#2a0016; --drop:#ffbf3c;
  --sheet:#e3e6f3; --sheet-dot:#b1b7d2; --sheet-ink:#3a3f66; --tape:#efcd55; --tape-ink:#3d3200; --mark:#b3125a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.4 var(--ui);overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;height:100%;grid-template-columns:292px minmax(0,1fr) 304px;grid-template-rows:auto auto minmax(0,1fr);
  grid-template-areas:"top top top" "tabs stage insp" "tray stage insp"}
.top{grid-area:top;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font:700 19px/1 var(--display);letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:28px;height:28px;flex:none}
.name{flex:1;min-width:0;max-width:300px;border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 10px;font-weight:500}
.name:hover{border-color:var(--line)}
.name:focus{border-color:var(--accent);outline:none;background:var(--bg)}
.actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.pick{display:flex;gap:8px;align-items:center;flex:none;min-width:0}
.dress{display:flex;gap:2px;background:var(--chip);border-radius:999px;padding:3px;flex:none}
.dress button{border:0;background:transparent;border-radius:999px;padding:6px 13px;font-weight:600;font-size:13px;white-space:nowrap}
.dress button:hover{background:var(--surface)}
.dress button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:36px;min-width:36px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--chip)}
.btn:disabled{opacity:.38;cursor:default}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600;padding:0 14px}
.btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}

.tabs{grid-area:tabs;display:flex;flex-wrap:wrap;gap:6px;padding:14px 16px 4px;background:var(--surface);border-right:1px solid var(--line)}
.tab{border:0;background:var(--chip);border-radius:999px;padding:6px 12px;font-weight:500;font-size:13px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.tab-style{display:none}

.tray{grid-area:tray;background:var(--surface);border-right:1px solid var(--line);padding:12px 16px 16px;overflow-y:auto;
  display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.card{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 5px 7px;display:flex;flex-direction:column;gap:5px;
  text-align:center;font-size:12px;font-weight:500;line-height:1.2;user-select:none;-webkit-user-select:none;touch-action:pan-y;cursor:grab;min-width:0}
.card svg{display:block;width:100%;aspect-ratio:3/4;background:var(--sheet);border-radius:6px;pointer-events:none}
.card:hover{border-color:var(--muted)}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ghost{position:fixed;z-index:50;width:84px;pointer-events:none;transform:translate(-50%,-62%) rotate(-4deg);background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 12px 28px rgb(10 12 30/.3)}
.ghost svg{display:block;width:100%;aspect-ratio:3/4;background:var(--sheet);border-radius:6px}

.stage{grid-area:stage;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 16px 14px;position:relative;transition:background .15s}
.hint{margin:0;font-size:12.5px;color:var(--muted);text-align:center}
#canvas{flex:1 1 0;min-height:0;width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.app[data-drag] .stage{background:color-mix(in srgb,var(--drop) 16%,var(--bg))}
.dropnote{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:6px 12px;
  border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap;pointer-events:none;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#canvas .sheet{fill:var(--sheet)}
#canvas .sdot{fill:var(--sheet-dot)}
#canvas .tape{fill:var(--tape)}
#canvas .tick{stroke:var(--tape-ink);stroke-width:.8;fill:none}
#canvas .rnum{fill:var(--sheet-ink);font:600 8px var(--ui)}
#canvas .mark{stroke:var(--mark);stroke-width:1;stroke-dasharray:3 3;fill:none}
#canvas .pill{fill:var(--mark)}
#canvas .pilltxt{fill:#fff;font:600 8.5px var(--ui)}
#canvas [data-piece]{cursor:pointer}
#canvas [data-motif]{cursor:grab}
#canvas .sel{filter:drop-shadow(0 0 2.5px var(--mark)) drop-shadow(0 0 1px var(--mark))}
#canvas[data-drop="kameez"] [data-piece="kameez"],#canvas[data-drop="salwar"] [data-piece="salwar"],#canvas[data-drop="dupatta"] [data-piece="dupatta"]{filter:drop-shadow(0 0 5px #d98a00) drop-shadow(0 0 1.5px #d98a00)}
#canvas .ring{fill:none;stroke:var(--mark);stroke-width:1.2;stroke-dasharray:4 3}
#canvas .handle{fill:var(--mark);stroke:#fff;stroke-width:2;cursor:nwse-resize}
#canvas .hhit{fill:#000;fill-opacity:0;cursor:nwse-resize}

.insp{grid-area:insp;background:var(--surface);border-left:1px solid var(--line);padding:14px 16px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.insp h2{margin:0;font:700 20px/1.1 var(--display);letter-spacing:-.01em;text-wrap:balance}
.insp .sub{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.group{display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px solid var(--line)}
.group>h3{margin:0;font:600 11px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lab{font-size:12.5px;font-weight:500;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.lab i{font-style:normal;color:var(--muted);font-weight:400}
.lab output{font-variant-numeric:tabular-nums;color:var(--muted)}
.sws{display:flex;flex-wrap:wrap;gap:7px}
.sw{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--c);padding:0;position:relative;flex:none}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.sw.pick{background:conic-gradient(#e33,#ec3,#3b6,#39d,#93d,#e33);overflow:hidden;cursor:pointer}
.sw.pick:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.sw.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip.danger{color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);margin:0;height:22px;display:block}
.note{margin:0;color:var(--muted);font-size:12.5px;max-width:60ch}
.field>.note{margin-top:7px}
.cloth{display:flex;gap:10px;align-items:center}
.cloth img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none}
.chip.up{position:relative;overflow:hidden;cursor:pointer;display:inline-block}
.chip.up.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600;padding:7px 14px}
.chip.up input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.chip.up:focus-within{outline:2px solid var(--accent);outline-offset:2px}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500;z-index:60;max-width:calc(100% - 32px);text-align:center}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:16px;width:min(400px,calc(100vw - 32px))}
dialog::backdrop{background:rgb(10 12 30/.55)}
dialog h2{margin:0 0 4px;font:700 20px/1.1 var(--display)}
dialog p{margin:0 0 12px;color:var(--muted);font-size:13px}
dialog img{display:block;max-width:100%;max-height:56vh;margin:0 auto 12px;border-radius:8px;border:1px solid var(--line)}
dialog .btn{width:100%}

@media (max-width:1080px) and (min-width:821px){
  .app{grid-template-columns:236px minmax(0,1fr) 268px}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "stage" "tabs" "sheet"}
  .brand span{display:none}
  .top{flex-wrap:wrap;row-gap:8px}
  .pick{order:9;flex:1 0 100%}
  .pick #dress{flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
  .pick #dress::-webkit-scrollbar{display:none}
  .dress button{padding:7px 6px;font-size:12px}
  .pick #dress button{flex:1 0 auto}
  .name{max-width:none}
  .stage{padding-block:6px 8px}
  .hint{font-size:12px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;border-right:0;border-top:1px solid var(--line);padding:8px 16px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab-style{display:block;box-shadow:inset 0 0 0 1px var(--accent);background:var(--surface);color:var(--accent)}
  .tab-style[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
  .app[data-view="style"] .tab:not(.tab-style)[aria-selected="true"]{background:var(--chip);color:var(--ink)}
  .tray,.insp{grid-area:sheet;height:clamp(172px,33vh,290px);border:0}
  .tray{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:2px 16px 12px}
  .card{flex:0 0 92px;touch-action:pan-x}
  .card svg{flex:1 1 0;min-height:0;height:0;aspect-ratio:auto}
  .insp{padding-top:6px}
  .app[data-view="style"] .tray,.app[data-view="parts"] .insp{display:none}
}
@media (max-height:560px){.hint{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app" data-view="parts">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#b3125a"/><path d="M12.5,22 C6,22 5,13.5 9.5,9.5 C13.5,6 18,8.5 20.5,3.5 C22.5,10.5 21.5,15.5 18,19 C16,21 14.5,22 12.5,22 Z" fill="#fff"/><circle cx="12.6" cy="16" r="2.3" fill="#b3125a"/></svg>
      <span>Darzi Studio</span>
    </div>
    <div class="pick"><div class="dress" id="group" role="group" aria-label="Women's or men's wear"></div><div class="dress" id="dress" role="group" aria-label="Which dress to design"></div></div>
    <input class="name" id="design-name" type="text" maxlength="40" aria-label="Design name" autocomplete="off">
    <div class="actions">
      <button class="btn" id="undo" type="button" aria-label="Undo" title="Undo"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4 3 8l4 4"/><path d="M3 8h8.5a5 5 0 0 1 0 10H8"/></svg></button>
      <button class="btn" id="redo" type="button" aria-label="Redo" title="Redo"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13 4 4 4-4 4"/><path d="M17 8H8.5a5 5 0 0 0 0 10H12"/></svg></button>
      <button class="btn primary" id="save" type="button">Save picture</button>

  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Parts"></nav>

  <img id="export-img" alt="Picture of your salwar kameez design">
  <button class="btn" id="export-close" type="button">Close</button>
</dialog>

<script>
(()=>{'use strict';
/* ---------- geometry helpers ---------- */
const CX=200, SH=112, IN=9.46;               // centre line, shoulder line, drawing units per inch
const f=n=>Math.round(n*10)/10, f2=n=>Math.round(n*100)/100;
const pt=p=>f(p[0])+','+f(p[1]);
const mir=p=>[400-p[0],p[1]];
const flip=d=>d.replace(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g,(m,x,y)=>f(400-x)+','+y);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function through(p){let d='';for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;
  d+=` C ${pt([p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6])} ${pt([p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6])} ${pt(p2)}`;}return d;}
function xAt(poly,y){if(y<=poly[0][1])return poly[0][0];for(let i=1;i<poly.length;i++){if(y<=poly[i][1]){const a=poly[i-1],b=poly[i];return a[0]+(b[0]-a[0])*(y-a[1])/(b[1]-a[1]);}}return poly[poly.length-1][0];}

const GOLD='#d8ab2e';

const SW=[['#fbf7ee','Ivory'],['#f1e9d8','Ecru'],['#f4b393','Peach'],['#e6a817','Haldi yellow'],['#d8ab2e','Zari gold'],['#c62828','Sindoor red'],['#c2185b','Rani pink'],['#6d1b2b','Maroon'],['#5b2a86','Jamuni purple'],['#b39ddb','Lilac'],['#27357e','Neel indigo'],['#8ec5e8','Asmani blue'],['#1aa6a6','Firozi'],['#0b6e75','Peacock'],['#0f4d3a','Bottle green'],['#5a7d2a','Mehndi green'],['#c9ccd3','Silver'],['#1c1c22','Black']];

const cloths={};                              // uploaded cloth photos: id -> {data, url, w, h}
function clothPat(id,o,embed){
  const c=cloths[o.cloth],W=120*(o.clothScale||1),H=W*c.h/c.w,src=embed?c.data:c.url;
  const img=(x,y,sx,sy)=>`<image href="${src}" width="${f(W+.4)}" height="${f(H+.4)}" preserveAspectRatio="none" transform="translate(${f(x)},${f(y)}) scale(${sx},${sy})"/>`;
  if(o.clothFit==='tile')return`<pattern id="${id}" patternUnits="userSpaceOnUse" width="${f(W)}" height="${f(H)}">${img(0,0,1,1)}</pattern>`;
  return`<pattern id="${id}" patternUnits="userSpaceOnUse" width="${f(2*W)}" height="${f(2*H)}">${img(0,0,1,1)}${img(2*W,0,-1,1)}${img(0,2*H,1,-1)}${img(2*W,2*H,-1,-1)}</pattern>`;
}

    case'zigzag':w=16;h=12;b=`<path d="M0,9 L4,3 L8,9 L12,3 L16,9" fill="none" stroke="${c}" stroke-width="2"/>`;break;
    case'leheriya':w=16;h=9;tr=' patternTransform="rotate(-45)"';b=`<path d="M0,4.5 Q4,1 8,4.5 T16,4.5" fill="none" stroke="${c}" stroke-width="2.3"/>`;break;
    case'ajrakh':w=h=24;b=`<circle cx="12" cy="12" r="9.5" fill="none" stroke="${c}" stroke-width="1.2"/><path d="M12,3.5 L14.6,9.4 L20.5,12 L14.6,14.6 L12,20.5 L9.4,14.6 L3.5,12 L9.4,9.4 Z" fill="${c}"/><circle cx="12" cy="12" r="2" fill="${o.color}"/>`+[[0,0],[24,0],[0,24],[24,24]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.2" fill="${c}"/><circle cx="${x}" cy="${y}" r="1.2" fill="${o.color}"/>`).join('');break;

      out+=`<path d="${t}" ${ln(du.border.on?du.border.color:dol,1.1)}/>`;}
    out+='</g>';
  }

function overlay(){

  o+=`<path d="M 36,${T} H ${f((isMale(doc.dress)?1.1*g.LE[0]-20:g.LE[0])-4)}" class="mark"/><rect x="38" y="${T-8}" width="36" height="15" rx="7.5" class="pill"/><text x="56" y="${T+3}" text-anchor="middle" class="pilltxt">${Math.round((T-SH)/IN)} in</text></g>`;
  const m=selMotif();

    if(m.mirror)o+=`<circle cx="${f(400-m.x)}" cy="${f(m.y)}" r="${f(R)}" class="ring" opacity=".5" pointer-events="none"/>`;
    o+=`<g data-handle="1"><circle cx="${f(hxp)}" cy="${f(hyp)}" r="17" class="hhit"/><circle cx="${f(hxp)}" cy="${f(hyp)}" r="7" class="handle"/></g>`;}
  return o;
}

const $=id=>document.getElementById(id);
const app=$('app'),svg=$('canvas'),tray=$('tray'),insp=$('insp'),tabsEl=$('tabs'),stage=$('stage'),nameEl=$('design-name'),dropnote=$('dropnote');
const selMotif=()=>state.motifs.find(m=>m.id===ui.sel)||null;

const usedCloths=src=>{const s=new Set();(src.match(/"cloth":"[^"]+"/g)||[]).forEach(m=>s.add(m.slice(9,-1)));return s;};
const packCloths=ids=>{const o={};ids.forEach(id=>{const c=cloths[id];if(c)o[id]={data:c.data,w:c.w,h:c.h};});return o;};
function mkUrl(c){try{const bin=atob(c.data.split(',')[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);c.url=URL.createObjectURL(new Blob([u],{type:'image/jpeg'}));}catch(e){c.url=c.data;}}

nameEl.addEventListener('change',()=>{state.name=nameEl.value.trim()||'My '+DRESS[doc.dress].name.toLowerCase();commit();render();});
const dressEl=$('dress'),groupEl=$('group');
groupEl.innerHTML=[['women','Women'],['men','Men']].map(([g,n])=>`<button type="button" id="group-${g}" data-group="${g}">${n}</button>`).join('');
function switchDress(k){if(!DRESS[k]||k===doc.dress)return;const skin=state.skin;doc.dress=k;doc.last[DRESS[k].group]=k;state=doc.designs[k];state.skin=skin;ui.sel=null;ui.tab='looks';ui.view='parts';commit();render();tray.scrollLeft=0;tray.scrollTop=0;}
dressEl.addEventListener('click',e=>{const b=e.target.closest('button');if(b)switchDress(b.dataset.dress);});
groupEl.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.dataset.group!==DRESS[doc.dress].group)switchDress(doc.last[b.dataset.group]);});
function buildTabs(){const D=DRESS[doc.dress];tabsEl.dataset.dress=doc.dress;
  tabsEl.innerHTML=`<button type="button" class="tab tab-style" role="tab" id="tab-style" data-tab="style">Style</button>`+D.tabs.map(id=>`<button type="button" class="tab" role="tab" id="tab-${id}" data-tab="${id}">${tabName(id)}</button>`).join('');
  Object.assign(NOTE,{cut:`Drop to change the ${D.top.toLowerCase()}`,salwar:`Drop to change the ${D.bottom.toLowerCase()}`,dupatta:`Drop to change the ${D.drape.toLowerCase()}`});}
$('undo').addEventListener('click',()=>step(-1));
$('redo').addEventListener('click',()=>step(1));
tabsEl.addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;if(t.dataset.tab==='style')ui.view='style';else{ui.tab=t.dataset.tab;ui.view='parts';try{localStorage.setItem(KEY+'-tab',ui.tab);}catch(err){}}render();tray.scrollLeft=0;tray.scrollTop=0;});

/* ---------- drag from the tray ---------- */
let drag=null,noClick=false;
const NOTE={looks:'Drop to wear this whole look',surprise:'Drop for a surprise',cut:'Drop to change the kameez',neck:'Drop to change the neckline',sleeve:'Drop to change the sleeves',salwar:'Drop to change the salwar',dupatta:'Drop to change the dupatta',motif:'Drop where you want the motif'};
tray.addEventListener('pointerdown',e=>{const c=e.target.closest('.card');if(!c||(e.pointerType==='mouse'&&e.button!==0))return;drag={c,id:e.pointerId,x:e.clientX,y:e.clientY,on:false,ghost:null};});
function endDrag(){if(!drag)return;if(drag.ghost)drag.ghost.remove();delete app.dataset.drag;svg.removeAttribute('data-drop');dropnote.hidden=true;drag=null;}
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  if(!drag.on){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;
    drag.on=true;noClick=true;const g=document.createElement('div');g.className='ghost';g.appendChild(drag.c.querySelector('svg').cloneNode(true));document.body.appendChild(g);drag.ghost=g;
    const kind=drag.c.dataset.kind;app.dataset.drag=kind;if(PIECE[kind])svg.dataset.drop=PIECE[kind];dropnote.textContent=NOTE[kind]||'';dropnote.hidden=false;
    try{drag.c.setPointerCapture(e.pointerId);}catch(err){}}
  drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
});
window.addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag,was=d.on;endDrag();
  if(was){const el=document.elementFromPoint(e.clientX,e.clientY);
    if(el&&stage.contains(el))applyCard(d.c.dataset.kind,d.c.dataset.id,d.c.dataset.kind==='motif'?svgPt(e):null);
    setTimeout(()=>{noClick=false;},60);}
});
window.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.id){endDrag();noClick=false;}});
tray.addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;if(noClick){noClick=false;return;}applyCard(c.dataset.kind,c.dataset.id,null);});

/* ---------- canvas: select, move, resize ---------- */
function svgPt(e){const m=svg.getScreenCTM();if(!m)return[200,300];const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());return[p.x,p.y];}
let grab=null;
svg.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-handle]'),mg=e.target.closest('[data-motif]'),pc=e.target.closest('[data-piece]');
  if(h||mg){const id=h?ui.sel:mg.dataset.motif,mo=state.motifs.find(x=>x.id===id);if(!mo)return;
    ui.sel=id;const[x,y]=svgPt(e);grab={mode:h?'tf':'mv',mo,x,y,ox:mo.x,oy:mo.y,sign:mg&&mg.dataset.mir?-1:1,moved:false,id:e.pointerId};
    try{svg.setPointerCapture(e.pointerId);}catch(err){}drawMain();e.preventDefault();return;}
  ui.sel=pc?pc.dataset.piece:null;if(pc)ui.view='style';render();
});
svg.addEventListener('pointermove',e=>{
  if(!grab||e.pointerId!==grab.id)return;const[x,y]=svgPt(e),m=grab.mo;
  if(grab.mode==='mv'){if(!grab.moved&&Math.hypot(x-grab.x,y-grab.y)<2)return;m.x=clamp(grab.ox+(x-grab.x)*grab.sign,20,380);m.y=clamp(grab.oy+(y-grab.y),20,636);}
  else{const vx=x-m.x,vy=y-m.y;m.s=clamp(Math.hypot(vx,vy)/26,.4,4);let r=Math.atan2(vy,vx)*180/Math.PI-45;if(r<-180)r+=360;m.r=Math.round(r);}
  grab.moved=true;drawMain();
});
const drop=e=>{if(!grab||e.pointerId!==grab.id)return;const mv=grab.moved;grab=null;ui.view='style';if(mv)commit();render();};
svg.addEventListener('pointerup',drop);svg.addEventListener('pointercancel',drop);
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)&&e.target.type!=='range';
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();step(e.shiftKey?1:-1);return;}
  const m=selMotif();if(!m||typing||e.target.type==='range')return;
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();act('del');return;}
  const d={ArrowLeft:[-2,0],ArrowRight:[2,0],ArrowUp:[0,-2],ArrowDown:[0,2]}[e.key];
  if(d){e.preventDefault();m.x=clamp(m.x+d[0],20,380);m.y=clamp(m.y+d[1],20,636);commit();render();}
});

/* ---------- picture ---------- */
$('save').addEventListener('click',()=>{
  const body=draw(state,'x',{embed:true}),src=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" width="800" height="1300"><rect width="400" height="650" fill="#f8f9fd"/>${body}</svg>`;
  const dlg=$('export'),img=$('export-img'),show=u=>{img.src=u;if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');};
  const fallback=()=>show('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(src));
  try{
    const url=URL.createObjectURL(new Blob([src],{type:'image/svg+xml'})),im=new Image();
    im.onload=()=>{try{const c=document.createElement('canvas');c.width=800;c.height=1390;const x=c.getContext('2d');x.fillStyle='#f8f9fd';x.fillRect(0,0,800,1390);x.drawImage(im,0,0,800,1300);
      x.fillStyle='#1a1f47';x.textAlign='center';x.font='600 34px system-ui, sans-serif';x.fillText(state.name,400,1345,740);show(c.toDataURL('image/png'));}catch(err){fallback();}URL.revokeObjectURL(url);};
    im.onerror=()=>{URL.revokeObjectURL(url);fallback();};im.src=url;
  }catch(err){fallback();}
});
$('export-close').addEventListener('click',()=>$('export').close());

/* ---------- start ---------- */
function valid(d,k){const c=d&&d.kameez&&CUTS[d.kameez.cut];return!!(c&&cutOK(d.kameez.cut,k)&&NECKS[d.kameez.neck]&&SLEEVES[d.kameez.sleeve]&&d.kameez.border&&d.salwar&&BOTTOMS[k][d.salwar.style]&&d.salwar.border&&d.dupatta&&DRAPES[k][d.dupatta.style]&&d.dupatta.border&&Array.isArray(d.motifs)&&d.motifs.every(m=>MOTIFS[m.type]));}
function start(data){
  let dc=data&&data.doc,cs=data&&data.cloths;
  if(!dc){try{dc=JSON.parse(localStorage.getItem(DOCKEY));}catch(e){dc=null;}}
  if(!dc){let old=data&&data.state;if(!old){try{old=JSON.parse(localStorage.getItem(KEY));}catch(e){old=null;}}if(old)dc={dress:'suit',designs:{suit:old}};}
  if(!cs){try{cs=JSON.parse(localStorage.getItem(KEY+'-cloths'));}catch(e){cs=null;}}
  if(cs)Object.entries(cs).forEach(([id,c])=>{if(c&&c.data&&c.w&&c.h&&!cloths[id]){cloths[id]={data:c.data,w:c.w,h:c.h};mkUrl(cloths[id]);}});
  if(dc&&dc.designs)Object.keys(DRESS).forEach(k=>{const d=dc.designs[k];if(valid(d,k)){d.dress=k;doc.designs[k]=d;}});
  if(dc&&DRESS[dc.dress])doc.dress=dc.dress;
  if(dc&&dc.last)['women','men'].forEach(g=>{const k=dc.last[g];if(DRESS[k]&&DRESS[k].group===g)doc.last[g]=k;});
  doc.last[DRESS[doc.dress].group]=doc.dress;
  state=doc.designs[doc.dress];
  Object.values(doc.designs).forEach(d=>GARMENTS.forEach(p=>{if(d[p].cloth&&!cloths[d[p].cloth])delete d[p].cloth;}));
  try{const t=localStorage.getItem(KEY+'-tab');if(DRESS[doc.dress].tabs.includes(t))ui.tab=t;}catch(e){}
  hist=[JSON.stringify(doc)];hi=0;render();
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({doc,cloths:packCloths(Object.keys(cloths))}));}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>
