<style>
/* Layout: one narrow column. Sticky header with a 12-week strip, tabbed views below, tasks as 44px touch rows. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --fg:#16202B; --muted:#5B6877; --line:#D9DFE6;
  --accent:#1D5FD1; --accent-soft:#E3ECFB; --done:#1E7F55; --done-soft:#E0F2E9; --on-done:#FFFFFF; --warn:#A8530B;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141B; --surface:#161E28; --fg:#E6EBF1; --muted:#93A0AF; --line:#263241;
    --accent:#7AA7F5; --accent-soft:#1B2B45; --done:#4CC38A; --done-soft:#14301F; --on-done:#0E141B; --warn:#E3A25B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#161E28; --fg:#E6EBF1; --muted:#93A0AF; --line:#263241;
  --accent:#7AA7F5; --accent-soft:#1B2B45; --done:#4CC38A; --done-soft:#14301F; --on-done:#0E141B; --warn:#E3A25B;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-bottom:48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible+.box,input[type=number]:focus-visible,input[type=date]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
.eyebrow{font:500 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:4px}
h1{font:600 20px/1.2 var(--sans);margin:0;text-wrap:balance}
.pct{font:500 20px/1 var(--mono);font-variant-numeric:tabular-nums}
.pct small{font-size:12px;color:var(--muted);margin-left:4px}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:10px}
.seg{position:relative;height:30px;border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:hidden;padding:0;
  font:500 10px/1 var(--mono);color:var(--muted)}
.seg i{position:absolute;left:0;right:0;bottom:0;background:var(--done-soft);border-top:2px solid var(--done)}
.seg span{position:relative}
.seg.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--fg)}
.status{margin-top:8px;font:400 11px/1.2 var(--mono);color:var(--muted)}

nav{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:12px 0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
nav button{border:0;background:none;padding:10px 4px;font:500 13px/1 var(--sans);color:var(--muted);min-height:44px}
nav button+button{border-left:1px solid var(--line)}
nav button[aria-selected=true]{background:var(--accent-soft);color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.panel>h2{margin:0;padding:12px 14px 4px;font:600 14px/1.3 var(--sans)}
.panel .sub{padding:0 14px 8px;color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.card-h{width:100%;display:grid;grid-template-columns:1fr auto 16px;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:12px 14px;min-height:56px}
.card-h .nm{font-weight:600;font-size:14.5px}
.card-h .nt{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:2px}
.card-h .ct{font:500 12px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.card-h .ct.full{color:var(--done)}
.chev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.card.open .chev{transform:rotate(-135deg)}
.bar{height:3px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--done)}
.tasks{display:none;border-top:1px solid var(--line)}
.card.open .tasks{display:block}
.info{padding:10px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bg)}
.info b{color:var(--fg);font-weight:500}

.task{position:relative;display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:start;padding:11px 14px;min-height:44px;cursor:pointer}
.panel .task:first-of-type{border-top:0}
.task+.task{border-top:1px solid var(--line)}
.task input{position:absolute;left:0;top:0;width:48px;height:100%;opacity:0;margin:0;cursor:pointer}
.box{width:22px;height:22px;border:1.5px solid var(--muted);border-radius:5px;margin-top:1px;position:relative;background:var(--surface)}
.task input:checked+.box{background:var(--done);border-color:var(--done)}
.task input:checked+.box::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--on-done);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.task input:checked~.tx{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.tx{font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.tx a{text-decoration:none;font-size:13px;margin-left:2px}
.tag{font:500 10.5px/1 var(--mono);letter-spacing:.03em;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:4px 5px;white-space:nowrap;margin-top:2px}
.tag.late{color:var(--warn);border-color:var(--warn)}
.tag.g{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.tools{display:flex;justify-content:flex-end;margin:0 0 8px}
.link{background:none;border:0;color:var(--accent);font-size:13px;padding:8px 2px;min-height:36px}
.empty{padding:6px 14px 14px;color:var(--muted);font-size:13.5px}

.wk-h .dt{font:400 12px/1 var(--mono);color:var(--muted)}
.cur-badge{font:500 10px/1 var(--mono);color:var(--accent);background:var(--accent-soft);padding:3px 5px;border-radius:3px;margin-left:6px;vertical-align:1px}

.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.field label{font-size:14px}
input[type=date],input[type=number]{font:400 14px var(--mono);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px;min-height:40px;color-scheme:inherit}
input[type=number]{width:76px;text-align:right}
.hrow{display:grid;grid-template-columns:52px 1fr 76px;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.hrow .w{font:500 12px/1.2 var(--mono)}
.hrow .w small{display:block;color:var(--muted);font-weight:400;font-size:10.5px}
.hbar{position:relative;height:8px;background:var(--bg);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.hbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.hbar i.ok{background:var(--done)}
.hbar::after{content:"";position:absolute;left:66.6%;top:0;bottom:0;width:1px;background:var(--muted);opacity:.6}
.total{font:500 13px/1 var(--mono);padding:12px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between}
.btns{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:10px 14px;min-height:44px;font-size:14px}
.btn.danger{color:var(--warn);border-color:var(--warn)}
textarea.out{width:calc(100% - 28px);margin:0 14px 14px;height:150px;font:12px/1.4 var(--mono);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
.note{padding:10px 14px 14px;font-size:12.5px;color:var(--muted)}
.rowbar{display:grid;grid-template-columns:78px 1fr 92px;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.rowbar .n{font-size:13px}
.rb{position:relative;height:10px;background:var(--bg);border:1px solid var(--line);border-radius:5px}
.rb i{position:absolute;top:-1px;bottom:-1px;background:var(--accent);border-radius:5px;min-width:6px}
.rowbar .v{font:500 12px/1.2 var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.kv{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.kv b{display:block;font:500 11px/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.srcs a{margin-right:12px;font-size:13px;display:inline-block;padding:4px 0}
.task .sp{width:1px}
.steprow{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:11px 14px;min-height:44px}
.steprow .tx b{font-weight:500}
.steprow .ct{font:500 12px/1 var(--mono);color:var(--muted)}
.steprow .ct.full{color:var(--done)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>

/* ---------- Persistence ---------- */
function setStatus(){
  var el=document.getElementById('status');
  var s=syncMode==='synced'?(dirty||writing?'Saving...':'Saved. Syncs across your devices.'):'Saved on this device only.';
  el.textContent=s;
}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function save(){
  saveLocal();
  if(!ref){setStatus();return;}
  dirty=true;setStatus();
  clearTimeout(timer);timer=setTimeout(flush,600);
}
async function flush(){
  if(!ref||writing){if(writing){timer=setTimeout(flush,300);}return;}
  writing=true;dirty=false;
  try{await ref.set(JSON.parse(JSON.stringify(state)));}
  catch(e){syncMode='local';ref=null;}
  writing=false;setStatus();
}
function adopt(d){
  if(!d||typeof d!=='object')return;
  state={start:d.start||state.start,done:d.done||{},hours:d.hours||{}};
  saveLocal();render();
}
async function initDb(){
  try{
    if(!window.claude||!window.claude.use)return;
    var d=await window.claude.use('db');
    if(!d)return;
    var r=d.doc('tracker/state');
    var snap=await r.get();
    db=d;ref=r;syncMode='synced';
    if(snap.exists){adopt(snap.data());}
    else if(Object.keys(state.done).length||Object.keys(state.hours).length){save();}
    r.onSnapshot(function(s){
      if(!s.exists||s.metadata.hasPendingWrites||dirty||writing)return;
      var data=s.data();
      if(JSON.stringify(data)!==JSON.stringify(state))adopt(data);
    },function(){syncMode='local';ref=null;setStatus();});
    setStatus();
  }catch(e){syncMode='local';ref=null;setStatus();}
}

    var s=stats(function(k){return k.g===g.id;});
    out.push(g.n+' ('+s.d+'/'+s.t+')');
    tasks.filter(function(k){return k.g===g.id;}).forEach(function(k){out.push((state.done[k.id]?'[x] ':'[ ] ')+'W'+k.w+' '+k.t);});
    out.push('');
  });
  return out.join('\n');
}

/* ---------- Events ---------- */
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.t){
    if(t.checked)state.done[t.dataset.t]=1;else delete state.done[t.dataset.t];
    save();render();return;
  }
  if(t.id==='startDate'&&t.value){state.start=t.value;save();render();return;}
  if(t.dataset&&t.dataset.h){render();}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.h){
    var n=t.dataset.h,v=parseFloat(t.value);
    if(t.value===''||isNaN(v))delete state.hours[n];else state.hours[n]=Math.max(0,Math.min(80,v));
    var b=document.getElementById('hb'+n);
    if(b){b.style.width=Math.min(100,100*(parseFloat(state.hours[n])||0)/12)+'%';b.className=(parseFloat(state.hours[n])||0)>=8?'ok':'';}
    var tt=document.getElementById('htotal');if(tt)tt.textContent=hoursTotal()+' h';
    save();
  }
});
document.addEventListener('click',function(e){
  var el=e.target.closest('button');if(!el)return;
  if(el.dataset.tab){tab=el.dataset.tab;copyText='';render();window.scrollTo(0,0);return;}
  if(el.dataset.wk){tab='weeks';var n=+el.dataset.wk;openW[n]=true;render();var c=document.querySelector('[data-w="'+n+'"]');if(c)c.scrollIntoView({block:'start'});return;}
  if(el.dataset.g){openG[el.dataset.g]=!openG[el.dataset.g];render();return;}
  if(el.dataset.w){var k=+el.dataset.w;var cur=openW[k]!==undefined?openW[k]:(k===clampW(curWeek()||1));openW[k]=!cur;render();return;}
  if(el.dataset.go){tab=el.dataset.go;if(el.dataset.open)openS[el.dataset.open.slice(1)]=true;copyText='';render();window.scrollTo(0,0);return;}
  if(el.dataset.s){openS[el.dataset.s]=!openS[el.dataset.s];render();return;}
  if(el.dataset.c){openC[el.dataset.c]=!openC[el.dataset.c];render();return;}
  var a=el.dataset.act;
  if(a==='stepall'){var si=+el.dataset.i,allDone=cStepDone(si)===CO.length;CO.forEach(function(c){var id='c.'+c.k+'.'+si;if(allDone)delete state.done[id];else state.done[id]=1;});save();render();return;}
  if(a==='toggleAll'){allG=!allG;if(!allG)openG={};render();return;}
  if(a==='copy'){
    copyText=buildCopy();
    var done=function(){render();};
    try{navigator.clipboard.writeText(copyText).then(done,done);}catch(x){done();}
    return;
  }
  if(a==='reset'){
    if(!resetArmed){resetArmed=true;render();setTimeout(function(){if(resetArmed){resetArmed=false;if(tab==='log')render();}},4000);return;}
    resetArmed=false;state.done={};state.hours={};copyText='';save();render();return;
  }
});

render();
initDb();
})();
</script>

</body></html>
