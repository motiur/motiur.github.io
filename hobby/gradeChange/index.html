<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grade Change Form</title>

<!-- PDF engine -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
  :root{
    --brand:#1a4d8f;
    --brand-dark:#123a6b;
    --text:#202124;
    --muted:#5f6368;
    --border:#dadce0;
    --bg:#eef1f6;
    --danger:#d93025;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}

  body{
    margin:0;
    padding:24px 12px 60px;
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Card ---------- */
  .page{
    max-width:900px;
    margin:0 auto;
    background:#fff;
    border-radius:14px;
    box-shadow:0 1px 3px rgba(16,24,40,.08), 0 12px 32px rgba(16,24,40,.10);
  }

  .topbar{
    height:8px;
    border-radius:14px 14px 0 0;
    background:linear-gradient(90deg,var(--brand),#2f7ad6);
  }

  /* ---------- Header ---------- */
  .form-header{
    display:flex;
    align-items:center;
    gap:18px;
    padding:24px 32px;
    border-bottom:1px solid #e8eaed;
  }

  .brand-logo{flex:0 0 auto;}

  .brand-logo img{
    display:block;
    height:64px;
    width:auto;
    max-width:200px;
    object-fit:contain;
  }

  .logo-placeholder{
    height:64px;
    width:64px;
    border-radius:12px;
    background:var(--brand);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:20px;
    letter-spacing:1px;
  }

  .form-header h1{
    margin:0 0 3px;
    font-size:22px;
    font-weight:600;
    letter-spacing:.2px;
  }

  .form-header p{
    margin:0;
    font-size:13.5px;
    color:var(--muted);
  }

  /* ---------- Form body ---------- */
  form{
    padding:26px 32px 8px;
  }

  .field{
    margin-bottom:22px;
  }

  .field label{
    display:block;
    margin-bottom:8px;
    font-size:14.5px;
    font-weight:500;
    color:#1f2937;
  }

  .req{color:var(--danger);margin-left:2px;}

  input[type="text"],
  input[type="email"],
  input[type="number"],
  select,
  textarea{
    width:100%;
    padding:12px 14px;
    font:inherit;
    font-size:15px;
    color:var(--text);
    background:#fff;
    border:1px solid var(--border);
    border-radius:8px;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }

  textarea{
    min-height:90px;
    resize:vertical;
    line-height:1.55;
  }

  input::placeholder,
  textarea::placeholder{color:#9aa0a6;}

  input:focus,
  select:focus,
  textarea:focus{
    outline:none;
    border-color:var(--brand);
    box-shadow:0 0 0 3px rgba(26,77,143,.12);
  }

  input.invalid,
  select.invalid,
  textarea.invalid{
    border-color:var(--danger);
    background:#fff8f7;
    box-shadow:0 0 0 3px rgba(217,48,37,.10);
  }

  .counter{
    margin-top:6px;
    text-align:right;
    font-size:12.5px;
    color:var(--muted);
  }

  .counter.over{color:var(--danger);font-weight:600;}

  /* ---------- Action bar ---------- */
  .actions{
    position:sticky;
    bottom:0;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    padding:20px 32px 24px;
    margin-top:8px;
    border-top:1px solid #e8eaed;
    border-radius:0 0 14px 14px;
    background:#fafbfc;
  }

  .btn{
    padding:12px 24px;
    font:inherit;
    font-size:15px;
    font-weight:600;
    border-radius:8px;
    border:1px solid transparent;
    cursor:pointer;
    transition:background .15s, box-shadow .15s, opacity .15s;
  }

  .btn:disabled{opacity:.65;cursor:not-allowed;}

  .btn-primary{background:var(--brand);color:#fff;}
  .btn-primary:hover:not(:disabled){background:var(--brand-dark);}

  .btn-ghost{background:#fff;border-color:var(--border);color:#3c4043;}
  .btn-ghost:hover:not(:disabled){background:#f1f3f4;}

  .hint{
    margin:0 32px 4px;
    font-size:12.5px;
    color:var(--muted);
  }

  /* ---------- Off-screen PDF holder ---------- */
  #pdfHolder{
    position:absolute;
    left:-10000px;
    top:0;
    width:794px; /* A4 width at 96 dpi */
  }

  /* =========================================================
     PDF DOCUMENT STYLING
     Designed to look like a formal Word form on A4 paper
     ========================================================= */
  .pdf-doc{
    width:794px;            /* A4 width  @96dpi */
    min-height:1123px;      /* A4 height @96dpi */
    padding:48px 56px 48px;
    background:#fff;
    color:#000;
    font-family:"Times New Roman","Georgia",serif;
    font-size:13px;
    line-height:1.4;
    position:relative;
  }

  /* Header */
  .pdf-head{
    display:flex;
    align-items:center;
    gap:18px;
    padding-bottom:14px;
    margin-bottom:6px;
    border-bottom:2px solid #000;
  }

  .pdf-head .pdf-logo{flex:0 0 auto;}

  .pdf-head img{
    height:62px;
    width:auto;
    max-width:190px;
    object-fit:contain;
  }

  .pdf-head .logo-placeholder{
    height:62px;
    width:62px;
    font-size:18px;
    border-radius:8px;
    font-family:"Segoe UI",Arial,sans-serif;
  }

  .pdf-head .pdf-title{
    flex:1;
    text-align:center;
  }

  .pdf-head h1{
    margin:0;
    font-size:19px;
    font-weight:700;
    letter-spacing:.4px;
    text-transform:uppercase;
  }

  .pdf-head .pdf-sub{
    margin-top:3px;
    font-size:12.5px;
    font-style:italic;
    color:#222;
  }

  /* Form table */
  .pdf-form{
    width:100%;
    border-collapse:collapse;
    margin-top:18px;
    table-layout:fixed;
  }

  .pdf-form td{
    vertical-align:top;
    padding:6px 0;
    font-size:12.5px;
  }

  .pdf-form td.label{
    width:38%;
    padding-right:10px;
    font-weight:700;
    line-height:1.35;
  }

  .pdf-form td.label--full{
    width:100%;
    padding-right:0;
    font-weight:700;
    line-height:1.35;
  }

  .pdf-form td.value{
    width:62%;
    padding-right:0;
  }

  .pdf-form td.value--full{
    width:100%;
    padding-right:0;
    padding-bottom:10px;
  }

  /* Fill-in lines */
  .pdf-line{
    display:block;
    min-height:18px;
    border-bottom:1px solid #000;
    padding:1px 2px 2px;
    font-size:12.5px;
    line-height:1.4;
    white-space:pre-wrap;
    word-wrap:break-word;
    overflow-wrap:anywhere;
  }

  .pdf-line--blank{
    /* keeps a blank ruled line even when the field is empty */
  }

  .pdf-line--tall{
    min-height:90px;
    border:1px solid #000;
    padding:6px 8px;
    white-space:pre-wrap;
    word-wrap:break-word;
    overflow-wrap:anywhere;
    font-size:12.5px;
    line-height:1.45;
  }

  /* Group heading (for 9 / 10) */
  .pdf-group-title{
    font-weight:700;
    font-size:12.5px;
    margin:14px 0 6px;
    line-height:1.35;
  }

  .pdf-sub{
    margin-left:14px;
    margin-bottom:6px;
    font-size:12.5px;
  }

  .pdf-sub .pdf-line{
    min-height:16px;
    margin-top:2px;
  }

  /* NB note */
  .pdf-note{
    margin-top:28px;
    padding-top:10px;
    border-top:1px solid #000;
    font-size:11.5px;
    font-style:italic;
    line-height:1.4;
  }

  /* Footer page number (visual only) */
  .pdf-footer{
    position:absolute;
    left:56px;
    right:56px;
    bottom:22px;
    display:flex;
    justify-content:space-between;
    font-size:10.5px;
    color:#333;
    font-family:"Segoe UI",Arial,sans-serif;
    border-top:1px solid #999;
    padding-top:4px;
  }

  /* ---------- Print fallback ---------- */
  @media print{
    body{background:#fff;padding:0;}
    .page{box-shadow:none;border-radius:0;max-width:none;}
    .topbar,.actions,.hint{display:none !important;}
    .form-header{padding:0 0 14px;}
    form{padding:16px 0 0;}
    input,select,textarea{
      border:none;
      border-bottom:1px solid #999;
      border-radius:0;
      padding:4px 0;
      background:transparent;
    }
    textarea{min-height:60px;}
    .field{margin-bottom:14px;}
  }

  @media (max-width:600px){
    .form-header{flex-direction:column;align-items:flex-start;padding:20px;}
    form{padding:20px 20px 4px;}
    .actions{padding:16px 20px 20px;}
    .form-header h1{font-size:19px;}
  }
</style>
</head>
<body>

<div class="page">
  <div class="topbar"></div>

  <!-- ================= HEADER / LOGO ================= -->
  <header class="form-header">
    <div class="brand-logo" id="brandLogo">
      <!-- Replace with your IUB logo file (same folder) -->
      <img id="logoImg" src="logo.png" alt="IUB Logo" />
    </div>
    <div>
      <h1>Grade Change Form</h1>
      <p>Independent University, Bangladesh</p>
    </div>
  </header>

  <!-- ================= FORM ================= -->
  <form id="gradeChangeForm" novalidate autocomplete="off"></form>

  <p class="hint">Fields marked with <span class="req">*</span> are required.</p>

  <div class="actions">
    <button type="button" class="btn btn-primary" id="downloadBtn">Download as PDF</button>
    <button type="button" class="btn btn-ghost" id="printBtn">Print</button>
    <button type="button" class="btn btn-ghost" id="resetBtn">Reset Form</button>
  </div>
</div>

<!-- Off-screen container where the printable document is built -->
<div id="pdfHolder" aria-hidden="true"></div>

<script>
/* =========================================================
   1. FIELD DEFINITIONS  (exact text from the original form)
   ========================================================= */
const FIELDS = [
  { id:"studentName",       label:"1. Name of the Student",                                                    type:"text",     placeholder:"Full name of the student", required:true, pdfGroup:"top" },
  { id:"studentId",         label:"2. Student's Identification Number",                                        type:"text",     placeholder:"e.g., 2210xxx", required:true, pdfGroup:"top" },
  { id:"courseNumber",      label:"3. Course Number",                                                          type:"text",     placeholder:"e.g., CSE 303", required:true, pdfGroup:"top" },
  { id:"courseTitle",       label:"4. Course Title",                                                           type:"text",     placeholder:"e.g., Data Structures", required:true, pdfGroup:"top" },
  { id:"section",           label:"5. Section (of the Student for the Course)",                                type:"text",     placeholder:"e.g., 01", pdfGroup:"top" },
  { id:"department",        label:"6. Department (of the Course)",                                             type:"text",     placeholder:"e.g., Department of Computer Science & Engineering", pdfGroup:"top" },
  { id:"school",            label:"7. School (of the Course)",                                                 type:"text",     placeholder:"e.g., School of Engineering & Computer Science", pdfGroup:"top" },
  { id:"enrolmentSemester", label:"8. Course Enrolment Semester with Year",                                    type:"text",     placeholder:"e.g., Spring 2025", pdfGroup:"top" },

  { id:"currentGrade",      label:"a. Current Grade and its Numerical Equivalence (as recorded earlier)",     type:"text",     placeholder:"e.g., B+ (3.30)", required:true, pdfGroup:"9" },
  { id:"currentBreakdown",  label:"b. Break-down of the Marks",                                                type:"textarea", placeholder:"e.g., Attendance 08/10, Assignments 18/20, Midterm 24/30, Final 32/40", pdfGroup:"9" },
  { id:"currentSemester",   label:"c. Semester and Year",                                                      type:"text",     placeholder:"e.g., Spring 2025", pdfGroup:"9" },

  { id:"proposedGrade",     label:"a. Proposed Grade for Change and its Numerical Equivalence",               type:"text",     placeholder:"e.g., A- (3.70)", required:true, pdfGroup:"10" },
  { id:"proposedBreakdown", label:"b. Break-down of the Marks",                                                type:"textarea", placeholder:"e.g., Attendance 10/10, Assignments 19/20, Midterm 26/30, Final 36/40", pdfGroup:"10" },
  { id:"proposedSemester",  label:"c. Semester and Year",                                                      type:"text",     placeholder:"e.g., Spring 2025", pdfGroup:"10" },

  { id:"justification",     label:"11. Precise Reason and Justification in support of Grade Change (in around 250 words)",
                            type:"textarea", placeholder:"Explain clearly and precisely the reason for the grade change…",
                            required:true, rows:7, counter:250, pdfGroup:"11" },

  { id:"instructorName",    label:"12. Name of the Course Instructor",                                         type:"text",     placeholder:"Full name", required:true, pdfGroup:"bottom" },
  { id:"designation",       label:"13. Designation of the Instructor",                                         type:"text",     placeholder:"e.g., Assistant Professor", pdfGroup:"bottom" },
  { id:"instructorStatus",  label:"14. Status of the Instructor (part-time/ full-time)",                       type:"select",   options:["Part-time","Full-time"], pdfGroup:"bottom" },
  { id:"employeeId",        label:"15. Instructor's Employee Identify Number",                                 type:"text",     placeholder:"e.g., EMP-12345", pdfGroup:"bottom" },
  { id:"email",             label:"16. IUB Official e-mail address (instructor's)",                            type:"email",    placeholder:"name@iub.edu.bd", pdfGroup:"bottom" }
];

/* =========================================================
   2. BUILD THE WEB FORM
   ========================================================= */
const form = document.getElementById("gradeChangeForm");

FIELDS.forEach(field => {
  const wrap = document.createElement("div");
  wrap.className = "field";

  const label = document.createElement("label");
  label.setAttribute("for", field.id);

  /* For 9a/9b/9c and 10a/10b/10c prepend the number in the web form */
  const prefix = (field.pdfGroup === "9" || field.pdfGroup === "10")
    ? (field.pdfGroup + ". ")
    : "";

  label.innerHTML = prefix + field.label + (field.required ? ' <span class="req">*</span>' : "");
  wrap.appendChild(label);

  let input;
  if (field.type === "textarea") {
    input = document.createElement("textarea");
    input.rows = field.rows || 3;
  } else if (field.type === "select") {
    input = document.createElement("select");
    const blank = document.createElement("option");
    blank.value = ""; blank.textContent = "Select…";
    input.appendChild(blank);
    field.options.forEach(opt => {
      const o = document.createElement("option");
      o.value = opt; o.textContent = opt;
      input.appendChild(o);
    });
  } else {
    input = document.createElement("input");
    input.type = field.type;
  }

  input.id = field.id;
  input.name = field.id;
  if (field.placeholder) input.placeholder = field.placeholder;
  if (field.required) input.required = true;

  const clearInvalid = () => input.classList.remove("invalid");
  input.addEventListener("input", clearInvalid);
  input.addEventListener("change", clearInvalid);

  wrap.appendChild(input);

  if (field.counter) {
    const counter = document.createElement("div");
    counter.className = "counter";
    counter.id = field.id + "Counter";
    counter.textContent = "0 / " + field.counter + " words";
    wrap.appendChild(counter);

    const update = () => {
      const words = input.value.trim() ? input.value.trim().split(/\s+/).length : 0;
      counter.textContent = words + " / " + field.counter + " words";
      counter.classList.toggle("over", words > field.counter);
    };
    input.addEventListener("input", update);
  }

  form.appendChild(wrap);
});

/* =========================================================
   3. LOGO FALLBACK
   ========================================================= */
(function handleLogo() {
  const img = document.getElementById("logoImg");
  const swap = () => {
    const ph = document.createElement("div");
    ph.className = "logo-placeholder";
    ph.textContent = "IUB";
    if (img && img.parentNode) img.parentNode.replaceChild(ph, img);
  };
  if (img) {
    img.addEventListener("error", swap);
    if (img.complete && img.naturalWidth === 0) swap();
  }
})();

/* =========================================================
   4. HELPERS
   ========================================================= */
function getValues() {
  const values = {};
  FIELDS.forEach(f => {
    const el = document.getElementById(f.id);
    values[f.id] = el ? el.value.trim() : "";
  });
  return values;
}

function validate() {
  let firstInvalid = null;
  FIELDS.forEach(f => {
    const el = document.getElementById(f.id);
    if (!el) return;
    const value = el.value.trim();
    let bad = f.required && !value;
    if (!bad && f.type === "email" && value && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) bad = true;
    el.classList.toggle("invalid", bad);
    if (bad && !firstInvalid) firstInvalid = el;
  });
  return firstInvalid;
}

function logoMarkup() {
  const container = document.getElementById("brandLogo");
  return container ? container.innerHTML : "";
}

/* ---------------------------------------------------------
   Helper: build one labelled row (label on left, ruled value)
   --------------------------------------------------------- */
function makeRow(labelText, valueText) {
  const tr = document.createElement("tr");

  const tdLabel = document.createElement("td");
  tdLabel.className = "label";
  tdLabel.textContent = labelText;

  const tdValue = document.createElement("td");
  tdValue.className = "value";
  const line = document.createElement("span");
  line.className = "pdf-line";
  line.textContent = valueText || "\u00A0";   // keeps the ruled line visible
  tdValue.appendChild(line);

  tr.appendChild(tdLabel);
  tr.appendChild(tdValue);
  return tr;
}

/* ---------------------------------------------------------
   Helper: build a full-width labelled row (label above, ruled value)
   --------------------------------------------------------- */
function makeFullRow(labelText, valueText, tall) {
  const tr = document.createElement("tr");

  const td = document.createElement("td");
  td.className = "value--full";
  td.colSpan = 2;

  const lbl = document.createElement("div");
  lbl.className = "pdf-label";
  lbl.style.fontWeight = "700";
  lbl.style.marginBottom = "4px";
  lbl.textContent = labelText;

  const line = document.createElement("span");
  line.className = tall ? "pdf-line--tall" : "pdf-line";
  line.textContent = valueText || (tall ? "" : "\u00A0");

  td.appendChild(lbl);
  td.appendChild(line);

  tr.appendChild(td);
  return tr;
}

/* =========================================================
   5. BUILD THE PRINTABLE (PDF) DOCUMENT
   ========================================================= */
function buildPdfDocument() {
  const v = getValues();

  const doc = document.createElement("div");
  doc.className = "pdf-doc";

  /* ---------- HEADER (logo + title) ---------- */
  const head = document.createElement("div");
  head.className = "pdf-head";
  head.innerHTML =
    '<div class="pdf-logo">' + logoMarkup() + '</div>' +
    '<div class="pdf-title">' +
      '<h1>Grade Change Form</h1>' +
      '<div class="pdf-sub">Independent University, Bangladesh</div>' +
    '</div>' +
    '<div style="width:62px"></div>'; /* balance the logo width so the title stays centred */
  doc.appendChild(head);

  /* ---------- FORM TABLE ---------- */
  const table = document.createElement("table");
  table.className = "pdf-form";

  /* --- Fields 1–8 (two per row, label + value) --- */
  const topFields = FIELDS.filter(f => f.pdfGroup === "top");
  for (let i = 0; i < topFields.length; i += 2) {
    const left  = topFields[i];
    const right = topFields[i + 1];

    if (right) {
      const tr = document.createElement("tr");

      /* left pair */
      const tdL = document.createElement("td");
      tdL.className = "label";
      tdL.textContent = left.label;

      const tdLV = document.createElement("td");
      tdLV.className = "value";
      const lineL = document.createElement("span");
      lineL.className = "pdf-line";
      lineL.textContent = v[left.id] || "\u00A0";
      tdLV.appendChild(lineL);

      /* right pair */
      const tdR = document.createElement("td");
      tdR.className = "label";
      tdR.style.paddingLeft = "18px";
      tdR.textContent = right.label;

      const tdRV = document.createElement("td");
      tdRV.className = "value";
      const lineR = document.createElement("span");
      lineR.className = "pdf-line";
      lineR.textContent = v[right.id] || "\u00A0";
      tdRV.appendChild(lineR);

      tr.appendChild(tdL);
      tr.appendChild(tdLV);
      tr.appendChild(tdR);
      tr.appendChild(tdRV);
      table.appendChild(tr);
    } else {
      /* odd one left over — put it full width */
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 4;
      td.className = "value--full";
      const lbl = document.createElement("div");
      lbl.style.fontWeight = "700";
      lbl.style.marginBottom = "4px";
      lbl.textContent = left.label;
      const line = document.createElement("span");
      line.className = "pdf-line";
      line.textContent = v[left.id] || "\u00A0";
      td.appendChild(lbl);
      td.appendChild(line);
      tr.appendChild(td);
      table.appendChild(tr);
    }
  }

  /* --- Field 9 : Current Grade --- */
  {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 4;
    td.className = "value--full";
    const title = document.createElement("div");
    title.className = "pdf-group-title";
    title.textContent = "9. Current Grade and its Numerical Equivalence (as recorded earlier)";
    td.appendChild(title);
    tr.appendChild(td);
    table.appendChild(tr);
  }
  table.appendChild(makeFullRow("a. Current Grade and its Numerical Equivalence:", v.currentGrade));
  table.appendChild(makeFullRow("b. Break-down of the Marks:", v.currentBreakdown, true));
  table.appendChild(makeFullRow("c. Semester and Year:", v.currentSemester));

  /* --- Field 10 : Proposed Grade --- */
  {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 4;
    td.className = "value--full";
    const title = document.createElement("div");
    title.className = "pdf-group-title";
    title.textContent = "10. Proposed Grade for Change and its Numerical Equivalence";
    td.appendChild(title);
    tr.appendChild(td);
    table.appendChild(tr);
  }
  table.appendChild(makeFullRow("a. Proposed Grade for Change and its Numerical Equivalence:", v.proposedGrade));
  table.appendChild(makeFullRow("b. Break-down of the Marks:", v.proposedBreakdown, true));
  table.appendChild(makeFullRow("c. Semester and Year:", v.proposedSemester));

  /* --- Field 11 : Justification --- */
  table.appendChild(
    makeFullRow(
      "11. Precise Reason and Justification in support of Grade Change (in around 250 words):",
      v.justification,
      true
    )
  );

  /* --- Fields 12–16 (two per row where possible) --- */
  const bottomFields = FIELDS.filter(f => f.pdfGroup === "bottom");
  for (let i = 0; i < bottomFields.length; i += 2) {
    const left  = bottomFields[i];
    const right = bottomFields[i + 1];

    if (right) {
      const tr = document.createElement("tr");

      const tdL = document.createElement("td");
      tdL.className = "label";
      tdL.textContent = left.label;

      const tdLV = document.createElement("td");
      tdLV.className = "value";
      const lineL = document.createElement("span");
      lineL.className = "pdf-line";
      lineL.textContent = v[left.id] || "\u00A0";
      tdLV.appendChild(lineL);

      const tdR = document.createElement("td");
      tdR.className = "label";
      tdR.style.paddingLeft = "18px";
      tdR.textContent = right.label;

      const tdRV = document.createElement("td");
      tdRV.className = "value";
      const lineR = document.createElement("span");
      lineR.className = "pdf-line";
      lineR.textContent = v[right.id] || "\u00A0";
      tdRV.appendChild(lineR);

      tr.appendChild(tdL);
      tr.appendChild(tdLV);
      tr.appendChild(tdR);
      tr.appendChild(tdRV);
      table.appendChild(tr);
    } else {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 4;
      td.className = "value--full";
      const lbl = document.createElement("div");
      lbl.style.fontWeight = "700";
      lbl.style.marginBottom = "4px";
      lbl.textContent = left.label;
      const line = document.createElement("span");
      line.className = "pdf-line";
      line.textContent = v[left.id] || "\u00A0";
      td.appendChild(lbl);
      td.appendChild(line);
      tr.appendChild(td);
      table.appendChild(tr);
    }
  }

  doc.appendChild(table);

  /* ---------- NB NOTE ---------- */
  const note = document.createElement("div");
  note.className = "pdf-note";
  note.textContent =
    "NB: The filled-in Application Form in PDF format is to be uploaded for review and approval.";
  doc.appendChild(note);

  /* ---------- FOOTER (page feel) ---------- */
  const footer = document.createElement("div");
  footer.className = "pdf-footer";
  footer.innerHTML =
    '<span>Grade Change Form</span>' +
    '<span>Independent University, Bangladesh</span>' +
    '<span>Page 1 of 1</span>';
  doc.appendChild(footer);

  return doc;
}

/* =========================================================
   6. ACTIONS
   ========================================================= */
const downloadBtn = document.getElementById("downloadBtn");
const printBtn    = document.getElementById("printBtn");
const resetBtn    = document.getElementById("resetBtn");
const holder      = document.getElementById("pdfHolder");

downloadBtn.addEventListener("click", async () => {
  const firstInvalid = validate();
  if (firstInvalid) {
    firstInvalid.scrollIntoView({ behavior: "smooth", block: "center" });
    firstInvalid.focus({ preventScroll: true });
    return;
  }

  if (typeof html2pdf === "undefined") {
    alert("PDF library could not be loaded (you may be offline). The print dialog will open instead — choose 'Save as PDF'.");
    window.print();
    return;
  }

  const originalText = downloadBtn.textContent;
  downloadBtn.disabled = true;
  downloadBtn.textContent = "Generating PDF…";

  holder.innerHTML = "";
  const pdfDoc = buildPdfDocument();
  holder.appendChild(pdfDoc);

  const student = (document.getElementById("studentName").value || "Student")
                    .replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "_");

  const options = {
    margin: [0, 0, 0, 0],
    filename: "Grade_Change_Form_" + student + ".pdf",
    image: { type: "jpeg", quality: 0.98 },
    html2canvas: {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: "#ffffff",
      windowWidth: 900,
      scrollX: 0,
      scrollY: 0
    },
    jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
    pagebreak: { mode: ["css", "legacy"] }
  };

  try {
    await html2pdf().set(options).from(pdfDoc).save();
  } catch (err) {
    console.error(err);
    alert("Sorry, the PDF could not be generated. Please use the Print button and choose 'Save as PDF'.");
  } finally {
    holder.innerHTML = "";
    downloadBtn.disabled = false;
    downloadBtn.textContent = originalText;
  }
});

printBtn.addEventListener("click", () => window.print());

resetBtn.addEventListener("click", () => {
  if (!confirm("Clear all the information you have entered?")) return;
  form.reset();
  form.querySelectorAll(".invalid").forEach(el => el.classList.remove("invalid"));
  const counter = document.getElementById("justificationCounter");
  if (counter) {
    counter.textContent = "0 / 250 words";
    counter.classList.remove("over");
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>
