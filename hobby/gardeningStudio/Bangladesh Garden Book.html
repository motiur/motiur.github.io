<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bangladesh Garden Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600&family=Tiro+Bangla:ital@0;1&display=swap">
<style>
/* Layout: a one-screen flip-book viewer. Title bar, colour-coded group rail, a centred two-page book on a pale grey stage, control bar.
   Every page scales with the book: inside a page 1em = page width / 24. Colour comes from the plant groups and the plates. */
:root{
  --stage:#f6f6f4; --stage-2:#e2e2df; --chrome:#ffffff; --line:#d3d3cf;
  --paper:#ffffff; --ink:#1c1b1f; --ink-2:#5d5c64; --rule:#e4e3e7;
  --disc:#d7263d; --accent:#d7263d; --shadow:rgb(30 30 40/.3);
  --f-display:"Tiro Bangla","Noto Serif Bengali",Georgia,serif;
  --f-body:"Anek Bangla","Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --stage:#1d1d21; --stage-2:#111114; --chrome:#27272c; --line:#3b3b42;
  --paper:#202024; --ink:#ececf0; --ink-2:#a5a4af; --rule:#35353c;
  --disc:#d7263d; --accent:#ff7a8a; --shadow:rgb(0 0 0/.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#1d1d21; --stage-2:#111114; --chrome:#27272c; --line:#3b3b42;
  --paper:#202024; --ink:#ececf0; --ink-2:#a5a4af; --rule:#35353c;
  --disc:#d7263d; --accent:#ff7a8a; --shadow:rgb(0 0 0/.6); color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--stage-2);color:var(--ink);font:14px/1.4 var(--f-body);overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.defs{position:absolute;width:0;height:0;overflow:hidden}

.app{height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;
  background:radial-gradient(120% 85% at 50% 42%,var(--stage),var(--stage-2))}
.strip{display:flex;height:5px}
.strip i{flex:1;background:var(--c)}
.top{display:flex;align-items:center;gap:12px;padding:9px 16px 8px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;margin-right:auto}
.brand b{font:400 24px/1 var(--f-display)}
.brand span{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;min-width:40px;box-sizing:border-box;
  padding:0 10px;border:1px solid var(--line);background:var(--chrome);border-radius:10px;font-weight:500;cursor:pointer;flex:none}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{border-color:var(--ink-2)}
.btn:disabled{opacity:.38;cursor:default}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--chrome);border-color:var(--ink)}
.ico{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.cats{display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px 0 10px;border-radius:15px;flex:none;cursor:pointer;
  border:1px solid color-mix(in srgb,var(--c,var(--line)) 45%,transparent);background:color-mix(in srgb,var(--c,var(--chrome)) 13%,var(--chrome));font-size:13px;font-weight:500;color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip:hover{border-color:var(--c,var(--ink-2))}
.cats .chip[aria-current="true"]{background:var(--c);color:var(--on);border-color:var(--c)}
.cats .chip[aria-current="true"] i{background:var(--on)}
@media (min-width:1280px){.cats{justify-content:center}}

.stage{position:relative;min-height:0;padding:6px 16px 10px}
.area{width:100%;height:100%;display:grid;place-items:center}
.side{position:absolute;top:50%;translate:0 -50%;width:44px;height:44px;border-radius:50%;padding:0;display:none}
.side.prev{left:12px}.side.next{right:12px}
@media (min-width:760px){.stage{padding-inline:68px}.side{display:inline-flex}}

.bar{display:flex;align-items:center;gap:6px;padding:0 16px 10px}
.slide{flex:1;min-width:0;display:grid;gap:0;justify-items:center;padding:0 6px}
.slide input{width:100%;margin:0;accent-color:var(--accent)}
.slide output{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar .lbl{display:none}
@media (min-width:760px){.bar{justify-content:center;gap:8px}.slide{max-width:420px}.bar .lbl,.top .lbl{display:inline}.bar .mob{display:none}}
@media (max-width:759px){.top .lbl{display:none}.bar .fs,.bar .snd{display:none}.bar{gap:5px}}

/* ---------- book ---------- */
#book{position:relative;touch-action:none;transition:transform .5s ease;min-width:0;min-height:0}
#book::before{content:"";position:absolute;z-index:-1;inset:3% 1.5% -1.5% 1.5%;background:var(--shadow);filter:blur(20px);transition:inset .5s ease}
#book.is-front{transform:translateX(-25%)}
#book.is-back{transform:translateX(25%)}
#book.is-front::before{left:51.5%}
#book.is-back::before{right:51.5%}
.page{display:none;position:absolute;background:var(--paper);overflow:hidden;container-type:size;outline:1px solid rgb(0 0 0/.08);outline-offset:-1px}
.page::after{content:"";position:absolute;inset:0;pointer-events:none}
.page[class~="--right"]::after{background:linear-gradient(90deg,rgb(0 0 0/.16),rgb(0 0 0/.04) 3.5%,transparent 10%)}
.page[class~="--left"]::after{background:linear-gradient(270deg,rgb(0 0 0/.16),rgb(0 0 0/.04) 3.5%,transparent 10%)}
.stf__innerShadow,.stf__outerShadow,.stf__hardShadow,.stf__hardInnerShadow{pointer-events:none}
.page button{cursor:pointer}
.page button *{pointer-events:none}
.page a{color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:.15em}

/* wind: every .w group sways on its attachment point */
.w{animation:wind var(--d,5s) ease-in-out var(--dl,0s) infinite}
@keyframes wind{0%,100%{transform:rotate(calc(var(--a)*-.3))}24%{transform:rotate(var(--a))}40%{transform:rotate(calc(var(--a)*.42))}58%{transform:rotate(calc(var(--a)*.86))}80%{transform:rotate(calc(var(--a)*-.08))}}
.calm .w,#book.turning .w{animation-play-state:paused}

.sheet{position:relative;height:100%;box-sizing:border-box;font-size:calc(100cqw / 24);line-height:1.3;
  padding:1.15em 1.4em 1.2em;display:flex;flex-direction:column;gap:.6em;color:var(--ink)}
[hidden]{display:none!important}
.tab{position:absolute;right:0;top:calc(5% + var(--k) * 90% / var(--n,11));width:.5em;height:calc(72% / var(--n,11));background:var(--c)}
.page[class~="--left"] .tab{right:auto;left:0}
.hd{display:flex;justify-content:space-between;align-items:center;gap:1em;font-size:.72em;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.hd .cat{display:flex;align-items:center;gap:.6em;min-width:0}
.hd [lang="bn"]{letter-spacing:0;font-size:1.12em}
.hd .fol{font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:.8em;flex:none}
.src{font-weight:600;font-size:.74em;letter-spacing:.04em;text-transform:none;padding:.12em .6em;border-radius:1em;border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}
.hd .src{font-size:1em}
.dot{width:.8em;height:.8em;border-radius:50%;background:var(--c);flex:none}
.art{flex:1 1 0;min-height:6.5em;display:flex}
.art svg{width:100%;height:100%}
.plant .art{position:relative}
.art .phimg{width:100%;height:100%;object-fit:cover;border-radius:6em 6em .5em .5em / 3.4em 3.4em .5em .5em;display:block;min-height:0}
.art .cred{position:absolute;right:.5em;bottom:.5em;font-size:.6em;padding:.2em .6em;border-radius:1em;background:rgba(0,0,0,.55);color:#fff;text-decoration:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:2.3em;height:2.3em;margin:-.5em 0;padding:0;border:1px solid var(--rule);border-radius:50%;background:none;color:var(--ink-2)}
.ib svg{width:1.3em;height:1.3em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.ib[aria-pressed="true"]{color:#fff;background:var(--c);border-color:var(--c)}
.ib.fav[aria-pressed="true"] svg{fill:currentColor}
.ib:disabled{opacity:.35;cursor:default}
.ib.busy{opacity:.5}
.pho{display:none}
.photos .pho{display:inline-flex}
.nm{display:flex;align-items:baseline;gap:.2em .7em;flex-wrap:wrap}
.nm h2{font:400 2em/1.08 var(--f-display);margin:0;text-wrap:balance}
.nm .alt{font:400 1.42em/1.2 var(--f-display);color:var(--ink-2)}
.sci{margin:-.3em 0 0;font-size:.86em;color:var(--ink-2)}
.needs{display:grid;grid-template-columns:1fr 1fr;gap:.55em .9em;margin:0;padding:.65em 0 0;border-top:1px solid var(--rule)}
.n{min-width:0}
.n.wide{grid-column:1/-1}
.n dt{display:flex;align-items:center;gap:.45em;font-size:.7em;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.n dt svg{width:1.4em;height:1.4em;flex:none;color:var(--c)}
.n dd{margin:.15em 0 0;font-size:.88em;line-height:1.28}
.m{display:inline-flex;gap:2px;margin-left:auto}
.m i{width:.95em;height:.45em;background:var(--rule);border-radius:1px}
.m[data-v="1"] i:nth-child(-n+1),.m[data-v="2"] i:nth-child(-n+2),.m[data-v="3"] i{background:var(--c)}
.cal{border-top:1px solid var(--rule);padding-top:.6em}
.cl{display:flex;gap:.7em;align-items:baseline;font-size:.86em;line-height:1.25}
.cl b{font-size:.81em;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:600;flex:none}
.mo{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:.55em;font-size:.68em;line-height:1.2;text-align:center;color:var(--ink-2)}
.mo span{position:relative;display:grid;gap:.25em}
.mo i{height:.78em;background:var(--rule);border-radius:1px}
.mo .on i{background:var(--c)}
.mo u{height:.36em;border-radius:1px;text-decoration:none}
.mo u.on{background:var(--ink)}
.sk{margin-left:auto;flex:none;display:flex;align-items:center;gap:.45em;font-style:normal;font-size:.81em;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.sk u{width:1.2em;height:.36em;border-radius:1px;background:var(--ink)}
.mo .now{color:var(--ink);font-weight:600}
.mo .now::before{content:"";position:absolute;left:50%;top:-.42em;translate:-50% 0;width:.36em;height:.36em;border-radius:50%;background:var(--accent)}
.ritu{position:relative;height:1.55em;margin-top:3px;font-size:.72em;line-height:1}
.ritu span{position:absolute;top:0;bottom:0;display:grid;place-items:center;box-sizing:border-box;border-left:1px solid var(--paper);
  background:color-mix(in srgb,var(--rule) 60%,transparent);color:var(--ink-2);white-space:nowrap;overflow:hidden}
.tip{margin:0;font-size:.82em;color:var(--ink-2);line-height:1.32}
.tip b{color:var(--ink);font-weight:600}

/* front matter */
.fm h2{font:400 1.9em/1.1 var(--f-display);margin:.2em 0 0;text-wrap:balance}
.fm h2.th{font-size:1.5em;margin:0}
.fm h2 small{display:block;font:500 .42em/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:.5em}
.fm p{margin:0;font-size:.86em;color:var(--ink-2);max-width:60ch}
.fm p b,.fm li b{color:var(--ink);font-weight:600}
.lg{display:grid;grid-template-columns:5.2em 1fr;gap:.2em .8em;font-size:.84em;border-top:1px solid var(--rule);padding-top:.55em;--c:var(--accent)}
.lg b{font-size:.84em;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:600;padding-top:.1em}
.lg ul{list-style:none;margin:0;padding:0;display:grid;gap:.2em}
.lg li{display:flex;align-items:center;gap:.7em}
.lg .m{margin:0}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:.4em;flex:1;align-content:space-evenly}
.rows li{display:grid;grid-template-columns:7.4em 1fr;gap:.9em;border-top:1px solid var(--rule);padding-top:.45em;font-size:.84em;line-height:1.28;color:var(--ink-2)}
.rows .k{display:grid;align-content:start;gap:.15em}
.rows .k b{font:400 1.6em/1 var(--f-display);color:var(--ink)}
.rows .k span{font-size:.86em;letter-spacing:.04em}
.rows.plain li{grid-template-columns:5.6em 1fr}
.rows.tight{gap:.3em}
.rows.tight li{font-size:.8em;padding-top:.35em}
.rows.plain .k b{font:600 .86em/1.25 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink)}
.toc{display:grid;gap:.6em;align-content:space-evenly;flex:1}
.toc section{--c:var(--ink)}
.toc h3{display:flex;align-items:center;gap:.55em;margin:0 0 .2em;font:600 .78em/1.3 var(--f-body);letter-spacing:.07em;text-transform:uppercase}
.toc h3 [lang="bn"]{font-weight:400;letter-spacing:0;color:var(--ink-2);text-transform:none;font-size:1.1em}
.toc .g{display:grid;grid-template-columns:1fr 1fr;gap:0 1.2em}
.go{display:flex;align-items:baseline;gap:.4em;width:100%;padding:.13em 0;border:0;background:none;text-align:left;font-size:.82em;line-height:1.3;border-bottom:1px dotted var(--rule)}
.go span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go i{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:.92em}
.go:hover span{text-decoration:underline}
.care{display:grid;gap:.1em;flex:1;align-content:space-evenly}
.care .go{font-size:.8em;padding:.2em 0;color:var(--ink-2)}
.care .go span{white-space:normal}
.care .go b{color:var(--ink);font-weight:600;margin-right:.4em}

/* group openers: a full page in the group's colour */
.sec{background:var(--c);color:var(--on)}
.sec .hd{color:var(--on);opacity:.85}
.sec .art{flex:1 1 0;min-height:5em;max-height:10.5em}
.sec h2{font:400 3.1em/1.05 var(--f-display);margin:0}
.sec h3{font:500 1em/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;margin:0}
.sec p{margin:0;font-size:.9em;max-width:36ch;opacity:.92}
.sec .g{display:grid;grid-template-columns:1fr 1fr;gap:0 1.2em;margin-top:auto;border-top:1px solid color-mix(in srgb,var(--on) 35%,transparent);padding-top:.4em}
.sec .g.g3{grid-template-columns:repeat(3,1fr);gap:0 .9em}
.sec .g.gs .go{font-size:.7em;padding:.02em 0}
.sec .go{border-bottom-color:color-mix(in srgb,var(--on) 30%,transparent);color:var(--on);font-size:.78em;padding:.08em 0}
.sec .go i{color:var(--on);opacity:.8}
.cover{padding:1.3em 1.6em 1.4em;gap:0}
.bars{display:flex;gap:3px;height:.55em;flex:none}
.bars i{flex:1;background:var(--c)}
.cover .eyebrow{font-size:.74em;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:1.1em 0 0}
.cover .sun{width:17.5em;height:17.5em;margin:.5em auto 0;flex:none;display:block}
.cover h1{font:400 5.2em/1 var(--f-display);margin:auto 0 0}
.cover .sub{font:400 1.42em/1.2 var(--f-display);margin:.3em 0 0}
.cover .foot{display:flex;justify-content:space-between;align-items:center;gap:1em;margin-top:1.2em;padding-top:.8em;border-top:1px solid var(--rule);font-size:.8em;color:var(--ink-2)}
.cover .open{display:inline-flex;align-items:center;gap:.5em;border:0;background:var(--ink);color:var(--paper);border-radius:2em;padding:.5em 1.1em;font-weight:500;flex:none}
.cover .open svg{width:1em;height:1em}
.cover.back h1{font-size:3em;margin:auto 0 0}
.cover.back p{font-size:.84em;color:var(--ink-2);margin:.9em 0 0;max-width:38ch}

/* ---------- care notes sheet ---------- */
.info{position:fixed;z-index:22;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:82%;overflow-y:auto;box-sizing:border-box;background:var(--chrome);
  border-radius:18px 18px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px rgb(0 0 0/.28);border-top:4px solid var(--c,var(--accent))}
.info header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.info h2{font:400 24px/1.15 var(--f-display);margin:0}
.info .isub{margin:4px 0 10px;color:var(--ink-2);font-size:12.5px}
.info section{border-top:1px solid var(--rule);padding:10px 0 4px}
.info h3{display:flex;align-items:center;gap:8px;margin:0 0 4px;font:600 11px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.info h3 svg{width:16px;height:16px;fill:none;stroke:var(--c,currentColor);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.info p{margin:0 0 6px;font-size:15px;line-height:1.45}
.info p a{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.lang-bn .info h3{letter-spacing:0;font-size:13px}
#book.plain .page{transition:none}
/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.42);z-index:20}
.drawer{position:fixed;z-index:21;top:0;right:0;bottom:0;width:min(400px,100%);box-sizing:border-box;background:var(--chrome);
  display:grid;grid-template-rows:auto auto auto auto minmax(0,1fr);gap:10px;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:-12px 0 40px rgb(0 0 0/.25)}
.drawer header{display:flex;align-items:center;justify-content:space-between}
.drawer h2{font:400 22px/1.1 var(--f-display);margin:0}
.drawer input[type="search"]{width:100%;box-sizing:border-box;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:16px var(--f-body)}
.filters{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.secs .chip[aria-pressed="true"]{background:var(--accent);color:var(--chrome);border-color:var(--accent)}
.filters .chip{background:var(--paper);border-color:var(--line)}
.filters .chip[aria-pressed="true"]{background:var(--ink);color:var(--chrome);border-color:var(--ink)}
.list{overflow-y:auto;margin:0 -16px;padding:0 16px}
.list h3{position:sticky;top:0;background:var(--chrome);margin:0;padding:10px 0 6px;font:600 11px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.list h3 i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;padding:8px 0;border:0;border-top:1px solid var(--rule);background:none;text-align:left;cursor:pointer}
.row b{font-weight:500;font-size:15px}
.row b span{font:400 15px var(--f-display);color:var(--ink-2);margin-left:8px}
.row small{grid-column:1;color:var(--ink-2);font-size:12.5px}
.row em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:13px}
.row:hover b{text-decoration:underline}
.empty,.count{color:var(--ink-2);padding:4px 0;margin:0;font-size:12.5px}
.empty{padding:18px 0;font-size:14px}
/* Bangla text: no letter-spacing or capitals, a little more leading */
.lang-bn .hd,.lang-bn .n dt,.lang-bn .cl b,.lang-bn .sk,.lang-bn .fm h2 small,.lang-bn .lg b,.lang-bn .rows.plain .k b,.lang-bn .toc h3,.lang-bn .sec h3,.lang-bn .cover .eyebrow,.lang-bn .list h3{letter-spacing:0}
.lang-bn .hd{font-size:.8em}
.lang-bn .n dt,.lang-bn .sk{font-size:.8em}
.lang-bn .cl b{font-size:.92em}
.lang-bn .lg b,.lang-bn .rows.plain .k b{font-size:.95em}
.lang-bn .sheet{line-height:1.38}
.lang-bn .n dd,.lang-bn .tip,.lang-bn .rows li{line-height:1.4}
.lang-bn .nm .alt{font:400 1.05em/1.2 var(--f-body)}
.lang-bn .sec h3{font-size:.85em;opacity:.85}
.lang-bn .mo{font-size:.64em}
@media (prefers-reduced-motion:reduce){#book,#book::before{transition:none}.w{animation:none}}

['morogful','Morogful','মোরগফুল','Cockscomb','Celosia argentea',3,'Full sun',2,'Moderate',2,'Every 2 days','0.3–0.5 L per 8-inch pot','Rich, well-drained loam','f','7-12','July to December','Sow in May–June. The plumes keep their colour for weeks and dry well.',['pot','plume','#d81f5a','lance',{R:30,lf:{l:30,w:9,cs:['#3f8f4b','#57a65a','#7a3348']}}]],
['gladiolus','Gladiolus','গ্লাডিওলাস','Sword lily','Gladiolus hybrids',3,'Full sun',2,'Moderate',2,'Every 3–4 days; steady once spikes form','0.5 L per 10-inch pot','Sandy loam, well-drained','f','12-3','December to March','Plant corms in October–November, 5–7 cm deep. BARI has released several Gladiolus varieties.',['spk','trump','#f25f8f','strap',{k:4,fr:16,nb:6,bs:50,tips:[[176,18,1],[138,40,.8],[222,46,.75]],lf:{l:86,w:6},fl:{c2:'#fff0a8'}}]],
['gerbera','Gerbera','জারবেরা','Transvaal daisy','Gerbera jamesonii',2,'Bright light, soft morning sun',2,'Moderate',2,'Every 2–3 days; keep the crown dry','0.3 L per 8-inch pot','Light sandy loam with coco peat','f','10-4','October to April, some all year','Plant with the crown just above the soil or it rots. BARI Gerbera-1 is a local variety.',['pot','ger','#f25c2a','lobed',{R:34,pot:'white',lf:{l:24}}]],
['calendula','Calendula','ক্যালেন্ডুলা','Pot marigold','Calendula officinalis',3,'Full sun',1,'Low to moderate',2,'Every 2 days','0.3 L per 8-inch pot','Loam with compost','f','12-3','December to March','Sow in October–November. Remove spent heads weekly and it flowers until the heat arrives.',['pot','daisy','#f59e0b','lance',{R:30,lay:5,fl:{n:26,rings:2,pw:.2,cr:.22,disc:'#b45309'},lf:{l:26,w:8}}]],
['salvia','Salvia','স্যালভিয়া','Scarlet sage','Salvia splendens',3,'Full sun to light shade',2,'Moderate',2,'Every 2 days','0.3–0.5 L per 8-inch pot','Rich, well-drained loam','f','11-3','November to March','Pinch the tip at 10 cm for more spikes. Cut finished spikes to get a second flush.',['spk','st6','#e3242b','serr',{k:6,fr:9,nb:9,bs:150,lf:{l:26,w:13},fl:{n:3,pw:.6,c2:'#b1161c'}}]],
['dianthus','Dianthus','ডায়ান্থাস','Pinks','Dianthus chinensis',3,'Full sun',1,'Low to moderate',2,'Every 2 days; never soggy','0.3 L per 8-inch pot','Sandy loam, slightly alkaline','f','12-3','December to March','Good in shallow bowls and borders. Shear lightly after the first flush.',['pot','s5','#e83e8c','strap',{R:22,lay:5,fl:{sh:'notch',pw:.95,c1:'#7a1040',c2:'#ffffff'},lf:{l:22,w:3.5}}]],
['ghasful','Ghas ful','ঘাসফুল','Rain lily','Zephyranthes species',3,'Full sun to part shade',3,'Moderate to high',2,'Every 2–3 days while growing','0.3 L per 8-inch pot','Any well-drained soil','f','5-9','May to September, after rain','Flowers appear a few days after heavy rain. Leave the bulbs crowded; they flower better.',['pot','st6','#f48fb1','strap',{R:24,lay:5,pot:'bowl',fl:{sh:'ov',pw:.5,c2:'#f6c445'},lf:{l:30,w:2.5}}]]
]},
{id:'trees',short:'Trees',en:'Flowering trees',bn:'ফুলের বৃক্ষ',c:'#ef5b2b',
 intro:'Trees for a ground-level garden or a boundary. Each needs open soil and several metres of room; none belongs in a pot for long.',p:[
['krishnochura','Krishnochura','কৃষ্ণচূড়া','Flame tree','Delonix regia',3,'Full sun',2,'Any',1,TREEW,TREEA,'Any well-drained soil','f','4-6','April to June','Needs 8–10 m of space and has shallow roots, so plant well away from walls and drains.',['tr',{fc:['#e8362d','#f0522a','#f97316'],dense:1}]],
['sonalu','Sonalu','সোনালু','Golden shower','Cassia fistula',3,'Full sun',2,'Any',1,TREEW,TREEA,'Well-drained loam','f','4-6','April to June','Flowers hang in long chains before the new leaves. A medium tree that suits a boundary line.',['tr',{fc:['#f7c600','#fde047'],hang:1}]],
['jarul','Jarul','জারুল','Pride of India','Lagerstroemia speciosa',3,'Full sun',3,'Moderate to high',2,'Weekly while young; tolerates wet ground',TREEA,'Moist loam or clay-loam','f','4-7','April to July','It copes with low, wet ground where other trees fail. Prune only to shape, after flowering.',['tr',{fc:['#a855f7','#c084fc']}]],
['kadam','Kadam','কদম','Burflower tree','Neolamarckia cadamba',3,'Full sun',3,'High',2,'Weekly while young',TREEA,'Deep, moist loam','f','6-8','June to August','The flower of Asharh. It grows very fast and tall, so it needs a large garden.',['tr',{fc:['#f7b500'],ball:1}]],
['bokul','Bokul','বকুল','Spanish cherry','Mimusops elengi',3,'Full sun to part shade',2,'Moderate to high',2,'Weekly while young',TREEA,'Any well-drained soil','f','3-7','March to July','Slow, evergreen and tidy, with a dense round crown. A good shade tree near the house.',['tr',{fc:['#fff7e0'],small:1,cc:['#1f6b3a','#2f7a43','#256b3c']}]],
['shimul','Shimul','শিমুল','Red silk cotton','Bombax ceiba',3,'Full sun',2,'Any',1,'Weekly in the first dry season only',TREEA,'Deep, well-drained soil','f','2-3','February to March','Flowers on bare branches in Falgun. A very large tree with a thorny trunk; only for big open plots.',['tr',{fc:['#e8362d','#d81f3c'],bare:1}]],
['polash','Polash','পলাশ','Flame of the forest','Butea monosperma',3,'Full sun',1,'Any',1,'Weekly in the first dry season only',TREEA,'Any soil, including poor and dry','f','2-3','February to March','Slow and crooked when young. It flowers leafless in Falgun, a sign of spring.',['tr',{fc:['#f97316','#ea580c'],bare:1}]],
['shornochapa','Shornochapa','স্বর্ণচাঁপা','Golden champa','Magnolia champaca',3,'Full sun to part shade',3,'High',2,'Twice a week while young',TREEA,'Rich, moist, slightly acidic loam','f','4-9','April to September','Grafted plants flower in two or three years and can stay in a half-drum for a while.',['tr',{fc:['#f7b500','#fbbf24'],small:1}]],
['kanchan','Kanchan','কাঞ্চন','Orchid tree','Bauhinia variegata',3,'Full sun',2,'Any',1,'Weekly while young',TREEA,'Well-drained loam','f','2-4','February to April','A small tree, good for a modest garden. The two-lobed leaves fold at night.',['tr',{fc:['#e879f9','#f0abfc']}]]
]},
{id:'climbers',short:'Climbers',en:'Climbers',bn:'লতানো গাছ',c:'#7a5cd6',
 intro:'For grilles, pergolas and rooftop frames. Give each a trellis from day one and a tub of at least 16 inches.',p:[
['madhumanjari','Madhumanjari','মধুমঞ্জরী','Rangoon creeper','Combretum indicum',3,'Full sun',3,'Moderate to high',2,'Every 2 days in summer','2–3 L for a large tub','Fertile loam','f','3-11','March to November','Often sold as Madhabilata. Flowers open white, then turn pink and red.',['vi','s5','#e63950','ov',{m:9,fr:8,cs:['#ffffff','#f7a8b8','#e63950'],lf:{l:26,w:11}}]],
['aparajita','Aparajita','অপরাজিতা','Butterfly pea','Clitoria ternatea',3,'Full sun',2,'Moderate to high',2,'Every 1–2 days','0.5 L per 10-inch pot','Sandy loam','f','6-11','June to November, a few all year','Soak seeds overnight before sowing. It fixes its own nitrogen, so go easy on fertiliser.',['vi','pea','#2b3fc7','comp',{R:17,lf:{comp:2,l:20,ll:11,lw:6}}]],
['beli','Beli','বেলি','Arabian jasmine','Jasminum sambac',3,'Full sun',3,'Moderate to high',2,'Daily in summer; every 2–3 days otherwise','0.5–1 L per 12-inch pot','Loam with compost, well-drained','f','3-8','March to August','Prune hard in January and feed. Flowers come on the new shoots.',['pot','dbl','#ffffff','ov',{R:26,lay:5,bg:'aqua',stem:'w',lf:{pair:1}}]],
['jui','Jui','জুঁই','Juhi jasmine','Jasminum auriculatum',3,'Full sun to part shade',3,'High',2,'Every 2 days','1 L per 12-inch pot','Moist, well-drained loam','f','6-9','June to September','A monsoon jasmine. Train it on a balcony grille and trim after the rains.',['vi','jas','#ffffff','comp',{m:8,fr:7,bg:'aqua',lf:{comp:2,l:20,ll:10,lw:4.5},fl:{n:6,pw:.36}}]],
['nilmoni','Nilmonilata','নীলমণি লতা','Purple wreath','Petrea volubilis',3,'Full sun',2,'Moderate',2,'Every 2–3 days','2 L for a large tub','Well-drained loam','f','2-4','February to April','Slow for two years, then it covers a pergola. The leaves feel like sandpaper.',['vi','s5','#7c5ce0','ov',{m:11,fr:7,long:1,cs:['#7c5ce0','#a78bfa'],lf:{l:26,w:11}}]],
['alamanda','Allamanda','অ্যালামান্ডা','Golden trumpet','Allamanda cathartica',3,'Full sun',3,'High',2,'Every 1–2 days in summer','1 L per 12-inch pot','Rich, moist loam','f','4-10','April to October','The milky sap irritates skin. Cut it back in winter to control its reach.',['vi','trump','#f9c80e','lance',{R:20,lf:{l:26,w:8},fl:{c2:'#c98300'}}]],
['madhabilata','Madhabilata','মাধবীলতা','Hiptage','Hiptage benghalensis',3,'Full sun',2,'Moderate to high',2,'Every 2–3 days','3 L for a large tub','Fertile, well-drained loam','f','2-4','February to April','The true Madhabilata: a heavy woody climber with fringed white-and-yellow flowers. It needs a strong pergola.',['vi','s5','#ffffff','ov',{m:9,fr:8,bg:'aqua',fl:{sh:'notch',c2:'#f6c445'},lf:{l:28,w:11}}]],
['jhumkolata','Jhumkolata','ঝুমকোলতা','Passion flower','Passiflora species',3,'Full sun',3,'Moderate to high',2,'Every 1–2 days in summer','1–2 L for a 14-inch pot','Rich, well-drained loam','f','5-10','May to October','It climbs by tendrils, so give it wire or net. Each flower lasts one day.',['vi','daisy','#7c5ce0','lobed',{R:20,fl:{n:36,pw:.07,cr:.3,disc:'#efe9ff',sh:'ov',under:'#ffffff'},lf:{l:22}}]],
['kunjalata','Kunjalata','কুঞ্জলতা','Cypress vine','Ipomoea quamoclit',3,'Full sun',2,'Moderate',2,'Every 2 days','0.5 L per 10-inch pot','Any garden soil','f','8-12','August to December','An annual: sow in May–June. It reseeds itself every year once established.',['vi','st6','#e3242b','fine',{R:11,many:1,fl:{n:5,pw:.5,sh:'ov',c2:'#ffffff'},lf:{l:22,fw:14}}]],
['morningglory','Morning glory','মর্নিং গ্লোরি','Bhorer ful','Ipomoea purpurea',3,'Full sun',2,'Moderate',2,'Every 1–2 days','0.5–1 L per 12-inch pot','Average, well-drained soil','f','9-2','September to February','Flowers open at dawn and close by noon. Nick the seed coat and soak overnight before sowing.',['vi','trump','#3b5bdb','heart',{R:21,fl:{c2:'#fff7c2',ray:'#c084fc'},lf:{l:24,w:16}}]],
['lotaparul','Lata parul','লতাপারুল','Garlic vine','Mansoa alliacea',3,'Full sun',2,'Moderate to high',2,'Every 2–3 days','2 L for a large tub','Well-drained loam','f','4-5,10-11','Two flushes: April–May and October–November','Crushed leaves smell of garlic. Prune straight after each flush.',['vi','trump','#b57edc','ov',{R:15,many:1,lf:{l:28,w:11,pair:1},fl:{c2:'#f3e8ff'}}]],
['nillata','Nil lota','নীললতা','Bengal clock vine','Thunbergia grandiflora',3,'Full sun to part shade',3,'High',2,'Every 2 days','3 L for a large tub','Rich, moist loam','f','1-12','Most of the year, heaviest in the monsoon','A native giant that can cover a roof in one season. Cut it back hard each winter.',['vi','trump','#8fa8f0','heart',{R:20,fl:{c2:'#fff7c2'},lf:{l:28,w:16}}]],
['pardalata','Parda lota','পর্দালতা','Curtain creeper','Vernonia elaeagnifolia',3,'Full sun to part shade',2,'Moderate',2,'Every 2 days','2–3 L for a large tub','Any fertile loam','g','3-10','Grows fastest March to October','Grown for its hanging green curtain, not its flowers. Trim the bottom edge like a fringe.',['sp','curtain']]
]},
{id:'fruit',short:'Fruit',en:'Fruit trees',bn:'ফলের গাছ',c:'#f0703c',
 intro:'Grafted dwarf trees fruit well in half-drums on a roof. They need sun all day, drainage holes and feeding twice a year.',p:[
['aam','Aam','আম','Mango','Mangifera indica',3,'Full sun, 8 hours',2,'Moderate; dry air while in flower',2,'Every 2–3 days in summer; stop 3 months before flowering','5–8 L for a half-drum','Deep loam, well-drained, pH 5.5–7.5','f','1-3','Flowers Jan–Mar, fruit May–August','Amrapali (BARI Aam-3) and the later BARI Aam-4 stay small in a drum. BARI Aam-11 bears through the year.',['br','mango','#f2b632','lance',{n:3,rx:19,ry:27,c2:'#e9722a',lf:{l:44,w:9,cs:['#2f7a43','#3f8f4b','#8a5a3a']}}],65],
['peyara','Peyara','পেয়ারা','Guava','Psidium guajava',3,'Full sun',2,'Moderate to high',2,'Every 2 days in summer','4–6 L for a half-drum','Any well-drained loam','f','3-5,8-10','Flowers Mar–May and Aug–Oct','DAE lists BARI Peyara-1 to -3. Bend branches down after harvest to force fruiting shoots.',['br','pear','#b7d36a','ov',{n:3,rx:20,ry:23,lf:{l:32,w:13}}],71],
['lebu','Lebu','লেবু','Lemon and lime','Citrus × limon',3,'Full sun',2,'Moderate',2,'Every 2 days; daily in a heatwave','3–5 L for a half-drum','Slightly acidic loam, well-drained','f','2-4,7-9','Main flush Feb–Apr, again in monsoon','DAE lists BARI Lebu-1 to -3 and seedless types. It cannot stand waterlogging, so raise the drum in the monsoon.',['br','citrus','#c9d94a','ov',{n:4,rx:15,ry:19,flc:'#ffffff',lf:{l:26,w:11}}],66],
['pepe','Pepe','পেঁপে','Papaya','Carica papaya',3,'Full sun',2,'Moderate',2,'Every 2 days; never waterlogged','4–6 L for a half-drum','Sandy loam in a raised bed or drum','f','1-12','Flowers all year from 3–4 months old','BARI Pepe-1 and Red Lady suit drums. Too much water brings root and stem rot, so drain fast after rain.',['sp','papaya'],67],
['dalim','Dalim','ডালিম','Pomegranate','Punica granatum',3,'Full sun',1,'Low to moderate',1,'Every 2–3 days; steady while fruit swells','3–4 L for a half-drum','Loam to sandy loam','f','3-6','Flowers Mar–Jun, fruit from August','Uneven watering splits the fruit. Thin the canopy before the monsoon to limit rot.',['br','round','#d83a3a','small',{n:3,rx:21,ry:21,x:'crown',flc:'#f0522a',lf:{l:24,w:6}}]],
['kul','Kul','কুল','Jujube (boroi)','Ziziphus mauritiana',3,'Full sun',1,'Low to moderate',1,'Every 3–4 days; more when fruiting','4–5 L for a half-drum','Almost any soil, even slightly saline','f','9-11','Flowers Sep–Nov, fruit January–March','DAE lists BARI Kul-1 to -3 and BAU Kul. Cut back hard after harvest; it fruits on new wood.',['br','oval','#b9cf5b','round',{n:6,rx:11,ry:13,c2:'#c2562e',lf:{l:16,w:11}}],72],
['malta','Malta','মাল্টা','Sweet orange','Citrus sinensis',3,'Full sun',2,'Moderate',2,'Every 2–3 days','4–5 L for a half-drum','Slightly acidic loam, good drainage','f','2-3','Flowers Feb–Mar, harvest Sep–Nov','BARI Malta-1 stays green when ripe. Do not wait for it to turn orange.',['br','citrus','#7fb341','ov',{n:3,rx:21,ry:21,lf:{l:30,w:12}}]],
['dragon','Dragon fruit','ড্রাগন ফল','Pitaya','Selenicereus undatus',3,'Full sun',2,'Moderate',1,'Twice a week in summer; little in winter','2–3 L per post','Sandy and gritty, rich in compost','f','4-11','Flowers from April, fruit to November','Train it up a concrete post with a ring on top. Hand-pollinate the night flowers for bigger fruit.',['sp','dragon'],'bari'],
['litchu','Litchu','লিচু','Litchi','Litchi chinensis',3,'Full sun',3,'High',2,'Every 2–3 days in a drum; more as fruit swells','5–8 L for a half-drum','Deep, slightly acidic loam','f','2-3','Flowers Feb–Mar, fruit May–June','DAE lists BARI Litchu-1, -2 and -3. Net the tree as the fruit colours, or bats and birds take it.',['br','litchi','#d6304a','lance',{n:3,rx:22,ry:22,lf:{l:36,w:9}}],73],
['kola','Kola','কলা','Banana','Musa species',3,'Full sun',3,'High',3,'Every 1–2 days in a drum','5–8 L for a half-drum','Rich, deep loam with compost','f','1-12','Bunch forms 10–14 months after planting','DAE lists BARI Kola-1 to -4 and Sabri. Plant suckers after the monsoon and keep one follower per plant.',['sp','banana'],69],
['anarosh','Anarosh','আনারস','Pineapple','Ananas comosus',3,'Full sun',2,'Moderate to high',1,'Every 3–4 days','1 L per 12-inch pot','Acidic sandy loam, sharply drained','f','2-4','Flowers Feb–Apr, fruit June–August','Plant suckers in October–November (DAE). Honey Queen is small and sweet; Giant Kew is large.',['sp','pine'],68],
['kathal','Kathal','কাঁঠাল','Jackfruit','Artocarpus heterophyllus',3,'Full sun',3,'High',1,'Weekly while young; never waterlogged',TREEA,'Deep, well-drained loam on high ground','f','12-2','Flowers Dec–Feb, fruit May–July','The national fruit. DAE calls it very sensitive to standing water, so plant it on the highest spot.',['br','jack','#9dbb4a','big',{n:2,rx:24,ry:36,lf:{l:36,w:16,cs:['#1f6b3a','#2f7a43']}}],70],
['jamrul','Jamrul','জামরুল','Wax apple','Syzygium samarangense',3,'Full sun',3,'High',3,'Every 1–2 days when fruiting','5–8 L for a half-drum','Moist, fertile loam','f','2-4','Flowers Feb–Apr, fruit April–June','One of the best fruit trees for a drum. Thai red and white types can fruit more than once a year.',['br','pear','#f0647c','big',{n:5,rx:13,ry:17,lf:{l:40,w:14}}]],
['sofeda','Sofeda','সফেদা','Sapodilla','Manilkara zapota',3,'Full sun',2,'Moderate to high',2,'Every 2–3 days','5 L for a half-drum','Well-drained sandy loam; tolerates salt','f','1-12','Flowers on and off all year','Slow but tough, and happy near the coast. Pick when the brown skin loses its scurf.',['br','oval','#a8794a','ov',{n:4,rx:16,ry:18,lf:{l:28,w:10}}]],
['kamranga','Kamranga','কামরাঙা','Star fruit','Averrhoa carambola',3,'Full sun',3,'High',2,'Every 2 days','5 L for a half-drum','Slightly acidic loam','f','4-6,9-11','Main flushes in summer and autumn','Sweet grafted types fruit within two years in a drum. Thin crowded fruit for larger size.',['br','star','#e9d33a','comp',{n:4,rx:14,ry:24,lf:{comp:4,l:34,ll:13,lw:6}}]],
['amra','Amra','আমড়া','Hog plum','Spondias dulcis',3,'Full sun',2,'Moderate to high',2,'Every 2–3 days','5 L for a half-drum','Any well-drained loam','f','3-4','Flowers Mar–Apr, fruit August–October','The dwarf baromashi (year-round) type fruits in a 20-inch tub. It drops its leaves in winter.',['br','oval','#7fae3f','comp',{n:5,rx:13,ry:18,lf:{comp:4,l:38,ll:15,lw:6}}]],
['sharifa','Sharifa','শরিফা','Custard apple (ata)','Annona squamosa',3,'Full sun',2,'Moderate',1,'Every 3–4 days','4–5 L for a half-drum','Sandy loam; dislikes wet feet','f','4-6','Flowers Apr–Jun, fruit August–October','Hand-pollinate with a small brush in the evening for well-shaped fruit. Leafless in winter.',['br','round','#9fbf6a','ov',{n:3,rx:20,ry:20,x:'bumps',lf:{l:30,w:10,cs:['#5f9a55','#6fae62']}}]],
['jambura','Jambura','জাম্বুরা','Pomelo (batabi lebu)','Citrus maxima',3,'Full sun',3,'Moderate to high',2,'Every 2–3 days','5–8 L for a half-drum','Deep, slightly acidic loam','f','2-3','Flowers Feb–Mar, fruit August–October','Support heavy fruit with net slings. Feed after harvest and again before flowering.',['br','citrus','#c5d86a','big',{n:2,rx:30,ry:30,lf:{l:36,w:15}}]],
['strawberry','Strawberry','স্ট্রবেরি','Strawberry','Fragaria × ananassa',3,'Full sun, cool season',1,'Low to moderate',2,'Every 1–2 days; keep fruit off wet soil','0.3 L per 8-inch pot','Sandy loam with compost','f','12-2','Flowers Dec–Feb, fruit January–March','Plant runners in October–November and mulch with straw. BARI has released strawberry varieties.',['pot',null,null,'serr',{lay:'trail',pot:'bowl',fruit:{sh:'berry',c:'#e3242b',rx:9,ry:12},lf:{l:18,w:12}}]]
]},
{id:'veg',short:'Vegetables',en:'Vegetables',bn:'সবজি',c:'#2f9e58',
 intro:'Rabi (winter) and kharif (summer and monsoon) crops for pots, drums and a bamboo macha. Most of these pages are checked against DAE crop pages.',p:[
['tomato','Tomato','টমেটো','Tomato','Solanum lycopersicum',3,'Full sun, 6–8 hours',2,'Moderate; cool nights set fruit',2,'Every 1–2 days, at the root','1 L per 12-inch pot','Loam rich in compost, pH 6–7','f','11-2','Flowers Nov–Feb, pick December–March','Main crop is sown Sept–Oct; DAE lists BARI Tomato-4 and -5 as year-round types. It cannot stand waterlogging.',['pot',null,null,'comp',{lay:5,pot:'drum',fruit:{sh:'tomato',c:'#e3342f',rx:14,ry:12,cal:1},lf:{comp:2,l:24,ll:12,lw:6,sh:'serr'}}],13],
['begun','Begun','বেগুন','Brinjal','Solanum melongena',3,'Full sun',2,'Moderate to high',2,'Every 1–2 days','1–1.5 L per 14-inch pot','Fertile loam, well-drained','f','10-4','Winter crop planted late Aug–mid Oct','DAE lists BARI Begun-1 to -10. Remove wilted shoot tips against borer and hang pheromone traps.',['pot',null,null,'serr',{pot:'drum',fruit:{sh:'pear',c:'#5b2a86',rx:10,ry:22,cal:1},lf:{l:34,w:17}}],15],

['anthurium','Anthurium','অ্যান্থুরিয়াম','Flamingo flower','Anthurium andraeanum',2,'Bright indirect light',3,'High',2,'Twice a week','0.3 L per 8-inch pot','Coarse mix of coco husk and charcoal','f','1-12','Flowers through the year in good light','Each waxy spathe lasts six to eight weeks. Feed monthly at half strength.',['bl','#2f8a48',{n:7,w:16,l:70,sp:60,broad:1,heart:1,spathe:'#e3242b',pot:'white'}]],
['caladium','Caladium','ক্যালাডিয়াম','Angel wings','Caladium bicolor',2,'Bright shade',3,'High',2,'Every 2 days while in leaf','0.3 L per 8-inch pot','Rich, moist, well-drained mix','g','4-10','In leaf April to October','It dies back in winter. Keep the tuber dry in its pot and water again in spring.',['bu','heart',['#3f9b55','#4fae62'],{n:6,single:1,pot:'white',lf:{l:36,w:24,c2:'#f06292',vc:'#ffffff'}}]],

{id:'hedges',short:'Hedges and palms',en:'Hedges, palms and lawn',bn:'বেড়া, পাম ও ঘাস',c:'#2c8fd6',
 intro:'The structure of a garden: clipped boundaries, a lawn underfoot and a few bold shapes.',p:[
['duranta','Duranta','ডুরান্টা','Golden dewdrop','Duranta erecta',3,'Full sun',2,'Any',2,'Every 2–3 days','1 L per metre of hedge','Any well-drained soil','g','1-12','Clipped all year','The standard golden hedge of Dhaka. Clip monthly; in shade the leaves turn green.',['hg',{c:['#c9d94a','#a8c93a','#e3e86a'],fl:'#8fa8f0'}]],
['mehedi','Mehedi','মেহেদি','Henna','Lawsonia inermis',3,'Full sun',1,'Low to moderate',1,'Every 3–4 days','1 L per metre of hedge','Any soil, including dry and poor','f','4-7','Scented flowers April to July','A tough boundary hedge. Regular clipping gives fresh leaves for henna paste.',['hg',{c:['#3f8f4b','#57a65a','#2f7a43'],fl:'#fff7e0'}]],
['acalypha','Acalypha','অ্যাকালিফা','Copperleaf','Acalypha wilkesiana',3,'Full sun for best colour',3,'High',2,'Every 2 days','1 L per 12-inch pot','Fertile loam','g','1-12','Colourful all year','A fast screen in copper, red and pink. Cut it back by half before the monsoon.',['bu','serr',['#a3274a','#c2562e','#7a1f3d','#d98a6a'],{n:5,lf:{l:30,w:16}}]],
['jhau','Jhau','ঝাউ','Oriental thuja','Platycladus orientalis',3,'Full sun',2,'Moderate',2,'Every 2–3 days in pots','1–2 L per 14-inch pot','Well-drained sandy loam','g','1-12','Evergreen','Browning from the inside means waterlogging. Turn the pot monthly for even growth.',['hg',{cone:1,c:['#2f7a43','#3f8f4b','#57a65a']}]],
['cycas','Cycas','সাইকাস','Sago palm','Cycas revoluta',3,'Full sun to bright shade',2,'Moderate',1,'Once a week','1 L per 14-inch pot','Sandy, sharply drained mix','g','3-6','New ring of leaves March to June','Very slow: one ring of leaves a year. All parts, especially the seeds, are toxic to pets.',['pm','cycas']],
['bottlepalm','Bottle palm','বোতল পাম','','Hyophorbe lagenicaulis',3,'Full sun',3,'High',2,'Every 2–3 days','3–5 L for a large tub','Well-drained sandy loam','g','3-10','Grows March to October','It keeps only four to six fronds at a time, so never cut a green one.',['pm','bottle']],
['durba','Durba','দূর্বা','Bermuda grass','Cynodon dactylon',3,'Full sun',2,'Moderate',2,'Every 2–3 days in the dry season','5–6 L per square metre','Levelled sandy loam','g','3-10','Grows fastest March to October','Plant sprigs at the start of the rains. Mow at 3–4 cm and it knits into a dense lawn.',['gr']]
]},
{id:'succulents',short:'Succulents',en:'Cacti and succulents',bn:'ক্যাকটাস ও সাকুলেন্ট',c:'#c95f9c',
 intro:'Water-storing plants for the hottest corner of the roof. The monsoon, not the heat, is their danger.',p:[
['adenium','Adenium','অ্যাডেনিয়াম','Desert rose','Adenium obesum',3,'Full sun, 6+ hours',1,'Low',1,'Twice a week in summer; monthly in winter','Soak, then dry out completely','Coarse sand, brick chips, a little compost','f','3-10','March to October, peak Apr–Jun','Move it under cover in the monsoon. A rain-soaked caudex rots within days.',['pot','pin','#e83e6c','small',{R:28,lay:5,stem:'caudex',pot:'bowl',fl:{c1:'#ffe3ea',cr:0},lf:{l:20,w:7}}]],
['kantamukut','Kanta mukut','কাঁটামুকুট','Crown of thorns','Euphorbia milii',3,'Full sun',1,'Low to moderate',1,'Every 4–5 days','0.2–0.3 L per 8-inch pot','Sandy, gritty mix','f','1-12','All year','It flowers nonstop on a hot roof. The white sap irritates skin and eyes.',['pot','x4','#e5322d','small',{m:7,fr:9,Rc:20,lay:5,stem:'thorn',fl:{n:2,pw:1.3,c2:'#f6c445'},lf:{l:18,w:7}}]],
['timeful','Time ful','টাইম ফুল','Moss rose','Portulaca grandiflora',3,'Full sun',1,'Low',1,'Every 2–3 days','0.2 L per shallow pot','Sandy soil','f','3-10','March to October','Flowers open in the morning sun and close by afternoon. Any cut stem will root.',['pot','dbl','#f43f8e','strap',{lay:'trail',R:22,pot:'bowl',fl:{n:5,pw:.95,c2:'#f6c445'},lf:{l:12,w:2.4}}]],
['pathorkuchi','Pathorkuchi','পাথরকুচি','Miracle leaf','Kalanchoe pinnata',2,'Bright light to part sun',1,'Low to moderate',1,'Once a week','0.2 L per 8-inch pot','Sandy, well-drained','f','1-3','Bell flowers January to March','Lay a leaf on damp soil and plantlets sprout from the notches along its edge.',['bu','serr',['#5aa469','#6fb57a'],{n:4,lf:{l:25,w:15,vc:'#c9647a'}}]],
['kalanchoe','Kalanchoe','ক্যালাঞ্চো','Flaming Katy','Kalanchoe blossfeldiana',3,'Bright light',1,'Low',1,'Once a week','0.2 L per 6-inch pot','Sandy, well-drained mix','f','12-3','December to March','Short winter days trigger the flowers. Cut off spent heads and keep it dry in the rains.',['pot','x4','#f0522a','round',{m:14,fr:6,Rc:22,lay:5,pot:'white',lf:{l:20,w:15,pair:1}}]],
['jade','Jade plant','জেড প্ল্যান্ট','Money tree','Crassula ovata',3,'Bright light, some direct sun',1,'Low',1,'Every 10–14 days','Soak, then dry out fully','Gritty cactus mix','g','10-3','Grows mainly in the cool months','Wrinkled leaves mean thirst; mushy ones mean rot. Shelter it from monsoon rain.',['bu','round',['#3f9b55','#57a65a'],{n:5,sc:'#8a6a4a',pot:'bowl',lf:{l:13,w:10,rib:0}}]],
['haworthia','Haworthia','হাওয়ার্থিয়া','Zebra plant','Haworthiopsis attenuata',2,'Bright shade',1,'Low',1,'Every 2 weeks','A few spoonfuls at the base','Sand and brick chips with a little soil','g','10-3','Grows mainly in the cool months','One of the few succulents happy on a desk. Offsets around the base can be split off.',['ro','#2f7a55',{sh:'ov',R:52,stripe:'#ffffff',pot:'white',n:[11,9,6],pw:.24}]],
['echeveria','Echeveria','ইচেভেরিয়া','Stone rose','Echeveria species',3,'Bright light, soft morning sun',1,'Low',1,'Every 10 days; less in the monsoon','Water the soil, never the rosette','Very gritty mix','g','10-3','Grows mainly in the cool months','It struggles in humid heat. Give it moving air and a rain shelter from June to September.',['ro','#8fc7b0',{sh:'ob',R:52,tip:'#e88fa8',pot:'bowl',n:[9,8,6],pw:.5}]],
['fonimonsha','Fonimonsha','ফণীমনসা','Prickly pear','Opuntia species',3,'Full sun',1,'Low',1,'Every 2–3 weeks; keep out of monsoon rain','A light soak','Sand and brick chips, very little soil','f','3-6','March to June','Handle the pads with folded newspaper. Shelter the pot under a roof edge in the monsoon.',['pd',{c:'#5fa860',f:'#f6c445'}]],
['barrel','Golden barrel','গোল্ডেন ব্যারেল','Barrel cactus','Echinocactus grusonii',3,'Full sun',1,'Low',1,'Every 3 weeks; none in the monsoon','A light soak','Sand and brick chips','g','3-6','Grows March to June','Turn the pot a quarter each month or it leans to the light. Keep it under cover when it rains.',['bc']]
]},
{id:'water',short:'Water and orchids',en:'Water plants and orchids',bn:'জলজ ও অর্কিড',c:'#3c7fd0',
 intro:'Two special cases: plants rooted in a tub of water, and orchids that grow with no soil at all.',p:[
['shapla','Shapla','শাপলা','Water lily','Nymphaea nouchali',3,'Full sun, 5–6 hours',3,'Grows in water',3,'Keep 15–30 cm of water over the soil','Top up weekly; refresh monthly','Heavy clay or pond mud','f','6-11','June to November','The national flower. A 60 cm tub is enough; add guppies to eat mosquito larvae.',['wa',{c:'#ffffff'}]],
['lalshapla','Lal shapla','লাল শাপলা','Red water lily','Nymphaea rubra',3,'Full sun',3,'Grows in water',3,'Keep 15–30 cm of water over the soil','Top up weekly','Heavy clay or pond mud','f','6-11','June to November','It opens in the evening and closes by mid-morning. Push a fertiliser ball into the mud each month.',['wa',{c:'#d6304a',bg:'dusk'}]],
['poddo','Poddo','পদ্ম','Sacred lotus','Nelumbo nucifera',3,'Full sun, 6+ hours',3,'Grows in water',3,'Keep 10–20 cm of water over the soil','Top up every few days in summer','Clay loam; push fertiliser tablets into the mud','f','6-10','June to October','Plant the tuber flat in spring without breaking its tip. It is leafless in winter.',['wa',{c:'#f8c8d8',tip:'#f06292',lotus:1,n:9,pw:.44}]],
['chandmala','Chandmala','চাঁদমালা','Water snowflake','Nymphoides indica',3,'Full sun to part shade',3,'Grows in water',3,'Keep 10–30 cm of water','Top up weekly','Clay loam','f','6-11','June to November','Small fringed white flowers over lily-like pads. Ideal for a small bowl.',['wa',{c:'#ffffff',small:1}]],
['topapana','Topa pana','টোপাপানা','Water lettuce','Pistia stratiotes',2,'Bright shade to sun',3,'Floats on water',3,'Floating; it needs no soil','Top up weekly','None','g','4-10','Multiplies April to October','It shades the water and limits algae. Thin it often and never release it into ponds or canals.',['wa',{float:1}]],

['rasna','Rasna','রাস্না','Vanda orchid','Vanda tessellata',2,'Bright filtered light',3,'High',2,'Mist the roots daily in the dry season','Wet the aerial roots fully','Mounted on wood or in a bare basket','f','4-6','April to June','A native orchid found on mango trunks. Tie it to a branch and let the roots hang.',['spk','orch','#c9a04a','strap',{k:4,fr:14,pot:'slat',bg:'mint',nb:8,bs:140,lf:{l:56,w:7},fl:{c2:'#8e6bbf'}}]],
['foxtail','Foxtail orchid','ফক্সটেইল অর্কিড','Kopou','Rhynchostylis retusa',2,'Bright filtered light',3,'High',2,'Mist the roots daily in the dry season','Wet the roots fully','Mounted on wood, no soil','f','4-6','April to June','A native orchid with a hanging spike of a hundred small flowers. Never cut its aerial roots.',['spk','orch','#f3d6ee','strap',{hang:1,k:11,fr:7,bg:'mint',lf:{l:56,w:8},fl:{c2:'#c026d3'}}]],
['phalaenopsis','Phalaenopsis','ফ্যালেনপসিস','Moth orchid','Phalaenopsis hybrids',1,'Bright shade; no direct sun',3,'High',2,'Once a week','Soak the pot for 10 minutes, then drain','Bark chips or coco husk','f','1-4','January to April','The easiest orchid indoors. After flowering, cut the spike above the second node for a rebloom.',['spk','orch','#ffffff','big',{k:3,fr:19,pot:'white',bg:'lilac',nb:4,bs:150,tips:[[240,40,1]],lf:{l:46,w:17,cs:['#2f7a43','#3f8f4b']},fl:{c2:'#e83e8c'}}]]
]}

rambutan:['ফুল ফেব্রু–এপ্রিল, ফল জুন–আগস্ট','লিচুর আত্মীয়; উষ্ণ, ভেজা পূর্ব ও দক্ষিণাঞ্চলের গাছ। কলমের চারা কিনুন: বীজের গাছ পুরুষ হলে কখনো ফল দেয় না।'],

miracleberry:['মার্চ থেকে অক্টোবরে থেমে থেমে ফল','একটি ফল খেলে এক ঘণ্টা টক খাবারও মিষ্টি লাগে। অম্লীয় মাটি দরকার; চুনযুক্ত মাটিতে পাতা হলুদ হয়।'],
lokat:['ফুল অক্টোবর–ডিসেম্বর, ফল মার্চ–এপ্রিল','শরতে ফুল দেয়, বসন্তে ফল পাকে, যখন অন্য ফল কম থাকে।'],
tecoma:['প্রায় সারা বছর ফুল','দ্রুত বাড়ে, খরা সহ্য করে, প্রায় সব সময় ফুল থাকে। শুঁটি কেটে ফেলুন, প্রতি দফা ফুলের পর ছেঁটে দিন।'],

heliconia:['এপ্রিল থেকে অক্টোবরে ফুল','কলাগাছের মতো পাতা; লাল-হলুদ মঞ্জরিপত্র কেটে রাখলেও কয়েক সপ্তাহ টেকে। বর্ষার শুরুতে ঝাড় ভাগ করুন।'],
bleedingheart:['মার্চ থেকে অক্টোবরে ফুল','সাদা লণ্ঠনের মতো বৃতির ভেতরে একটি করে লাল ফুল। ফুলের পর ছেঁটে দিন; নতুন ডালে ফুল আসে।'],

basil:['নভেম্বর থেকে এপ্রিলে সেরা','পাতা পেতে থাকতে ফুলের কুঁড়ি ভেঙে দিন। ইতালিয়ান ও সিনামন বেসিল দুটোই শীতে ভালো হয়।'],
darchini:['মে থেকে আগস্টে বাকল তোলা হয়','মসলাটি দুই বছর বয়সী ডালের ভেতরের বাকল, বর্ষায় ছাড়ানো হয়। গাছ কেটে দিলে আরও ডাল ছাড়ে।'],
elach:['সেপ্টেম্বর থেকে নভেম্বরে ফল তোলা হয়','ঘন ছায়া ও সব সময় আর্দ্রতা চায়, ফল দিতে তিন বছর লাগে। সমতলে গাছ ভালো হলেও ফল কম ধরে।'],

araucaria:['চিরসবুজ','নরম ডালের থাক, বছরে একটি নতুন থাক হয়। মাথা কখনো কাটবেন না: নতুন মাথা আর গজায় না।'],

candytuft:[FL('জানুয়ারি','মার্চে'),'নিচু গাছে সাদা, গোলাপি ও হালকা বেগুনি ফুলের চ্যাপ্টা থোকা। বীজ থেকে সবচেয়ে দ্রুত ফোটা শীতের ফুলগুলোর একটি।'],

nasturtium:[FL('ডিসেম্বর','মার্চে'),'গোল পাতা আর কমলা, হলুদ বা লাল ফুল; সবই খাওয়া যায়, স্বাদ ঝাঁঝালো। অনুর্বর মাটিতে ফুল বেশি, উর্বর মাটিতে শুধু পাতা।'],
verbena:[FL('ডিসেম্বর','এপ্রিলে'),'নিচু হয়ে ছড়ায়; লাল, বেগুনি, গোলাপি বা সাদা ফুলের চ্যাপ্টা থোকা। টবের কিনারা বা ঝুলন্ত ঝুড়িতে ভালো।'],
gazania:[FL('ডিসেম্বর','এপ্রিলে'),'কমলা ও হলুদ রঙের বড় ডেইজি, মাঝে গাঢ় বলয়। মেঘলা দিনে ও রাতে ফুল বুজে থাকে।'],
dimorphotheca:[FL('ডিসেম্বর','মার্চে'),'চকচকে কমলা, স্যামন ও সাদা ডেইজি, শুধু রোদে খোলে। শুকনো, খোলা জায়গায় সরাসরি বীজ বুনুন।'],
strawflower:[FL('জানুয়ারি','এপ্রিলে'),'কাগজের মতো ফুল, শুকালেও রং থাকে। আধফোটা অবস্থায় কেটে ছায়ায় উল্টো করে ঝুলিয়ে দিন।'],
gaillardia:[FL('ফেব্রুয়ারি','জুনে'),'লাল ডেইজি, ডগা হলুদ; শীতের অন্য ফুল শেষ হওয়ার পর গরমেও ফুটতে থাকে।'],
impatiens:[FL('অক্টোবর','মার্চে'),'ছায়াঘেরা বারান্দার জন্য গোলাপি, লাল, সাদা ও কমলা রঙের চ্যাপ্টা ফুল। ডাঁটা পানিতে ভরা; টব শুকালে নেতিয়ে পড়ে।'],
torenia:[FL('জুন','অক্টোবরে'),'বর্ষাজুড়ে ছায়ায় ফোটে এমন অল্প কয়েকটি মৌসুমি ফুলের একটি। বেগুনি-সাদা ফুল, গলা হলুদ।'],
gomphrena:[FL('জুন','ডিসেম্বরে'),'ম্যাজেন্টা রঙের বোতামের মতো ফুল; সপ্তাহের পর সপ্তাহ থাকে, শুকিয়েও রাখা যায়। গরম ও বৃষ্টিতে ভালো হয়, যখন মৌসুমি ফুল কম।'],
ashok:[FL('ফেব্রুয়ারি','এপ্রিলে'),'ডাল থেকে সরাসরি কমলা-লাল ফুলের থোকা, রাতে সুগন্ধ ছড়ায়। ছোট, ধীরে বাড়া, ছায়াপ্রিয় গাছ; অশোক নামে বিক্রি হওয়া লম্বা “দেবদারু” নয়।'],
nagalingam:[FL('মার্চ','সেপ্টেম্বরে'),'কাণ্ড থেকে বড়, সুগন্ধি গোলাপি ফুল ঝোলে, পরে ভারী বাদামি “কামানের গোলা” ধরে। পথের ওপরে লাগাবেন না।'],
udoypodmo:[FL('এপ্রিল','জুলাইয়ে'),'চকচকে পাতার মাঝে বিশাল সাদা, লেবু-গন্ধি ফুল; পাতার নিচ মরচে রঙের। ধীরে বাড়ে; ছোট অবস্থায় আধা ছায়ায় ভালো থাকে।'],
muchkunda:[FL('ফেব্রুয়ারি','এপ্রিলে'),'বিশাল পাতার মাঝে রাতে বড় সাদা, সুগন্ধি ফুল ফোটে; পাতার নিচ রুপালি। পার্ক ও সড়কের লম্বা গাছ।'],
kurchi:[FL('এপ্রিল','জুনে'),'গ্রীষ্মের শুরুতে সাদা, সুগন্ধি ফুলে ঢেকে যাওয়া ছোট গাছ। বাকল লোকজ চিকিৎসায় ব্যবহার হয়।'],
chhatim:[FL('অক্টোবর','নভেম্বরে'),'সবুজাভ-সাদা ফুল হেমন্তের রাত ভারী গন্ধে ভরে দেয়। পাতা সাতটি করে চক্রাকারে থাকে; খুব বড় গাছ হয়।'],
mandar:[FL('ফেব্রুয়ারি','মার্চে'),'পাতাহীন, কাঁটাওয়ালা ডালে টকটকে লাল নখের মতো ফুল। বড় ডাল পুঁতে জীবন্ত বেড়ার খুঁটি করা হয়।'],
rudrapalash:[FL('জানুয়ারি','এপ্রিলে'),'গাছের মাথায় বড় কমলা-লাল পেয়ালার মতো ফুল। ডাল ভঙ্গুর, তাই ঘরবাড়ি থেকে দূরে লাগান।'],
pinktabebuia:[FL('ফেব্রুয়ারি','এপ্রিলে'),'দুই-তিন সপ্তাহ পাতাহীন গাছ গোলাপি ফুলে ঢেকে থাকে। নতুন সড়কের ধারে ও পার্কে লাগানো হয়।'],
gliricidia:[FL('ফেব্রুয়ারি','মার্চে'),'বসন্তে পাতাহীন ডালজুড়ে ফিকে গোলাপি ফুল। খুঁটি পুঁতে জীবন্ত বেড়া হয়; পাতা সবুজ সার হিসেবে কাজে লাগে।'],
jacaranda:[FL('মার্চ','মে মাসে'),'ফার্নের মতো পাতার আধা-ন্যাড়া গাছে ল্যাভেন্ডার-নীল ফুল। শুকনো, ঠান্ডা শীতের পর সবচেয়ে ভালো ফোটে।'],
konokchura:[FL('মার্চ','জুনে'),'চওড়া, গাঢ় সবুজ মাথার ওপরে খাড়া হলুদ মঞ্জরি, পরে তামাটে শুঁটি। শহরের বাতাস সহ্য করা পরিচিত সড়কের গাছ।'],
lalsonail:[FL('এপ্রিল','জুনে'),'ডালজুড়ে গোলাপি-সাদা ফুলের থোকা, যেন গোলাপি সোনালু। দ্রুত বাড়ে; বর্ষার শুরুতে চারা লাগান।'],
hijal:[FL('মে','জুলাইয়ে'),'লম্বা ঝুলন্ত মঞ্জরিতে লাল ফুল রাতে ফোটে, ভোরে পানির ওপর বিছিয়ে থাকে। হাওর ও পুকুরপাড়ের গাছ; মাসের পর মাস পানিতে ডুবে থাকতে পারে।'],
barun:[FL('মার্চ','এপ্রিলে'),'নতুন পাতার সঙ্গে গাছ সাদা ফুলে ঢেকে যায়, পুংকেশর লম্বা ও বেগুনি। পানির ধারে হয়।'],
bottlebrush:['মার্চ–মে, আবার হেমন্তে ফুল','ঝুলন্ত ডালে লাল ব্রাশের মতো ফুল। ছোট গাছ, শহরের বাগানে ধরে যায়।'],
bokful:[FL('অক্টোবর','ফেব্রুয়ারিতে'),'বকের ঠোঁটের মতো বড় সাদা বা লাল ফুল, বড়া করে খাওয়া হয়। খুব দ্রুত বাড়ে, কয়েক বছরই বাঁচে।'],
minjiri:[FL('আগস্ট','ডিসেম্বরে'),'মাসের পর মাস খাড়া হলুদ ফুলের থোকা। রাস্তার ধারের ও জ্বালানি কাঠের শক্ত গাছ; কাটলে আবার গজায়।'],
anantalata:[FL('এপ্রিল','নভেম্বরে'),'ছোট গোলাপি হৃদয়ের মতো ফুলের ছড়া, সারা দিন মৌমাছি আসে। শীতে মরে যায়, কন্দ থেকে আবার গজায়।'],
flamevine:[FL('ডিসেম্বর','ফেব্রুয়ারিতে'),'মাঘের শীতে কমলা নলাকার ফুলের পর্দা। পুরো রোদ এবং শক্ত বেড়া বা চালা দরকার।'],
capehoneysuckle:[FL('সেপ্টেম্বর','মার্চে'),'লতানো ঝোপে কমলা নলাকার ফুলের থোকা। ছেঁটে বেড়া করুন বা বেড়ায় বেঁধে দিন; মৌটুসি আসে।'],
mandevilla:[FL('মার্চ','নভেম্বরে'),'চকচকে পাতা আর গোলাপি, লাল বা সাদা ফুল; টব ও ছোট মাচার হালকা লতা। কষে ত্বক জ্বালা করে।'],
blackeyedsusan:[FL('সেপ্টেম্বর','মার্চে'),'হালকা লতায় কমলা বা হলুদ ফুল, মাঝে কালো চোখ। বীজ থেকে দ্রুত হয়; জাল বা ঝুলন্ত টবে ভালো।'],
railwaycreeper:[YR,'হালকা বেগুনি ফুল আর আঙুলের মতো পাতা। খুব জোরে বাড়ে: এক মৌসুমে বেড়া ঢেকে ফেলে, ছেঁটে রাখতে হয়।'],
moonflower:[FL('জুলাই','নভেম্বরে'),'বড় সাদা, সুগন্ধি ফুল সন্ধ্যায় ফোটে, ভোরে বুজে যায়। সন্ধ্যায় যেখানে বসেন, সেখানে লাগান।'],
hangsalata:[FL('জুন','অক্টোবরে'),'মেরুন শিরার ফুল দেখতে ভাসমান হাঁসের মতো। ছায়াঘেরা মাচার জন্য মজার গাছ; কাছে গেলে ফুলে হালকা বাজে গন্ধ।'],
kochuripana:[FL('অক্টোবর','জানুয়ারিতে'),'ভাসমান গুচ্ছের ওপরে হালকা বেগুনি ফুল, মাঝে হলুদ চোখ। আগ্রাসী আগাছা: শুধু বন্ধ টবে রাখুন, পুকুর বা খালে কখনো ছাড়বেন না।'],
paniphal:['অক্টোবর থেকে ডিসেম্বরে সংগ্রহ','ভাসমান গুচ্ছের নিচে শিংওয়ালা, শ্বেতসারে ভরা ফল; হেমন্তে সিদ্ধ করে বিক্রি হয়। অগভীর পুকুর ও ডোবায় চাষ হয়।'],
vanda:['বছরে দুই-তিনবার ফুল','খালি ঝুলন্ত ঝুড়িতে হয়, শিকড় থাকে বাতাসে। অন্য অর্কিডের চেয়ে বেশি আলো লাগে, গ্রীষ্মে রোজ ভিজিয়ে দিতে হয়।'],
oncidium:[FL('অক্টোবর','ফেব্রুয়ারিতে'),'ঘাগরা পরা নর্তকীর মতো ছোট হলুদ ফুলের ছড়া। ছায়াঘেরা বারান্দার সবচেয়ে সহজ অর্কিডগুলোর একটি।'],
cattleya:['বছরে একবার ফুল, প্রায়ই মার্চ–মে','বড়, ঝালরওয়ালা, সুগন্ধি ফুল। দুই পানির মাঝে মিশ্রণ শুকাতে দিন; ভেজা থাকলে পচে যায়।'],
groundorchid:[MY,'সাধারণ মাটিতেই হয় এমন অর্কিড। ভাঁজ করা পাতা আর বেগুনি ফুল: নতুনদের জন্য সবচেয়ে সহজ অর্কিড।'],
kash:[FL('সেপ্টেম্বর','অক্টোবরে'),'নদীর পাড় ও চরের সাদা কাশফুল শরতের আগমন জানায়। মাটির নিচের কাণ্ড দিয়ে ছড়ায়; বাগানের জন্য বেশি আগ্রাসী।'],
bhat:[FL('ফেব্রুয়ারি','এপ্রিলে'),'বসন্তে গ্রামের পথের ধারে সাদা ফুল, মাঝে গোলাপি, পুংকেশর লম্বা; সন্ধ্যায় সুগন্ধ ছড়ায়।'],
shialkanta:[FL('জানুয়ারি','এপ্রিলে'),'কাঁটাওয়ালা, নীলচে-সবুজ গাছে হলুদ ফুল; কষও হলুদ। বীজ বিষাক্ত, সরিষার সঙ্গে কখনো মিশতে দেবেন না।'],
akanda:[YR,'পতিত জমির ধূসর ঝোপে মোমের মতো হালকা বেগুনি বা সাদা মুকুট-আকৃতির ফুল। দুধের মতো কষ বিষাক্ত, চোখের ক্ষতি করে।'],
dhutura:[FL('জুন','নভেম্বরে'),'বড় সাদা বা বেগুনি ফুল সন্ধ্যায় ফোটে। প্রতিটি অংশ মারাত্মক বিষাক্ত; শিশুরা যেখানে খেলে সেখানে রাখবেন না।'],
lojjaboti:[FL('জুন','নভেম্বরে'),'ছুঁলেই পাতা বুজে যায়, কয়েক মিনিটে আবার খোলে। গোলাপি পমপমের মতো ফুল; ডাঁটায় কাঁটা আছে।'],

const NOTES={
shrubs:['A handful of well-rotted cow dung or vermicompost every two months, plus a spoonful of mixed NPK each month from March to October. Stop feeding in mid-winter.','Mealybugs, aphids and whitefly cluster on new shoots: wash them off, then spray neem oil or soapy water weekly. Sooty mould follows the insects and clears once they are gone.','Grows across the country. In the saline south-west, use raised beds or pots of sweet soil; in the north, water more through the dry, cold months.'],
fragrant:['Mustard oil cake soaked for a week and diluted ten times, every three weeks in the growing season, brings more flowers. Prune after each flush.','Bud drop usually means dry soil or a sudden move. Watch for mealybugs in the leaf joints and red spider mite in hot, dry weeks.','All districts. They flower most in warm, humid weather and slow down in the dry winter.'],
seasonal:['Mix compost into the pot before sowing, then give a weak liquid feed every two weeks once buds show. Too much nitrogen gives leaves instead of flowers.','Seedlings collapse from damping-off in wet soil: sow thinly and water in the morning. Aphids and leaf miners arrive in late winter; powdery mildew follows foggy spells.','Winter annuals flower for longer in the cooler north and north-west. In Dhaka and the south, sow by early November so they finish before the March heat.'],
bulbs:['Bone meal or compost at planting, then a potash-rich feed as the flower spikes form. Let the leaves die back naturally so the bulb can recharge.','Bulbs rot in waterlogged soil, which is the commonest loss. Thrips streak gladiolus and lily flowers; caterpillars strip crinum and spider lily leaves.','Gladiolus, tuberose and other cut-flower bulbs are grown commercially around Jashore and Savar. Summer bulbs suit the whole country.'],
climbers:['Compost at the root twice a year and a monthly liquid feed in the growing season. Train new shoots while they are soft, and prune after flowering.','Aphids and mealybugs on soft tips; leaf-eating caterpillars in the rains. Poor flowering usually means too much shade or too much nitrogen.','All districts. Give shelter from wind in coastal areas and on high rooftops.'],
trees:['A basket of cow dung in the planting pit, then a ring of compost each June for the first three years. Established trees need no feeding.','Stake young trees and guard them against goats and storms. Stem borers show as sawdust at holes in the trunk; termites attack in dry soil.','Plant at the start of the rains. Choose hijal, barun and jarul for wet ground, and polash, shimul and sonalu for dry, high ground.'],
water:['Water lilies: push a slow-release fertiliser tablet into the mud every month in summer. Orchids: a quarter-strength liquid feed weekly while the roots are growing.','Aphids on lily pads wash off with a hose. Orchids rot when water sits in the crown; scale insects wipe off with soapy cotton.','Orchids do best in the humid north-east and the hill districts. Elsewhere, give them 50% shade net and mist them in the dry season.'],
wild:['None needed: these plants live on poor soil.','Rarely troubled. Several feed butterflies and bees, so avoid spraying them.','Found across the country on roadsides, field edges and riverbanks. Kash marks the chars and river islands.'],
fruit:['For a half-drum: 2 kg of compost and a handful each of mixed NPK and bone meal twice a year, before the rains and after harvest. For trees in the ground, follow the DAE dose for the crop and its age.','Bag the fruit or hang pheromone traps against fruit fly. Mealybugs, scale and leaf miners attack new growth; anthracnose and sooty mould spot the leaves in humid weather.','Mango and litchi do best in the north-west, pineapple and citrus on the hills of Sylhet and Chattogram, guava in Barishal, and coconut along the coast.'],
mangoes:['Split the yearly feed in two: after harvest and at the end of the rains. Stop watering three months before flowering, and water again once the fruit has set.','Mango hopper at flowering is the main pest: treat as the buds break and again when the fruit is pea-sized. Bag the fruit against fruit fly; anthracnose blackens the flowers in fog.','Rajshahi, Chapainawabganj and Naogaon grow most of the crop; Satkhira is earliest, and Rangpur has Haribhanga. Amrapali and BARI Aam-4 are grown in most districts.'],
fruitvars:['Feed as for the parent fruit. Grafted plants in drums need a little, often: compost every two months and a spoonful of mixed NPK monthly while growing.','Litchi: fruit borer and bats. Guava: fruit fly, so bag the fruit. Banana: Fusarium wilt and bunchy top, so plant clean material. Kul: fruit fly and powdery mildew.','Litchi is best around Dinajpur and Rajshahi; guava in Barishal and Chattogram; banana in Bogura, Narsingdi and the hills.'],
minorfruit:['Little is needed: a basket of compost each year before the rains is enough for a tree in the ground.','Generally trouble-free. Fruit bats and birds take ripe fruit, so net small trees.','Most grow in every district. Lotkon is a Narsingdi speciality, satkora and kau belong to Sylhet, and cashew to the hill tracts.'],
veg:['Mix compost through the bed or drum before planting, then side-dress with a little urea and potash every two to three weeks. DAE gives a dose for each crop.','Fruit and shoot borer in brinjal, fruit fly in gourds, aphids and whitefly on most crops. Use pheromone traps, pick pests off by hand, and rotate crops between seasons.','Winter vegetables grow everywhere. In saline coastal soil, grow on raised beds or in bags. Summer gourds need a strong macha.'],
herbs:['Light feeders: compost at planting and a weak liquid feed monthly. Too much fertiliser dulls the flavour.','Few pests. Leaf spot appears in crowded, wet beds; aphids come to coriander in late winter.','Ginger and turmeric are crops of the hills and the north; pan is grown most in Barishal, Khulna and Rajshahi.'],
hedges:['Compost each June and a nitrogen-rich feed after each clipping. Lawns: a light dressing of urea monthly in the rains.','Scale and mealybugs on palms and cycads. Lawn patches die from waterlogging or grubs.','All districts. Coconut, betel nut and palmyra do best near the coast.'],
indoor:['A half-strength liquid feed monthly from March to October, and none in winter. Flush the pot with plain water every few months to wash out salts.','Mealybugs, scale and spider mite, usually in dry indoor air. Wipe the leaves with soapy water and keep new plants apart for two weeks. Yellow leaves mean overwatering far more often than hunger.','Indoors anywhere. Keep them away from AC vents, and move them back from west windows in April and May.'],
tropicals:['A quarter-strength feed every two weeks while growing. Ferns and calatheas burn easily, so never feed dry soil.','Brown edges come from dry air or hard water, not disease. Spider mite on alocasia and calathea; scale on ferns and palms.','They enjoy the monsoon outdoors in shade. In the dry season, group the pots or stand them on wet pebbles.'],
pothos:['A half-strength liquid feed monthly in the growing season. Plants grown in water need a few drops of liquid feed with each change.','Root rot from wet soil is the main killer. Mealybugs hide in the leaf joints.','Indoors or on shaded verandas anywhere in the country.'],
philovine:['A half-strength liquid feed every two to three weeks while growing. Keep the pole damp so the aerial roots grip and feed.','Root rot from a heavy, wet mix; mealybugs, thrips and spider mite on new leaves.','Shaded verandas and bright rooms anywhere in the country.'],
philoself:['A half-strength liquid feed monthly in the growing season. Turn the pot every few weeks so the rosette stays even.','Root rot from overwatering; scale and mealybugs where the leaves join the stem.','Bright rooms, offices and shaded verandas anywhere in the country.'],
philorare:['Feed weakly and often: quarter strength every two weeks. Rare plants die of kindness more often than of neglect.','Root rot first, then thrips and spider mite. Check the undersides of new leaves every week.','They want humidity of 60% or more: a greenhouse corner, a cabinet, or a sheltered veranda in the rains.'],
monsteras:['A half-strength feed every two to three weeks while growing. A moss pole kept damp lets the aerial roots feed too.','Thrips scar new leaves silver; scale sits on the stems. Yellowing lower leaves in wet soil mean root rot.','Shaded verandas and bright rooms anywhere. Variegated types need more light and more care.'],
succulents:['Hardly any: a weak feed twice in the cool season. Rich soil makes them soft and prone to rot.','Rot in the monsoon is the main danger: keep them dry and under cover. Mealybugs at the roots and in the crown.','They prefer the drier north-west. In humid districts, give full sun, grit, and a rain shelter from June to September.']

trees:['রোপণের গর্তে এক ঝুড়ি গোবর, তারপর প্রথম তিন বছর প্রতি জুনে গোড়া ঘিরে কম্পোস্ট। বড় গাছে সার লাগে না।','ছোট গাছে খুঁটি ও বেড়া দিন, ছাগল ও ঝড় থেকে বাঁচান। কাণ্ডের ছিদ্রে কাঠের গুঁড়া দেখলে বুঝবেন মাজরা পোকা; শুকনো মাটিতে উইপোকা লাগে।','বর্ষার শুরুতে লাগান। ভেজা জমির জন্য হিজল, বরুণ ও জারুল; শুকনো, উঁচু জমির জন্য পলাশ, শিমুল ও সোনালু বেছে নিন।'],
water:['শাপলা-পদ্ম: গ্রীষ্মে প্রতি মাসে কাদায় একটি ধীরে গলা সারের ট্যাবলেট পুঁতে দিন। অর্কিড: শিকড় বাড়ার সময় সপ্তাহে একবার সিকি মাত্রার তরল সার।','শাপলার পাতার জাবপোকা পানির ধারায় ধুয়ে যায়। অর্কিডের মাথায় পানি জমলে পচে; আঁশ পোকা সাবান-পানিতে ভেজা তুলা দিয়ে মুছে ফেলুন।','অর্কিড আর্দ্র উত্তর-পূর্ব ও পার্বত্য জেলায় সবচেয়ে ভালো হয়। অন্যত্র ৫০% ছায়া-জাল দিন, শুকনো মৌসুমে স্প্রে করুন।'],
wild:['লাগে না: এরা অনুর্বর মাটিতেই বাঁচে।','তেমন সমস্যা হয় না। কয়েকটি প্রজাপতি ও মৌমাছির খাবার জোগায়, তাই এদের গায়ে স্প্রে করবেন না।','সারা দেশে রাস্তার ধারে, খেতের আইলে ও নদীর পাড়ে দেখা যায়। কাশ চর ও নদীর দ্বীপের চিহ্ন।'],
fruit:['হাফ ড্রামের জন্য: বছরে দুবার, বর্ষার আগে ও ফল তোলার পর, ২ কেজি কম্পোস্ট আর এক মুঠো করে মিশ্র এনপিকে ও হাড়ের গুঁড়া। মাটির গাছে ফসল ও বয়স অনুযায়ী ডিএই-র মাত্রা মানুন।','মাছি পোকা ঠেকাতে ফল মুড়ে দিন বা ফেরোমন ফাঁদ ঝোলান। নতুন ডগায় ছাতরা পোকা, আঁশ পোকা ও পাতা সুড়ঙ্গকারী লাগে; আর্দ্র আবহাওয়ায় অ্যানথ্রাকনোজ ও কালো ছত্রাকে পাতায় দাগ পড়ে।','আম ও লিচু উত্তর-পশ্চিমে, আনারস ও লেবুজাতীয় ফল সিলেট ও চট্টগ্রামের পাহাড়ে, পেয়ারা বরিশালে, আর নারিকেল উপকূলে সবচেয়ে ভালো হয়।'],
mangoes:['বছরের সার দুই ভাগে দিন: ফল তোলার পর ও বর্ষার শেষে। মুকুল আসার তিন মাস আগে পানি বন্ধ করুন, গুটি ধরলে আবার দিন।','মুকুলের সময় আমের হপার প্রধান পোকা: কুঁড়ি ফোটার সময় ও গুটি মটরদানার মতো হলে দমন করুন। মাছি পোকা ঠেকাতে ফল মুড়ে দিন; কুয়াশায় অ্যানথ্রাকনোজে মুকুল কালো হয়।','রাজশাহী, চাঁপাইনবাবগঞ্জ ও নওগাঁয় সবচেয়ে বেশি আম হয়; সাতক্ষীরায় সবার আগে পাকে, রংপুরে হাঁড়িভাঙা। আম্রপালি ও বারি আম-৪ বেশির ভাগ জেলায় চাষ হয়।'],
fruitvars:['মূল ফলের মতোই সার দিন। ড্রামের কলমের গাছে অল্প অল্প করে বারবার: দুই মাস পরপর কম্পোস্ট, বাড়ন্ত সময়ে মাসে এক চামচ মিশ্র এনপিকে।','লিচু: ফল ছিদ্রকারী পোকা ও বাদুড়। পেয়ারা: মাছি পোকা, তাই ফল মুড়ে দিন। কলা: ফিউজেরিয়াম ও গুচ্ছমাথা রোগ, তাই রোগমুক্ত চারা লাগান। কুল: মাছি পোকা ও সাদা গুঁড়া রোগ।','লিচু দিনাজপুর ও রাজশাহী এলাকায়, পেয়ারা বরিশাল ও চট্টগ্রামে, কলা বগুড়া, নরসিংদী ও পাহাড়ে সবচেয়ে ভালো হয়।'],
minorfruit:['খুব কম লাগে: মাটির গাছে প্রতি বছর বর্ষার আগে এক ঝুড়ি কম্পোস্টই যথেষ্ট।','সাধারণত সমস্যা হয় না। পাকা ফল বাদুড় ও পাখি খায়, তাই ছোট গাছে জাল দিন।','বেশির ভাগই সব জেলায় হয়। লটকন নরসিংদীর বিশেষ ফল, সাতকরা ও কাউ সিলেটের, কাজুবাদাম পার্বত্য এলাকার।'],
veg:['রোপণের আগে বেড বা ড্রামে কম্পোস্ট মেশান, তারপর দুই-তিন সপ্তাহ পরপর অল্প ইউরিয়া ও পটাশ উপরি দিন। প্রতিটি ফসলের মাত্রা ডিএই-র কাছে পাবেন।','বেগুনে ডগা ও ফল ছিদ্রকারী পোকা, লাউজাতীয় সবজিতে মাছি পোকা, প্রায় সব ফসলে জাবপোকা ও সাদা মাছি। ফেরোমন ফাঁদ দিন, হাতে পোকা বেছে ফেলুন, মৌসুমে মৌসুমে ফসল বদলান।','শীতের সবজি সব জায়গায় হয়। লবণাক্ত উপকূলীয় মাটিতে উঁচু বেড বা বস্তায় চাষ করুন। গ্রীষ্মের লাউজাতীয় সবজির জন্য শক্ত মাচা লাগে।'],
herbs:['কম সার লাগে: রোপণের সময় কম্পোস্ট আর মাসে একবার হালকা তরল সার। বেশি সারে স্বাদ-গন্ধ কমে যায়।','পোকা কম। ঘন, ভেজা বেডে পাতার দাগ রোগ হয়; শীতের শেষে ধনেপাতায় জাবপোকা আসে।','আদা ও হলুদ পাহাড় ও উত্তরাঞ্চলের ফসল; পান সবচেয়ে বেশি হয় বরিশাল, খুলনা ও রাজশাহীতে।'],
hedges:['প্রতি জুনে কম্পোস্ট, আর প্রতিবার ছাঁটার পর নাইট্রোজেনসমৃদ্ধ সার। লনে বর্ষায় মাসে একবার হালকা ইউরিয়া।','পাম ও সাইকাসে আঁশ পোকা ও ছাতরা পোকা। জলাবদ্ধতা বা মাটির পোকায় লনের ঘাস জায়গায় জায়গায় মরে যায়।','সব জেলায় হয়। নারিকেল, সুপারি ও তাল উপকূলের কাছে সবচেয়ে ভালো হয়।'],
indoor:['মার্চ থেকে অক্টোবর মাসে একবার অর্ধেক মাত্রার তরল সার, শীতে নয়। কয়েক মাস পরপর শুধু পানি ঢেলে টবের লবণ ধুয়ে ফেলুন।','ছাতরা পোকা, আঁশ পোকা ও মাকড়, সাধারণত ঘরের শুকনো বাতাসে। সাবান-পানি দিয়ে পাতা মুছুন, নতুন গাছ দুই সপ্তাহ আলাদা রাখুন। পাতা হলুদ হয় সারের অভাবে যত না, তার চেয়ে অনেক বেশি হয় অতিরিক্ত পানিতে।','যেকোনো জায়গায় ঘরের ভেতরে। এসির হাওয়া থেকে দূরে রাখুন, এপ্রিল-মে মাসে পশ্চিমের জানালা থেকে সরিয়ে নিন।'],
tropicals:['বাড়ন্ত সময়ে দুই সপ্তাহ পরপর সিকি মাত্রার সার। ফার্ন ও ক্যালাথিয়া সহজে পুড়ে যায়, তাই শুকনো মাটিতে কখনো সার দেবেন না।','পাতার কিনারা বাদামি হয় শুকনো বাতাস বা খর পানিতে, রোগে নয়। অ্যালোকেশিয়া ও ক্যালাথিয়ায় মাকড়; ফার্ন ও পামে আঁশ পোকা।','বর্ষায় বাইরে ছায়ায় ভালো থাকে। শুকনো মৌসুমে টবগুলো একসঙ্গে রাখুন বা ভেজা নুড়ির ওপর বসান।'],
pothos:['বাড়ন্ত মৌসুমে মাসে একবার অর্ধেক মাত্রার তরল সার। পানিতে রাখা গাছে প্রতিবার পানি বদলের সময় কয়েক ফোঁটা তরল সার দিন।','ভেজা মাটিতে শিকড় পচাই মৃত্যুর প্রধান কারণ। পাতার গোড়ায় ছাতরা পোকা লুকিয়ে থাকে।','দেশের যেকোনো জায়গায় ঘরের ভেতরে বা ছায়াঘেরা বারান্দায়।'],
philovine:['বাড়ন্ত সময়ে দুই-তিন সপ্তাহ পরপর অর্ধেক মাত্রার তরল সার। খুঁটি ভেজা রাখুন, যেন বায়বীয় শিকড় আঁকড়ে ধরে খাবার নিতে পারে।','ভারী, ভেজা মাটিতে শিকড় পচে; নতুন পাতায় ছাতরা পোকা, থ্রিপস ও মাকড়।','দেশের যেকোনো জায়গায় ছায়াঘেরা বারান্দা ও উজ্জ্বল ঘরে।'],
philoself:['বাড়ন্ত মৌসুমে মাসে একবার অর্ধেক মাত্রার তরল সার। কয়েক সপ্তাহ পরপর টব ঘুরিয়ে দিন, যেন গাছ সমানভাবে বাড়ে।','বেশি পানিতে শিকড় পচে; পাতা ও কাণ্ডের সংযোগে আঁশ পোকা ও ছাতরা পোকা।','দেশের যেকোনো জায়গায় উজ্জ্বল ঘর, অফিস ও ছায়াঘেরা বারান্দায়।'],
philorare:['হালকা সার বারবার দিন: দুই সপ্তাহ পরপর সিকি মাত্রা। দুর্লভ গাছ অযত্নে যত না মরে, অতি যত্নে মরে তার চেয়ে বেশি।','প্রথমে শিকড় পচা, তারপর থ্রিপস ও মাকড়। প্রতি সপ্তাহে নতুন পাতার নিচের দিক দেখুন।','৬০% বা তার বেশি আর্দ্রতা চাই: গ্রিনহাউসের কোণ, কাচের আলমারি, বা বর্ষায় আড়াল করা বারান্দা।'],
monsteras:['বাড়ন্ত সময়ে দুই-তিন সপ্তাহ পরপর অর্ধেক মাত্রার সার। মস পোল ভেজা রাখলে বায়বীয় শিকড়ও খাবার নিতে পারে।','থ্রিপসে নতুন পাতায় রুপালি দাগ পড়ে; কাণ্ডে আঁশ পোকা বসে। ভেজা মাটিতে নিচের পাতা হলুদ হলে বুঝবেন শিকড় পচছে।','যেকোনো জায়গায় ছায়াঘেরা বারান্দা ও উজ্জ্বল ঘরে। ভ্যারিগেটেড জাতে বেশি আলো ও বেশি যত্ন লাগে।'],
succulents:['প্রায় লাগেই না: শীতের মৌসুমে দুবার হালকা সার। উর্বর মাটিতে এরা নরম হয়ে সহজে পচে।','বর্ষায় পচাই প্রধান বিপদ: শুকনো ও ঢাকা জায়গায় রাখুন। শিকড়ে ও মাথায় ছাতরা পোকা লাগে।','শুকনো উত্তর-পশ্চিম এদের পছন্দ। আর্দ্র জেলায় পুরো রোদ, কাঁকর মেশানো মাটি, আর জুন থেকে সেপ্টেম্বর বৃষ্টির আড়াল দিন।']
};

  else{const m=P.season.match(/(?:fruit(?: ripens)?|harvest|nuts|pods ripen|ripe fruit)\s+([A-Z][a-z]+)\s*(?:–|to)\s*([A-Z][a-z]+)/);
    if(m){const a=M3[m[1].slice(0,3).toLowerCase()],b=M3[m[2].slice(0,3).toLowerCase()];if(a&&b)P.fm=months(a+'-'+b)}}});
const FAV=new Set();try{(JSON.parse(store.get('bgb.fav')||'[]')||[]).forEach(id=>{if(BYID[id])FAV.add(id)})}catch(e){}

/* photographs: only for pages that are a plain species, never a named variety */
