/* ================= PAGES ================= */
const meter=(v,what)=>`<span class="m" data-v="${v}" role="img" aria-label="${what} ${v}/3"><i></i><i></i><i></i></span>`;
const ico=n=>`<svg aria-hidden="true"><use href="#i-${n}"/></svg>`;
const hd=(left,i,extra)=>`<div class="hd"><span class="cat">${left}</span><span class="fol">${extra||''}${num(i+1)}</span></div>`;
const go=(label,page)=>`<button type="button" class="go" data-go="${page}"><span>${esc(label)}</span><i>${num(page+1)}</i></button>`;
function calendar(ms,kind,season,sow){
  {const lab=t('k'+kind),suf=BN()?(kind==='f'?' ফুল':kind==='h'?' সংগ্রহ':''):'';
   if(season.toLowerCase().startsWith(lab.toLowerCase()+' ')){season=season.slice(lab.length+1);season=season[0].toUpperCase()+season.slice(1)}
   else if(suf&&season.endsWith(suf))season=season.slice(0,-suf.length)}
  const mo=MLET[LANG].map((m,i)=>`<span class="${ms.has(i+1)?'on':''}${i===NOW?' now':''}">${m}${sow?`<u${sow.ms.has(i+1)?' class="on"':''}></u>`:''}<i></i></span>`).join('');
  const ri=RITU.map(([n,a,b])=>`<span lang="bn" style="left:${f(a/12*100)}%;width:${f((b-a)/12*100)}%">${n}</span>`).join('');
  return `<div class="cal"><div class="cl"><b>${t('k'+kind)}</b><span>${esc(season)}</span>${sow?`<em class="sk"><u></u>${t(sow.k==='s'?'sow':'plant')}</em>`:''}</div><div class="mo" aria-hidden="true">${mo}</div><div class="ritu" aria-hidden="true">${ri}</div></div>`;
}
function plantPage(P){const c=P.cat,fob=FOB.has(P.id)&&typeof P.src!=='number',sk=fob?'fob':typeof P.src==='number'?'dae':P.src==='bd'?'bd':'bari',badge=P.src||fob?`<b class="src" title="${t(sk+'T')}">${t(sk)}</b>`:'';
  return `<div class="sheet plant" style="--c:${c.c};--k:${c.k};--n:${CATS.length}"><i class="tab"></i>
  ${hd(`<i class="dot"></i>${esc(cName(c))}${BN()?'':` <span lang="bn">${c.bn}</span>`}`,P.page,badge+(canPhoto(P)?`<button type="button" class="ib pho" data-photo="${P.id}" aria-pressed="${PHON.has(P.id)}" aria-label="${t('photo')}" title="${t('photo')}">${ico('cam')}</button>`:'')+`<button type="button" class="ib" data-info="${P.id}" aria-label="${t('more')}" title="${t('more')}">${ico('info')}</button><button type="button" class="ib fav" data-fav="${P.id}" aria-pressed="${FAV.has(P.id)}" aria-label="${t('fav')}" title="${t('fav')}">${ico('heart')}</button>`)}
  <div class="art" data-pid="${P.id}"></div>
  <div class="nm"><h2>${esc(pName(P))}</h2><span class="alt" lang="${altLang()}">${esc(pAlt(P))}</span></div>
  <p class="sci" lang="en">${P.common&&P.common!==P.en?esc(P.common)+' · ':''}<i>${esc(P.sci)}</i></p>
  <dl class="needs">
   <div class="n"><dt>${ico('sun')}${t('light')}${meter(P.L,t('light'))}</dt><dd>${esc(ph(P.lt))}</dd></div>
   <div class="n"><dt>${ico('hum')}${t('hum')}${meter(P.H,t('hum'))}</dt><dd>${esc(ph(P.ht))}</dd></div>
   <div class="n"><dt>${ico('clock')}${t('water')}${meter(P.W,t('water'))}</dt><dd>${esc(ph(P.wf))}</dd></div>
   <div class="n"><dt>${ico('drop')}${t('much')}</dt><dd>${esc(ph(P.wa))}</dd></div>
   <div class="n wide"><dt>${ico('soil')}${t('soil')}</dt><dd>${esc(ph(P.soil))}</dd></div>
  </dl>
  ${calendar(P.ms,P.kind,pSeason(P),P.sow)}
  <p class="tip"><b>${t('tip')}</b> ${esc(pTip(P))}</p></div>`;
}
function sectionPage(c){
  return `<div class="sheet sec" style="--c:${c.c};--on:${c.on};--k:${c.k}">
  ${hd(t('nplants')(c.p.length),c.page)}
  <div class="art" data-pid="${c.p[0].id}"></div>
  <h2 lang="bn">${c.bn}</h2><h3>${esc(BN()?c.en:c.en)}</h3><p>${esc(cIntro(c))}</p>
  <div class="g${c.p.length>24?' g3':''}${c.p.length>30?' gs':''}">${c.p.map(P=>go(pName(P),P.page)).join('')}</div></div>`;
}
const tocBlock=c=>`<section style="--c:${c.c}"><h3><i class="dot"></i>${esc(cName(c))}${BN()?'':` <span lang="bn">${c.bn}</span>`}</h3><div class="g">${c.p.map(P=>go(pName(P),P.page)).join('')}</div></section>`;
const bars=`<div class="bars">${CATS.map(c=>`<i style="--c:${c.c}"></i>`).join('')}</div>`;
const COVERART=wreath();
function buildPages(){
  const g=t('guide'),y=t('year'),b=t('basics'),s=t('src'),cr=t('care'),mo=t('month'),lg=(k,arr,name)=>`<div class="lg"><b>${name}</b><ul>${arr.map((x,i)=>`<li>${meter(i+1,name)}${x}</li>`).join('')}</ul></div>`;
  const pages=[
   `<div class="sheet cover">${bars}<p class="eyebrow">${t('eyebrow')}</p>${COVERART}
    <h1 lang="bn">বাগান</h1><p class="sub">${t('sub')}</p>
    <div class="foot"><span>${t('foot')(PL.length,CATS.length)}</span><button type="button" class="open" data-go="1">${t('open')} ${ico('next')}</button></div></div>`,
   `<div class="sheet fm">${hd(g.hd,1)}<h2><small>${g.small}</small>${g.title}</h2><p>${g.p1}</p>
    ${lg('l',g.light,t('light'))}${lg('h',g.hum,t('hum'))}${lg('w',g.wat,t('water'))}
    <div style="--c:var(--accent)">${calendar(months('3-6'),'f',g.sample,{ms:months('10-11'),k:'s'})}</div>
    <p>${g.p2(NOW)}</p><p>${g.p3}</p></div>`,
   `<div class="sheet fm">${hd(y.hd,2)}<h2><small lang="bn">ষড়ঋতু</small>${y.title}</h2>
    <ul class="rows">${y.rows.map(r=>`<li><div class="k"><b lang="bn">${r[0]}</b><span>${r[1]}</span></div><div>${r[2]}</div></li>`).join('')}</ul></div>`,
   `<div class="sheet fm">${hd(b.hd,3)}<h2><small lang="bn">${b.small}</small>${b.title}</h2>
    <ul class="rows plain">${b.rows.map(r=>`<li><div class="k"><b>${r[0]}</b></div><div>${r[1]}</div></li>`).join('')}</ul></div>`,
   `<div class="sheet fm">${hd(s.hd,4)}<h2><small>${s.small}</small>${s.title}</h2>
    <ul class="rows plain tight">${s.rows(NSRC).map(r=>`<li><div class="k"><b>${r[0]}</b></div><div>${r[1]}</div></li>`).join('')}</ul></div>`
  ];
  TOC.forEach((cs,i)=>pages.push(`<div class="sheet fm">${hd(t('contents'),FRONT+i)}${i?'':`<h2 class="th">${t('contents')}</h2>`}<div class="toc">${cs.map(tocBlock).join('')}</div></div>`));
  CATS.forEach(c=>{pages.push(sectionPage(c));c.p.forEach(P=>pages.push(plantPage(P)))});
  pages.push(`<div class="sheet fm">${hd(cr.hd,CAREP)}<h2><small>${cr.small}</small>${cr.title}</h2><p>${cr.p}</p>
    <div class="care">${CARE.map(([id,tx])=>{const P=BYID[id];return `<button type="button" class="go" data-go="${P.page}"><span><b>${esc(pName(P))}</b> ${esc(BN()?(BNCARE[id]||tx):tx)}</span><i>${num(P.page+1)}</i></button>`}).join('')}</div></div>`);
  if(EXTRA>=0){const inb=PL.filter(P=>P.kind==='f'&&P.ms.has(NOW+1));
    pages.push(`<div class="sheet fm">${hd(mo.hd,EXTRA)}<h2><small>${mo.small(inb.length)}</small>${mo.title(NOW)}</h2><div class="toc"><section><div class="g">${inb.slice(0,42).map(P=>go(pName(P),P.page)).join('')}</div></section></div>${inb.length>42?`<p>${mo.more(inb.length-42)}</p>`:''}</div>`)}
  pages.push(`<div class="sheet cover back">${bars}<p class="eyebrow">${t('backEyebrow')}</p><h1 lang="bn">শুভ বাগান</h1>
    <p>${t('backP')}</p>
    <div class="foot"><span>${t('nplants')(PL.length)}</span><button type="button" class="open" data-go="0">${t('backBtn')}</button></div></div>`);
  return pages;
}

const $=s=>document.querySelector(s);
const book=$('#book'),area=$('#area'),rngEl=$('#rng'),lbl=$('#lbl');
book.innerHTML=buildPages().map((h,i)=>`<div class="page"${i===0||i===N-1?' data-density="hard"':''}>${h}</div>`).join('');
const PG=[...book.children];
rngEl.max=N-1;
document.querySelector('.strip').innerHTML=CATS.map(c=>`<i style="--c:${c.c}"></i>`).join('');

/* drawings are built only for pages near the open spread */
const photoHTML=id=>`<img class="phimg" src="${esc(PH[id].src)}" alt="${esc(BYID[id].en)}" data-ph="${id}"><a class="cred" href="${esc(PH[id].page)}" target="_blank" rel="noopener">${t('credit')}</a>`;
function drawArt(el){const id=el.dataset.pid;el.innerHTML=(el.closest('.plant')&&PHON.has(id)&&PH[id])?photoHTML(id):plate(BYID[id])}
function fillArt(i){const pg=PG[i];if(!pg||!META[i].art)return;pg.querySelectorAll('.art[data-pid]').forEach(el=>{if(!el.firstChild)drawArt(el)})}
function photoOff(id,btn,dead){PHON.delete(id);if(dead){PH[id]=null;btn.disabled=true;btn.title=t('noPhoto')}btn.setAttribute('aria-pressed','false');const el=btn.closest('.sheet').querySelector('.art');if(el)drawArt(el)}
function togglePhoto(btn,auto){const id=btn.dataset.photo,P=BYID[id],el=btn.closest('.sheet').querySelector('.art');
  if(!auto){autoPhoto=!PHON.has(id);store.set('bgb.photo',autoPhoto?'1':'0')}
  if(PHON.has(id)){photoOff(id,btn);return}
  const show=()=>{PHON.add(id);btn.setAttribute('aria-pressed','true');drawArt(el)};
  if(PH[id]){show();return}if(PH[id]===null)return;
  btn.classList.add('busy');
  fetch(WIKI+encodeURIComponent(P.sci.replace(/ /g,'_'))+'?redirect=true').then(r=>r.ok?r.json():Promise.reject()).then(j=>{
    btn.classList.remove('busy');
    if(j.type!=='standard'||!j.thumbnail||!j.thumbnail.source)return photoOff(id,btn,true);
    PH[id]={src:j.thumbnail.source,page:(j.content_urls&&j.content_urls.desktop&&j.content_urls.desktop.page)||'https://en.wikipedia.org/wiki/'+encodeURIComponent(P.sci.replace(/ /g,'_'))};show()
  }).catch(()=>{btn.classList.remove('busy');photoOff(id,btn,true)})}
function artWindow(i){for(let k=0;k<N;k++){if(!META[k].art)continue;if(k>=i-3&&k<=i+4)fillArt(k);else PG[k].querySelectorAll('.art[data-pid]').forEach(el=>{if(el.firstChild)el.textContent=''})}}

/* ================= VIEWER ================= */
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let pf,ready=false,snd=store.get('bgb.snd')==='1',wind=store.get('bgb.wind')!=='0',plain=store.get('bgb.plain')==='1';

function shim(start){ // plain page switcher, used only if the flip library did not load
  const H={},set={minWidth:1};let i=start,land=true;
  const norm=k=>(!land||k===0)?k:(k%2?k:k-1);
  const draw=()=>{i=norm(Math.max(0,Math.min(N-1,i)));PG.forEach(p=>{p.style.cssText='';p.classList.remove('--left','--right')});
    (land&&i>0&&i<N-1?[i,i+1]:[i]).forEach(k=>{const right=!land||k%2===0;PG[k].style.cssText=`display:block;top:0;height:100%;width:${land?50:100}%;left:${land&&right?50:0}%`;PG[k].classList.add(right?'--right':'--left')});
    (H.flip||[]).forEach(fn=>fn({data:i}))};
  return{on(e,fn){(H[e]=H[e]||[]).push(fn)},getSettings:()=>set,update(){land=set.minWidth<10;draw()},getCurrentPageIndex:()=>i,getOrientation:()=>land?'landscape':'portrait',
    flip(k){i=k;draw()},turnToPage(k){i=k;draw()},flipNext(){i=land?(i===0?1:i+2):i+1;draw()},flipPrev(){i=land?(i<=1?0:i-2):i-1;draw()}};
}
function fit(){
  const r=area.getBoundingClientRect();if(r.width<50||r.height<50)return;
  const land=r.width>=700&&r.width>r.height*1.12,ratio=500/800;
  const pw=Math.floor(Math.min(land?r.width/2:r.width,r.height*ratio)),ph2=Math.floor(pw/ratio);
  book.style.width=(land?pw*2:pw)+'px';book.style.height=ph2+'px';
  if(ready){pf.getSettings().minWidth=land?1:1e5;pf.update();place();sync()}
}
function place(){
  const i=pf.getCurrentPageIndex(),land=pf.getOrientation()==='landscape';
  book.classList.toggle('is-front',land&&i===0);book.classList.toggle('is-back',land&&i>=N-1);
}
function sync(){
  const i=pf.getCurrentPageIndex(),two=pf.getOrientation()==='landscape'&&i>0&&i<N-1;
  lbl.textContent=(two?`${num(i+1)}–${num(i+2)}`:num(i+1))+` / ${num(N)}`;rngEl.value=i;artWindow(i);
  const vis=two?[i,i+1]:[i],cat=(vis.map(k=>META[k]).find(m=>m.cat!=null)||{}).cat,pl=vis.map(k=>META[k]).find(m=>m.id);
  document.querySelectorAll('#cats .chip').forEach((b,k)=>{const on=k===cat;b.setAttribute('aria-current',on);if(on&&b.scrollIntoView)try{b.scrollIntoView({block:'nearest',inline:'nearest'})}catch(e){}});
  ['#sPrev','#bPrev'].forEach(s=>$(s).disabled=i===0);['#sNext','#bNext'].forEach(s=>$(s).disabled=i>=N-1);
  store.set('bgb.page',i);
  if(autoPhoto&&document.body.classList.contains('photos'))vis.forEach(k=>{const b=PG[k].querySelector('[data-photo]');if(b&&!PHON.has(b.dataset.photo)&&PH[b.dataset.photo]!==null&&!b.classList.contains('busy'))togglePhoto(b,true)});
  try{history.replaceState(null,'',pl?'#'+pl.id:location.pathname+location.search)}catch(e){}
}
function goTo(k){k=Math.max(0,Math.min(N-1,k));for(let j=k-2;j<=k+2;j++)fillArt(j);if(reduce||!window.St)pf.turnToPage(k);else pf.flip(k);if(reduce)sync();closeDrawer()}

let ac;
function swish(){
  if(!snd)return;
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const d=.3,n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),ch=b.getChannelData(0);
    for(let i=0;i<n;i++){const tt=i/n;ch[i]=(Math.random()*2-1)*Math.pow(Math.sin(Math.PI*tt),2)*(1-tt*.5)}
    const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;fl.type='bandpass';fl.Q.value=.8;
    fl.frequency.setValueAtTime(900,ac.currentTime);fl.frequency.exponentialRampToValueAtTime(3200,ac.currentTime+d);g.gain.value=.12;
    s.connect(fl);fl.connect(g);g.connect(ac.destination);s.start()}catch(e){}
}

/* ---------- text that changes with the language ---------- */
const drawer=$('#drawer'),scrim=$('#scrim'),qEl=$('#q'),list=$('#list');
const FILTERS=[['all','fAll',()=>true],['bloom','fBloom',P=>P.kind==='f'&&P.cat.sec!=='fr'&&P.ms.has(NOW+1)],['fruit','fFruit',P=>!!P.fm&&P.fm.has(NOW+1)],['fav','fFav',P=>FAV.has(P.id)],['shade','fShade',P=>P.L<3],['dry','fDry',P=>P.W===1],['dae','fDae',P=>typeof P.src==='number'],['bd','fBd',P=>P.src==='bd']];
let filt='all',sec='all';
function chrome(){
  document.body.classList.toggle('lang-bn',BN());document.documentElement.lang=LANG;
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t(el.dataset.t)});
  qEl.placeholder=t('search');$('#langLbl').textContent=t('other');$('#langLbl').lang=altLang();
  $('#cats').innerHTML=CATS.map(c=>`<button type="button" class="chip" style="--c:${c.c};--on:${c.on}" data-go="${c.page}" aria-current="false"><i></i>${esc(cShort(c))}</button>`).join('');
  $('#filters').innerHTML=FILTERS.map(([k,key])=>`<button type="button" class="chip" data-f="${k}" aria-pressed="${k===filt}">${typeof t(key)==='function'?t(key)(NOW):t(key)}</button>`).join('');
  $('#secs').innerHTML=['all','fl','fr','kg','hp'].map(k=>`<button type="button" class="chip" data-s="${k}" aria-pressed="${k===sec}">${t('secs')[k]}</button>`).join('');
}
function setLang(l){
  LANG=l;store.set('bgb.lang',l);const pages=buildPages();PG.forEach((p,i)=>{p.innerHTML=pages[i]});
  chrome();if(ready){artWindow(pf.getCurrentPageIndex());sync()}if(!drawer.hidden)render();
}
function render(){
  const s=qEl.value.trim().toLowerCase(),fn=FILTERS.find(x=>x[0]===filt)[2];let html='',count=0;
  CATS.forEach(c=>{if(sec!=='all'&&c.sec!==sec)return;const rows=c.p.filter(P=>fn(P)&&(!s||[P.en,P.bn,P.common,P.sci,c.en,c.bn].join(' ').toLowerCase().includes(s)));
    if(!rows.length)return;count+=rows.length;
    html+=`<h3 style="--c:${c.c}"><i></i>${esc(cName(c))}</h3>`+rows.map(P=>`<button type="button" class="row" data-go="${P.page}"><b>${esc(pName(P))}<span lang="${altLang()}">${esc(pAlt(P))}</span></b><small>${esc(ph(P.lt))} · ${esc(pSeason(P))}</small><em>${num(P.page+1)}</em></button>`).join('')});
  list.innerHTML=(count?`<p class="count">${t('count')(count)}</p>`+html:`<p class="empty">${t(filt==='fav'&&!FAV.size?'favEmpty':'empty')}</p>`);
}
function openDrawer(focus){render();drawer.hidden=false;scrim.hidden=false;if(focus)qEl.focus()}
function closeDrawer(){drawer.hidden=true;scrim.hidden=true;const n=document.querySelector('#info');if(n)n.hidden=true}

function start(saved){
  let st=0;const h=(location.hash||'').slice(1);
  if(BYID[h])st=BYID[h].page;else if(saved&&saved.page!=null)st=saved.page;else st=+(store.get('bgb.page')||0)||0;
  st=Math.max(0,Math.min(N-1,st));
  fit();artWindow(st);
  if(window.St&&St.PageFlip&&!plain){
    pf=new St.PageFlip(book,{width:500,height:800,size:'stretch',minWidth:1,maxWidth:3000,minHeight:1,maxHeight:5000,autoSize:false,showCover:true,usePortrait:true,
      mobileScrollSupport:false,showPageCorners:false,maxShadowOpacity:.45,flippingTime:reduce?260:850,startPage:st});
    pf.loadFromHTML(PG);
    book.style.minWidth='0';book.style.minHeight='0';
  }else{pf=shim(st);book.classList.add('plain'); // plain reading: no fold animation, swipe or tap the arrows
    let sx=0,sy=0;book.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
    book.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.5)dx<0?pf.flipNext():pf.flipPrev()},{passive:true})}
  pf.on('flip',()=>{place();sync()});
  pf.on('changeOrientation',()=>{place();sync()});
  pf.on('changeState',e=>{const busy=e.data!=='read';book.classList.toggle('turning',busy);
    if(e.data==='flipping'){book.classList.remove('is-front','is-back');swish()}else if(!busy)place()});
  ready=true;fit();
  if(pf.getOrientation()!=='landscape'&&pf.getCurrentPageIndex()!==st){pf.turnToPage(st);place();sync()} // a phone opens on the exact page, not its spread partner
  if(window.ResizeObserver)new ResizeObserver(fit).observe(area);else addEventListener('resize',fit);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
}

/* ---------- controls ---------- */
chrome();
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){goTo(+b.dataset.go);return}
  const fv=e.target.closest('[data-fav]');if(fv){const id=fv.dataset.fav,on=!FAV.has(id);on?FAV.add(id):FAV.delete(id);saveFav();fv.setAttribute('aria-pressed',on);if(!drawer.hidden)render();return}
  const ph=e.target.closest('[data-photo]');if(ph){togglePhoto(ph);return}
  const nf=e.target.closest('[data-info]');if(nf)openInfo(nf.dataset.info)});
const info=$('#info');
function srcNote(P){const L=[],a=(u,k)=>` <a href="${u}" target="_blank" rel="noopener">${t(k||'sOpen')}</a>`;
  if(typeof P.src==='number')L.push(t('sDae')+a(U.daec+P.src));
  if(P.src==='bari')L.push(t('sBari'));
  if(FOB.has(P.id))L.push(t('sFob')+a(U.fobq+encodeURIComponent(P.sci.split(' ')[0])));
  if(P.cat.id==='mangoes'&&P.src!=='bari'&&typeof P.src!=='number')L.push(t('sMango')+a(U.mango));
  if(P.src==='bd'&&!FOB.has(P.id))L.push(t('sBd'));
  if(!L.length)L.push(t('sNone'));
  return`<section><h3>${ico('info')}${t('nSrc')}</h3>${L.map(x=>`<p>${x}</p>`).join('')}</section>`}
function openInfo(id){const P=BYID[id],c=P.cat,n=(BN()&&BNN[c.id])||NOTES[c.id];if(!n)return;
  $('#infoT').textContent=pName(P);$('#infoS').textContent=t('nNote')(cName(c));
  $('#infoB').innerHTML=[['nFeed','drop'],['nPest','x'],['nWhere','sun']].map(([k,ic],i)=>`<section><h3>${ico(k==='nPest'?'bug':k==='nWhere'?'pin':'feed')}${t(k)}</h3><p>${esc(n[i])}</p></section>`).join('')+srcNote(P);
  info.style.setProperty('--c',c.c);info.hidden=false;scrim.hidden=false}
function closeInfo(){info.hidden=true;if(drawer.hidden)scrim.hidden=true}
$('#iClose').onclick=closeInfo;
book.addEventListener('error',e=>{const im=e.target;if(im&&im.dataset&&im.dataset.ph){const b=book.querySelector('[data-photo="'+im.dataset.ph+'"]');if(b)photoOff(im.dataset.ph,b,true)}},true);
/* photo buttons appear only if this page is allowed to reach Wikipedia */
try{fetch(WIKI+'Mangifera_indica').then(r=>{if(r.ok){document.body.classList.add('photos');if(ready)sync()}}).catch(()=>{})}catch(e){}
$('#secs').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;sec=b.dataset.s;document.querySelectorAll('#secs .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
$('#sPrev').onclick=$('#bPrev').onclick=()=>pf.flipPrev();
$('#sNext').onclick=$('#bNext').onclick=()=>pf.flipNext();
rngEl.addEventListener('input',()=>{pf.turnToPage(+rngEl.value);place();sync()});
$('#bLang').onclick=()=>setLang(BN()?'en':'bn');
const bSnd=$('#bSnd');bSnd.setAttribute('aria-pressed',snd);
bSnd.onclick=()=>{snd=!snd;bSnd.setAttribute('aria-pressed',snd);store.set('bgb.snd',snd?'1':'0');swish()};
const bWind=$('#bWind'),setWind=()=>{bWind.setAttribute('aria-pressed',wind);document.body.classList.toggle('calm',!wind)};setWind();
bWind.onclick=()=>{wind=!wind;store.set('bgb.wind',wind?'1':'0');setWind()};
const bPlain=$('#bPlain');bPlain.setAttribute('aria-pressed',!plain);
bPlain.onclick=()=>{store.set('bgb.plain',plain?'0':'1');try{location.reload()}catch(e){}};
const bFs=$('#bFs');if(!document.fullscreenEnabled)bFs.hidden=true;
bFs.onclick=()=>{try{(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{})}catch(e){}};
addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeDrawer();return}
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
  if(e.key==='ArrowRight'||e.key==='PageDown')pf.flipNext();
  else if(e.key==='ArrowLeft'||e.key==='PageUp')pf.flipPrev();
  else if(e.key==='Home')goTo(0);else if(e.key==='End')goTo(N-1);
});
$('#bFind').onclick=()=>openDrawer(true);
$('#bToc').onclick=()=>openDrawer(false);
$('#bClose').onclick=scrim.onclick=closeDrawer;
qEl.addEventListener('input',render);
$('#filters').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;filt=b.dataset.f;document.querySelectorAll('#filters .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});

const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)try{hot.snapshot(()=>({page:pf?pf.getCurrentPageIndex():0}))}catch(e){}
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});

})();
</script>
