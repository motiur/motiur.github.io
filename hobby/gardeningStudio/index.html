<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bangladesh Garden Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600&family=Tiro+Bangla:ital@0;1&display=swap">
<style>
/* Layout: a one-screen flip-book viewer. Title bar, category rail, a centred two-page book on a soft stage, control bar.
   Every page scales with the book: inside a page 1em = page width / 24. */
:root{
  --stage:#e1e8e0; --stage-2:#c6d3c8; --chrome:#f7f9f4; --line:#b9c7bb;
  --paper:#fbfcf7; --ink:#12261f; --ink-2:#4a5f56; --rule:#d5ddd0;
  --plate:#143a32; --on-plate:#eef5ec; --on-plate-2:#a9c4b8; --cover:#0d4636; --disc:#d7263d;
  --accent:#c4233a; --shadow:rgb(16 40 32/.34);
  --f-display:"Tiro Bangla","Noto Serif Bengali",Georgia,serif;
  --f-body:"Anek Bangla","Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --stage:#0c1714; --stage-2:#08100e; --chrome:#14211d; --line:#2c423b;
  --paper:#16241f; --ink:#e7efe8; --ink-2:#9db1a6; --rule:#2b413a;
  --plate:#1e4b41; --on-plate:#eef5ec; --on-plate-2:#a9c4b8; --cover:#0d4636; --disc:#d7263d;
  --accent:#ff6f83; --shadow:rgb(0 0 0/.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#0c1714; --stage-2:#08100e; --chrome:#14211d; --line:#2c423b;
  --paper:#16241f; --ink:#e7efe8; --ink-2:#9db1a6; --rule:#2b413a;
  --plate:#1e4b41; --on-plate:#eef5ec; --on-plate-2:#a9c4b8; --cover:#0d4636; --disc:#d7263d;
  --accent:#ff6f83; --shadow:rgb(0 0 0/.6); color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--stage-2);color:var(--ink);font:14px/1.4 var(--f-body);overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.defs{position:absolute;width:0;height:0;overflow:hidden}

.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;
  background:radial-gradient(120% 85% at 50% 42%,var(--stage),var(--stage-2))}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px 8px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;margin-right:auto}
.brand b{font:400 24px/1 var(--f-display)}
.brand span{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;min-width:40px;box-sizing:border-box;
  padding:0 10px;border:1px solid var(--line);background:var(--chrome);border-radius:10px;font-weight:500;cursor:pointer;flex:none}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{border-color:var(--ink-2)}
.btn:disabled{opacity:.38;cursor:default}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--chrome);border-color:var(--ink)}
.ico{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.cats{display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px 0 10px;border-radius:15px;flex:none;cursor:pointer;
  border:1px solid transparent;background:color-mix(in srgb,var(--chrome) 62%,transparent);font-size:13px;font-weight:500;color:var(--ink-2)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip:hover{color:var(--ink)}
.chip[aria-current="true"]{background:var(--chrome);color:var(--ink);border-color:var(--ink-2)}
@media (min-width:1080px){.cats{justify-content:center}}

.stage{position:relative;min-height:0;padding:6px 16px 10px}
.area{width:100%;height:100%;display:grid;place-items:center}
.side{position:absolute;top:50%;translate:0 -50%;width:44px;height:44px;border-radius:50%;padding:0;display:none}
.side.prev{left:12px}.side.next{right:12px}
@media (min-width:760px){.stage{padding-inline:68px}.side{display:inline-flex}}

.bar{display:flex;align-items:center;gap:6px;padding:0 16px 10px}
.slide{flex:1;min-width:0;display:grid;gap:0;justify-items:center;padding:0 6px}
.slide input{width:100%;margin:0;accent-color:var(--accent)}
.slide output{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar .lbl{display:none}
@media (min-width:760px){.bar{justify-content:center;gap:8px}.slide{max-width:420px}.bar .lbl,.top .lbl{display:inline}.bar .mob{display:none}}
@media (max-width:759px){.top .lbl{display:none}.bar .fs{display:none}}

/* ---------- book ---------- */
#book{position:relative;touch-action:none;transition:transform .5s ease;min-width:0;min-height:0}
#book::before{content:"";position:absolute;z-index:-1;inset:3% 1.5% -1.5% 1.5%;background:var(--shadow);filter:blur(20px);transition:inset .5s ease}
#book.is-front{transform:translateX(-25%)}
#book.is-back{transform:translateX(25%)}
#book.is-front::before{left:51.5%}
#book.is-back::before{right:51.5%}
.page{display:none;position:absolute;background:var(--paper);overflow:hidden;container-type:size;outline:1px solid rgb(0 0 0/.07);outline-offset:-1px}
.page::after{content:"";position:absolute;inset:0;pointer-events:none}
.page[class~="--right"]::after{background:linear-gradient(90deg,rgb(0 0 0/.2),rgb(0 0 0/.05) 3.5%,transparent 10%)}
.page[class~="--left"]::after{background:linear-gradient(270deg,rgb(0 0 0/.2),rgb(0 0 0/.05) 3.5%,transparent 10%)}
.page button{cursor:pointer}
.page button *{pointer-events:none}

.sheet{position:relative;height:100%;box-sizing:border-box;font-size:calc(100cqw / 24);line-height:1.3;
  padding:1.15em 1.4em 1.2em;display:flex;flex-direction:column;gap:.6em;color:var(--ink)}
.tab{position:absolute;right:0;top:calc(7% + var(--k) * 9.4%);width:.5em;height:7.4%;background:var(--c)}
.page[class~="--left"] .tab{right:auto;left:0}
.hd{display:flex;justify-content:space-between;align-items:center;gap:1em;font-size:.72em;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.hd .cat{display:flex;align-items:center;gap:.6em;min-width:0}
.hd [lang="bn"]{letter-spacing:0;font-size:1.12em}
.hd .fol{font-variant-numeric:tabular-nums}
.dot{width:.8em;height:.8em;border-radius:50%;background:var(--c);flex:none}
.art{flex:1 1 0;min-height:6.5em;display:flex}
.art svg{width:100%;height:100%}
.nm{display:flex;align-items:baseline;gap:.2em .7em;flex-wrap:wrap}
.nm h2{font:400 2em/1.08 var(--f-display);margin:0;text-wrap:balance}
.nm .bn{font:400 1.42em/1.2 var(--f-display);color:var(--ink-2)}
.sci{margin:-.3em 0 0;font-size:.86em;color:var(--ink-2)}
.needs{display:grid;grid-template-columns:1fr 1fr;gap:.55em .9em;margin:0;padding:.65em 0 0;border-top:1px solid var(--rule)}
.n{min-width:0}
.n.wide{grid-column:1/-1}
.n dt{display:flex;align-items:center;gap:.45em;font-size:.7em;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.n dt svg{width:1.4em;height:1.4em;flex:none}
.n dd{margin:.15em 0 0;font-size:.88em;line-height:1.28}
.m{display:inline-flex;gap:2px;margin-left:auto}
.m i{width:.95em;height:.45em;background:var(--rule);border-radius:1px}
.m[data-v="1"] i:nth-child(-n+1),.m[data-v="2"] i:nth-child(-n+2),.m[data-v="3"] i{background:var(--c)}
.cal{border-top:1px solid var(--rule);padding-top:.6em}
.cl{display:flex;gap:.7em;align-items:baseline;font-size:.86em;line-height:1.25}
.cl b{font-size:.81em;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:600;flex:none}
.mo{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:.55em;font-size:.68em;line-height:1.2;text-align:center;color:var(--ink-2)}
.mo span{position:relative;display:grid;gap:.25em}
.mo i{height:.78em;background:var(--rule);border-radius:1px}
.mo .on i{background:var(--c)}
.mo .now{color:var(--ink);font-weight:600}
.mo .now::before{content:"";position:absolute;left:50%;top:-.42em;translate:-50% 0;width:.36em;height:.36em;border-radius:50%;background:var(--accent)}
.ritu{position:relative;height:1.55em;margin-top:3px;font-size:.72em;line-height:1}
.ritu span{position:absolute;top:0;bottom:0;display:grid;place-items:center;box-sizing:border-box;border-left:1px solid var(--paper);
  background:color-mix(in srgb,var(--rule) 60%,transparent);color:var(--ink-2);white-space:nowrap;overflow:hidden}
.tip{margin:0;font-size:.82em;color:var(--ink-2);line-height:1.32}
.tip b{color:var(--ink);font-weight:600}

/* front matter */
.fm h2{font:400 1.9em/1.1 var(--f-display);margin:.2em 0 0;text-wrap:balance}
.fm h2 small{display:block;font:500 .42em/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:.5em}
.fm p{margin:0;font-size:.86em;color:var(--ink-2);max-width:60ch}
.fm p b,.fm li b{color:var(--ink);font-weight:600}
.lg{display:grid;grid-template-columns:5.2em 1fr;gap:.2em .8em;font-size:.84em;border-top:1px solid var(--rule);padding-top:.55em;--c:var(--ink)}
.lg b{font-size:.84em;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:600;padding-top:.1em}
.lg ul{list-style:none;margin:0;padding:0;display:grid;gap:.2em}
.lg li{display:flex;align-items:center;gap:.7em}
.lg .m{margin:0}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:.4em;flex:1;align-content:space-evenly}
.rows li{display:grid;grid-template-columns:7.4em 1fr;gap:.9em;border-top:1px solid var(--rule);padding-top:.45em;font-size:.84em;line-height:1.28;color:var(--ink-2)}
.rows .k{display:grid;align-content:start;gap:.15em}
.rows .k b{font:400 1.6em/1 var(--f-display);color:var(--ink)}
.rows .k span{font-size:.86em;letter-spacing:.04em}
.rows.plain li{grid-template-columns:6.4em 1fr}
.rows.plain .k b{font:600 .86em/1.25 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink)}
.toc{display:grid;gap:.75em;align-content:space-evenly;flex:1}
.toc section{--c:var(--ink)}
.toc h3{display:flex;align-items:center;gap:.55em;margin:0 0 .25em;font:600 .78em/1.3 var(--f-body);letter-spacing:.07em;text-transform:uppercase}
.toc h3 [lang="bn"]{font-weight:400;letter-spacing:0;color:var(--ink-2);text-transform:none;font-size:1.1em}
.toc .g{display:grid;grid-template-columns:1fr 1fr;gap:0 1.2em}
.go{display:flex;align-items:baseline;gap:.4em;width:100%;padding:.16em 0;border:0;background:none;text-align:left;font-size:.84em;line-height:1.3;border-bottom:1px dotted var(--rule)}
.go span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go i{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:.92em}
.go:hover span{text-decoration:underline}

/* dark-ground pages: cover, back, section openers */
.onplate{background:var(--plate);color:var(--on-plate)}
.onplate .hd,.onplate p{color:var(--on-plate-2)}
.sec .art{flex:0 0 9.5em;min-height:0}
.sec h2{font:400 3.3em/1 var(--f-display);margin:0}
.sec h3{font:500 1em/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;margin:0;display:flex;align-items:center;gap:.6em}
.sec p{margin:0;font-size:.9em;max-width:34ch}
.sec .g{display:grid;grid-template-columns:1fr 1fr;gap:0 1.2em;margin-top:auto;border-top:1px solid rgb(255 255 255/.22);padding-top:.5em}
.sec .go{border-bottom-color:rgb(255 255 255/.22);color:var(--on-plate)}
.sec .go i{color:var(--on-plate-2)}
.cover{background:var(--cover);color:var(--on-plate);padding:1.6em 1.7em;gap:0}
.cover .eyebrow{font-size:.74em;letter-spacing:.14em;text-transform:uppercase;color:var(--on-plate-2);margin:0}
.cover .sun{width:15.5em;height:15.5em;margin:1.6em 0 0 -.4em;flex:none}
.cover h1{font:400 5.6em/1 var(--f-display);margin:auto 0 0}
.cover .sub{font:400 1.42em/1.2 var(--f-display);margin:.35em 0 0}
.cover .foot{display:flex;justify-content:space-between;align-items:center;gap:1em;margin-top:1.5em;padding-top:.8em;border-top:1px solid rgb(255 255 255/.25);font-size:.8em;color:var(--on-plate-2)}
.cover .open{display:inline-flex;align-items:center;gap:.5em;border:1px solid rgb(255 255 255/.45);background:none;color:var(--on-plate);border-radius:2em;padding:.45em 1em;font-weight:500}
.cover.back h1{font-size:3em;margin:auto 0 0}
.cover.back p{font-size:.84em;color:var(--on-plate-2);margin:.9em 0 0;max-width:38ch}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.42);z-index:20}
.drawer{position:fixed;z-index:21;top:0;right:0;bottom:0;width:min(400px,100%);box-sizing:border-box;background:var(--chrome);
  display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:10px;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:-12px 0 40px rgb(0 0 0/.25)}
.drawer header{display:flex;align-items:center;justify-content:space-between}
.drawer h2{font:400 22px/1.1 var(--f-display);margin:0}
.drawer input[type="search"]{width:100%;box-sizing:border-box;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:16px var(--f-body)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters .chip{background:var(--paper);border-color:var(--line)}
.filters .chip[aria-pressed="true"]{background:var(--ink);color:var(--chrome);border-color:var(--ink)}
.list{overflow-y:auto;margin:0 -16px;padding:0 16px}
.list h3{position:sticky;top:0;background:var(--chrome);margin:0;padding:10px 0 6px;font:600 11px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.list h3 i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;padding:8px 0;border:0;border-top:1px solid var(--rule);background:none;text-align:left;cursor:pointer}
.row b{font-weight:500;font-size:15px}
.row b span{font:400 15px var(--f-display);color:var(--ink-2);margin-left:8px}
.row small{grid-column:1;color:var(--ink-2);font-size:12.5px}
.row em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:13px}
.row:hover b{text-decoration:underline}
.empty{color:var(--ink-2);padding:18px 0;margin:0}
@media (prefers-reduced-motion:reduce){#book,#book::before{transition:none}}
</style>

 intro:'Woody plants that flower for years in a 12-inch pot or a half-drum. Most want full sun and one hard prune a year.',p:[

['golap','Golap','গোলাপ','Rose','Rosa × hybrida',3,'Full sun, 6 hours',2,'Moderate; needs moving air',2,'Daily in summer; alternate days in winter','0.5–1 L per 12-inch pot, at the base','Clay-loam with plenty of compost, pH 6–6.5','f','11-3','Best November to March','Hard-prune in mid-October, then feed. Keep leaves dry to avoid black spot.',['bloom',{n:6,rings:3,c:'#e23a6e',pw:1.05,cr:.12,c2:'#a81c49'}]],
['rongon','Rongon','রঙ্গন','Ixora','Ixora coccinea',3,'Full sun to light shade',3,'High',2,'Every 1–2 days; never bone dry','0.5 L per 10-inch pot','Acidic sandy loam with leaf mould','f','4-10','April to October, peak in the monsoon','Yellow leaves mean the soil has turned alkaline. Add compost and avoid lime.',['cluster',{m:26,fr:8,n:4,c:'#e5322d',c2:'#ffb347'}]],
['baganbilash','Baganbilash','বাগানবিলাস','Bougainvillea','Bougainvillea glabra',3,'Full sun all day',1,'Low to moderate',1,'Twice a week in summer; weekly in winter','Let the pot dry between waterings','Sandy loam with sharp drainage','f','11-5','November to May, the dry months','A little water stress triggers flowering. Too much water gives leaves and no colour.',['cluster',{m:15,fr:13,n:3,pt:1,pw:.62,c:'#d6247f',c2:'#fff4d6',cr:.14}]],
['gandharaj','Gandharaj','গন্ধরাজ','Cape jasmine','Gardenia jasminoides',2,'Morning sun, afternoon shade',3,'High',3,'Daily in summer; keep evenly moist','0.5–1 L per 12-inch pot','Acidic loam rich in organic matter','f','3-6','March to June','Buds drop if the pot dries out or is moved while in bud.',['bloom',{n:7,rings:2,c:'#fbf9ef',pw:.95,cr:.1,c2:'#efe2a0'}]],
['kamini','Kamini','কামিনী','Orange jasmine','Murraya paniculata',3,'Full sun to part shade',2,'Moderate to high',2,'Every 2–3 days','1 L per 12-inch pot','Well-drained loam','f','4-9','Several flushes, April to September','Each flush follows rain. Clip after flowering to keep a dense hedge shape.',['cluster',{m:20,fr:8,n:5,c:'#ffffff',c2:'#e3cf5f'}]],
['shiuli','Shiuli','শিউলি','Night jasmine','Nyctanthes arbor-tristis',3,'Full sun to part shade',2,'Moderate to high',2,'Every 2–3 days','1–2 L for a large tub','Well-drained loam','f','9-11','September to November','Flowers open at dusk and fall by dawn. Prune in late winter.',['bloom',{n:6,c:'#ffffff',c2:'#f0741e',pw:.6,cr:.2,R:30}]],
['togor','Togor','টগর','Crape jasmine','Tabernaemontana divaricata',2,'Part shade to full sun',2,'Moderate to high',2,'Every 2 days in summer','0.5–1 L per 12-inch pot','Any fertile loam','f','1-12','All year, heaviest April to October','One of the easiest white flowers for a half-shaded veranda.',['bloom',{n:5,c:'#ffffff',c2:'#f1e080',pw:.8,cr:.1,R:32}]],
['kathgolap','Kathgolap','কাঠগোলাপ','Frangipani','Plumeria rubra',3,'Full sun',2,'Moderate',1,'Twice a week; almost none in winter','Soak, then let it dry out fully','Sandy, gritty, fast-draining','f','3-10','March to October','Bare branches in winter are normal. It grows easily from a cutting dried for a week.',['bloom',{n:5,c:'#fffaf0',c2:'#f7c531',pw:.85,cr:.3}]],
['korobi','Korobi','করবী','Oleander','Nerium oleander',3,'Full sun',1,'Low to moderate',1,'Every 3–4 days once established','1 L per 12-inch pot','Any well-drained soil','f','4-10','April to October','Every part is poisonous. Keep it away from children and pets, and prune with gloves.',['bloom',{n:5,c:'#f06292',c2:'#ffd9e4',pw:.8,cr:.14,R:32}]]
]},
{id:'seasonal',short:'Seasonal',en:'Seasonal flowers',bn:'মৌসুমি ফুল',c:'#e8a917',
 intro:'Annuals and bulbs grown for one season. The big show is winter: sow in Hemonto, flower through Sheet.',p:[
['ganda','Ganda','গাঁদা','Marigold','Tagetes erecta',3,'Full sun',2,'Moderate',2,'Every 1–2 days','0.3–0.5 L per 8-inch pot','Loam with compost','f','11-2','November to February','Sow in September–October. Pinch out the first bud for a bushier plant.',['bloom',{n:14,rings:3,c:'#f59e0b',pw:.5,cr:.1,c2:'#c96a04'}]],
['dahlia','Dahlia','ডালিয়া','Dahlia','Dahlia pinnata',3,'Full sun',2,'Moderate',2,'Every 2 days; daily when in bud','0.5–1 L per 12-inch pot','Rich sandy loam, well-drained','f','12-3','December to March','Plant cuttings in October–November and stake early; the stems are hollow.',['bloom',{n:12,rings:3,c:'#e0457b',pt:1,pw:.42,cr:.1,c2:'#f9c74f'}]],
['chandramallika','Chandramallika','চন্দ্রমল্লিকা','Chrysanthemum','Chrysanthemum morifolium',3,'Full sun',2,'Moderate',2,'Every 1–2 days','0.3–0.5 L per 10-inch pot','Sandy loam with compost','f','11-1','November to January','Buds form as the nights lengthen. Root cuttings in July–August.',['bloom',{n:18,rings:3,c:'#f4d03f',pt:1,pw:.3,cr:.08,c2:'#c99a0a'}]],
['rajanigandha','Rajanigandha','রজনীগন্ধা','Tuberose','Polianthes tuberosa',3,'Full sun',3,'Moderate to high',2,'Every 2–3 days; more when in bloom','0.5 L per 10-inch pot','Sandy loam, well-drained','f','4-10','April to October, best in the monsoon','Plant bulbs 5 cm deep in March–April. Lift and divide every two years.',['spike',{k:5,n:6,c:'#ffffff',c2:'#dfe9c8',cr:.16}]],
['surjomukhi','Surjomukhi','সূর্যমুখী','Sunflower','Helianthus annuus',3,'Full sun, 8 hours',2,'Moderate',2,'Every 2 days','1 L per 12-inch pot','Deep loam','f','2-4','February to April from a winter sowing','Flowers about 65–75 days after sowing. Stake tall types before the Kalboishakhi storms.',['bloom',{n:20,rings:2,c:'#f7c600',pt:1,pw:.26,cr:.4,c2:'#6b3e1d',R:42}]],
['cosmos','Cosmos','কসমস','Cosmos','Cosmos bipinnatus',3,'Full sun',1,'Low to moderate',1,'Every 2–3 days','0.3 L per 8-inch pot','Light, poor to average soil','f','12-3','December to March','Rich soil gives leaves and few flowers. Sow where it will grow, in October–November.',['bloom',{n:8,c:'#ee6fa9',pw:.62,cr:.2,c2:'#f6c445'}]],
['petunia','Petunia','পিটুনিয়া','Petunia','Petunia × atkinsiana',3,'Full sun',1,'Low to moderate',2,'Every 1–2 days; wet the soil, not the flowers','0.3 L per 8-inch pot','Light, compost-rich mix','f','12-3','December to March','Made for hanging baskets. Remove faded flowers to keep it blooming.',['bloom',{n:5,c:'#7b3fc4',pw:1.1,cr:.16,c2:'#2d1457'}]],
['dopati','Dopati','দোপাটি','Garden balsam','Impatiens balsamina',2,'Part sun',3,'High',3,'Daily; it wilts fast when dry','0.3–0.5 L per 8-inch pot','Moist, fertile loam','f','6-10','June to October','A monsoon flower that self-seeds. Ripe pods burst at a touch, so collect seed early.',['bloom',{n:5,rings:2,c:'#e84a8a',pw:.8,cr:.1,R:32}]],
['nayantara','Nayantara','নয়নতারা','Periwinkle','Catharanthus roseus',3,'Full sun to part shade',1,'Any',1,'Every 2–3 days','0.3 L per 8-inch pot','Sandy, well-drained','f','1-12','All year','It thrives on neglect. Overwatering in the monsoon rots the stem.',['bloom',{n:5,c:'#f472b6',pw:.85,cr:.12,c2:'#be185d',R:32}]]
]},
{id:'climbers',short:'Climbers',en:'Climbers',bn:'লতানো গাছ',c:'#7a5cd6',
 intro:'For grilles, pergolas and rooftop frames. Give each a trellis from day one and a tub of at least 16 inches.',p:[
['madhumanjari','Madhumanjari','মধুমঞ্জরী','Rangoon creeper','Combretum indicum',3,'Full sun',3,'Moderate to high',2,'Every 2 days in summer','2–3 L for a large tub','Fertile loam','f','3-11','March to November','Often sold as Madhabilata. Flowers open white, then turn pink and red.',['cluster',{m:14,fr:10,n:5,c:'#e63950',c2:'#ffd1dc'}]],
['aparajita','Aparajita','অপরাজিতা','Butterfly pea','Clitoria ternatea',3,'Full sun',2,'Moderate to high',2,'Every 1–2 days','0.5 L per 10-inch pot','Sandy loam','f','6-11','June to November, a few all year','Soak seeds overnight before sowing. It fixes its own nitrogen, so go easy on fertiliser.',['bloom',{n:1,c:'#2b3fc7',pw:1.3,cr:.26,c2:'#fff4b8',R:30}]],
['beli','Beli','বেলি','Arabian jasmine','Jasminum sambac',3,'Full sun',3,'Moderate to high',2,'Daily in summer; every 2–3 days otherwise','0.5–1 L per 12-inch pot','Loam with compost, well-drained','f','3-8','March to August','Prune hard in January and feed. Flowers come on the new shoots.',['bloom',{n:8,rings:2,c:'#ffffff',pw:.7,cr:.1,c2:'#efe9c0',R:30}]],
['jui','Jui','জুঁই','Juhi jasmine','Jasminum auriculatum',3,'Full sun to part shade',3,'High',2,'Every 2 days','1 L per 12-inch pot','Moist, well-drained loam','f','6-9','June to September','A monsoon jasmine. Train it on a balcony grille and trim after the rains.',['cluster',{m:18,fr:8,n:6,pt:1,pw:.4,c:'#ffffff',c2:'#eadc8c'}]],
['nilmoni','Nilmonilata','নীলমণি লতা','Purple wreath','Petrea volubilis',3,'Full sun',2,'Moderate',2,'Every 2–3 days','2 L for a large tub','Well-drained loam','f','2-4','February to April','Slow for two years, then it covers a pergola. The leaves feel like sandpaper.',['spike',{k:6,n:5,c:'#7c5ce0',c2:'#c9bbf7',cr:.2,pt:1,pw:.45}]],
['alamanda','Allamanda','অ্যালামান্ডা','Golden trumpet','Allamanda cathartica',3,'Full sun',3,'High',2,'Every 1–2 days in summer','1 L per 12-inch pot','Rich, moist loam','f','4-10','April to October','The milky sap irritates skin. Cut it back in winter to control its reach.',['bloom',{n:5,c:'#f9c80e',pw:.9,cr:.16,c2:'#c98300'}]]
]},
{id:'fruit',short:'Fruit',en:'Fruit trees',bn:'ফলের গাছ',c:'#f0703c',
 intro:'Grafted dwarf trees fruit well in half-drums on a roof. They need sun all day, drainage holes and feeding twice a year.',p:[
['aam','Aam','আম','Mango','Mangifera indica',3,'Full sun, 8 hours',2,'Moderate; dry air while in flower',2,'Every 2–3 days in summer; hold back Nov–Jan','5–8 L for a half-drum','Deep loam, well-drained, pH 5.5–7.5','f','1-3','Flowers Jan–Mar, fruit May–Jul','For rooftops choose Amrapali (BARI Aam-3), BARI Aam-4 or the year-round BARI Aam-11.',['fruit',{rx:19,ry:26,c:'#f2b632',c2:'#e9722a',n:3}]],
['peyara','Peyara','পেয়ারা','Guava','Psidium guajava',3,'Full sun',2,'Moderate to high',2,'Every 2 days in summer','4–6 L for a half-drum','Any well-drained loam','f','3-5,8-10','Flowers Mar–May and Aug–Oct','Bend branches down after harvest to force new fruiting shoots. Bag fruit against fruit fly.',['fruit',{rx:21,ry:22,c:'#b7d36a',n:3}]],
['lebu','Lebu','লেবু','Lemon and lime','Citrus × limon',3,'Full sun',2,'Moderate',2,'Every 2 days; daily in a heatwave','3–5 L for a half-drum','Slightly acidic loam, well-drained','f','2-4,7-9','Main flush Feb–Apr, again in monsoon','Kagzi and Elachi lebu both fruit well in a 16-inch pot or a half-drum.',['fruit',{rx:16,ry:20,c:'#c9d94a',n:4}]],
['pepe','Pepe','পেঁপে','Papaya','Carica papaya',3,'Full sun',2,'Moderate',2,'Every 2 days; never waterlogged','4–6 L for a half-drum','Sandy loam in a raised bed or drum','f','1-12','Flowers all year from 3–4 months old','Two days of standing water can kill it. Red Lady and Shahi (BARI Pepe-1) suit drums.',['fruit',{rx:18,ry:31,c:'#8fbf4d',c2:'#e8a53a',n:3}]],
['dalim','Dalim','ডালিম','Pomegranate','Punica granatum',3,'Full sun',1,'Low to moderate',1,'Every 2–3 days; steady while fruit swells','3–4 L for a half-drum','Loam to sandy loam','f','3-6','Flowers Mar–Jun, fruit from August','Uneven watering splits the fruit. Thin the canopy before the monsoon to limit rot.',['fruit',{rx:21,ry:21,c:'#d83a3a',n:3,x:'crown'}]],
['kul','Kul','কুল','Jujube (boroi)','Ziziphus mauritiana',3,'Full sun',1,'Low to moderate',1,'Every 3–4 days; more when fruiting','4–5 L for a half-drum','Almost any soil, even slightly saline','f','9-11','Flowers Sep–Nov, fruit Jan–Mar','Cut back hard after harvest in March–April; it fruits on new wood. Apple kul and BAU kul do well.',['fruit',{rx:13,ry:15,c:'#b9cf5b',c2:'#c2562e',n:5}]],
['malta','Malta','মাল্টা','Sweet orange','Citrus sinensis',3,'Full sun',2,'Moderate',2,'Every 2–3 days','4–5 L for a half-drum','Slightly acidic loam, good drainage','f','2-3','Flowers Feb–Mar, harvest Sep–Nov','BARI Malta-1 stays green when ripe. Do not wait for it to turn orange.',['fruit',{rx:21,ry:21,c:'#7fb341',n:3}]],
['dragon','Dragon fruit','ড্রাগন ফল','Pitaya','Selenicereus undatus',3,'Full sun',2,'Moderate',1,'Twice a week in summer; little in winter','2–3 L per post','Sandy and gritty, rich in compost','f','4-10','Night flowers Apr–Oct, fruit to Nov','Train it up a concrete post with a ring on top. Hand-pollinate at night for bigger fruit.',['fruit',{rx:19,ry:25,c:'#e0338f',n:3,x:'scale'}]]
]},
{id:'veg',short:'Vegetables',en:'Vegetables',bn:'সবজি',c:'#36a05c',
 intro:'Rabi (winter) and kharif (summer and monsoon) crops for pots, drums and a bamboo macha.',p:[
['tomato','Tomato','টমেটো','Tomato','Solanum lycopersicum',3,'Full sun, 6–8 hours',2,'Moderate; cool nights set fruit',2,'Every 1–2 days, at the root','1 L per 12-inch pot','Loam rich in compost, pH 6–7','f','11-2','Flowers Nov–Feb, pick Dec–Mar','Sow in September–October. Stake it and remove side shoots; uneven watering cracks the fruit.',['fruit',{rx:18,ry:16,c:'#e3342f',n:4}]],
['begun','Begun','বেগুন','Brinjal','Solanum melongena',3,'Full sun',2,'Moderate to high',2,'Every 1–2 days','1–1.5 L per 14-inch pot','Fertile loam, well-drained','f','10-4','Flowers Oct–Apr; summer types exist','Shoot-and-fruit borer is the main pest. Remove wilted tips and hang pheromone traps.',['fruit',{rx:12,ry:29,c:'#5b2a86',n:3}]],
['morich','Morich','মরিচ','Chilli','Capsicum annuum',3,'Full sun',2,'Moderate',2,'Every 2 days; less as fruit ripens','0.5 L per 10-inch pot','Light loam, well-drained','f','11-4','Flowers Nov–Apr; pots crop all year','Waterlogging makes the flowers drop. One 10-inch pot keeps a family in green chillies.',['fruit',{rx:5,ry:25,c:'#d62828',n:6}]],
['lau','Lau','লাউ','Bottle gourd','Lagenaria siceraria',3,'Full sun',2,'Moderate',3,'Daily; twice a day when fruiting in a drum','5–8 L for a half-drum','Loam with lots of compost','f','10-2','Flowers October to February','White flowers open at dusk. Hand-pollinate in the evening and build a macha for the vine.',['fruit',{rx:17,ry:35,c:'#b9d98c',n:2}]],
['shim','Shim','শিম','Country bean','Lablab purpureus',3,'Full sun',2,'Moderate',2,'Every 2–3 days','3–4 L for a half-drum','Loam; it needs little nitrogen','f','10-1','Flowers Oct–Jan, pick Nov–Mar','Sow in Asharh–Bhadro (June–August). It will not flower until the days shorten.',['fruit',{rx:7,ry:23,c:'#6fbf5f',c2:'#7a4a9e',n:6}]],
['dherosh','Dherosh','ঢেঁড়স','Okra','Abelmoschus esculentus',3,'Full sun',3,'High; it loves heat',2,'Every 2 days','1 L per 12-inch pot','Well-drained loam','f','4-9','Flowers April to September','Sow February–May. Pick pods every other day at 8–10 cm, before they turn woody.',['fruit',{rx:6,ry:25,c:'#5aa84b',n:5}]],
['korola','Korola','করলা','Bitter gourd','Momordica charantia',3,'Full sun',3,'High',2,'Every 1–2 days','2–3 L for a large tub','Sandy loam with compost','f','4-8','Flowers April to August','Sow February–May. Bag young fruit in paper to keep fruit fly off.',['fruit',{rx:9,ry:27,c:'#4f9d3a',n:4}]],
['lalshak','Lal shak','লাল শাক','Red amaranth','Amaranthus tricolor',3,'Full sun to light shade',2,'Any',3,'Light watering daily','0.5 L per tray, as a fine spray','Loose, finely broken loam','h','1-12','All year, 25–30 days after sowing','The fastest crop for a new gardener. Sow every two weeks for a steady supply.',['bush',{cs:['#b3213f','#d43a55','#8c1a35'],ll:30,lw:15,sc:'#a02a46'}]],
['puishak','Pui shak','পুঁই শাক','Malabar spinach','Basella alba',3,'Full sun to part shade',3,'High',3,'Daily in summer','1 L per 12-inch pot','Moist loam rich in compost','h','4-10','April to October','It grows from a 20 cm cutting. Give it a net to climb and keep picking the tips.',['vine',{c:'#3f9b55',sc:'#9a3b5c'}]]
]},
{id:'herbs',short:'Herbs',en:'Herbs and spices',bn:'ভেষজ ও মসলা',c:'#1f9aa0',
 intro:'Kitchen and medicinal plants that fit a windowsill. Most are picked leaf by leaf through the year.',p:[
['tulsi','Tulsi','তুলসী','Holy basil','Ocimum tenuiflorum',3,'Full sun, 4–6 hours',2,'Moderate',2,'Daily in summer; alternate days in winter','0.3 L per 8-inch pot','Light loam, well-drained','h','1-12','Pick leaves all year','Pinch off the flower spikes (manjari) to keep leaves coming. Shelter it from winter fog.',['bush',{cs:['#5a9e58','#6fae62','#756a8e'],ll:19,lw:10}]],
['pudina','Pudina','পুদিনা','Mint','Mentha spicata',2,'Part shade with morning sun',3,'High',3,'Daily; keep it moist','0.3 L per wide, shallow pot','Moist, rich loam','h','1-12','All year; slower in peak monsoon','Root shop-bought stems in a glass of water. Keep it in its own pot, because it spreads.',['bush',{cs:['#3fa35a','#55b56b'],ll:15,lw:10,n:6}]],
['dhonepata','Dhonepata','ধনেপাতা','Coriander','Coriandrum sativum',2,'Sun in winter; part shade otherwise',1,'Low to moderate',2,'Light watering daily','0.2–0.3 L per tray','Loose sandy loam','h','11-3','November to March','Crush the seeds lightly before sowing. It bolts in heat, so sow from October onward.',['bush',{cs:['#58b368','#48a35a'],ll:11,lw:9,n:7}]],
['lemongrass','Lemongrass','লেমনগ্রাস','Lemongrass','Cymbopogon citratus',3,'Full sun',3,'High',2,'Every 2 days','1 L per 12-inch pot','Any well-drained soil','h','1-12','Cut all year; fastest in the monsoon','Divide the clump each spring. Cut stalks at the base once they are finger-thick.',['blade',{n:19,w:4,l:120,c:'#7fbf5a',sp:44}]],
['thankuni','Thankuni','থানকুনি','Indian pennywort','Centella asiatica',2,'Part shade',3,'High',3,'Daily; it likes wet feet','0.3 L per shallow tray','Moist clay-loam','h','1-12','All year; lush in the monsoon','A wide, shallow tub suits its runners. It is one of the few herbs happy in soggy soil.',['bush',{cs:['#4aa85c','#5ab86a'],ll:13,lw:14,b:.1,n:7}]],
['ada','Ada','আদা','Ginger','Zingiber officinale',2,'Part shade',3,'High',2,'Every 2 days; less as leaves yellow','1 L per grow bag','Loose sandy loam rich in compost','h','12-2','Plant Apr–May, dig Dec–Feb','It grows well in sacks under a fruit tree. Harvest when the leaves dry down.',['blade',{n:9,w:9,l:108,c:'#5cab57',sp:40}]],
['karipata','Kari pata','কারিপাতা','Curry leaf','Murraya koenigii',3,'Full sun',2,'Moderate',1,'Every 2–3 days','1 L per 12-inch pot','Well-drained loam','h','1-12','All year; it rests in winter','Pinch the tips to make it bushy. It drops some leaves in the cold months.',['bush',{cs:['#2f8f4e','#3ea05c'],ll:15,lw:6,n:6}]],
['ghritokumari','Ghritokumari','ঘৃতকুমারী','Aloe vera','Aloe vera',2,'Bright light, soft morning sun',1,'Low',1,'Every 7–10 days; every 3 weeks in winter','Soak, then let it dry out','Sand, soil and brick chips in equal parts','g','1-12','Grows all year','Keep it out of monsoon rain. Mushy leaves mean too much water.',['blade',{n:9,w:15,l:92,c:'#7fb77e',sp:46}]]
]},
{id:'indoor',short:'Indoor',en:'Foliage and indoor plants',bn:'ঘরের গাছ',c:'#7d8a2e',
 intro:'Plants grown for their leaves, suited to verandas and rooms without direct sun.',p:[
['moneyplant','Money plant','মানিপ্ল্যান্ট','Golden pothos','Epipremnum aureum',2,'Bright indirect light',2,'Moderate to high',1,'Once or twice a week','Water when the top 2 cm is dry','Any potting mix, or plain water','g','3-10','Grows March to October','It rarely flowers. In a bottle, change the water weekly and add a drop of liquid feed.',['vine',{c:'#3fa35a',c2:'#e9d66b'}]],

  return `<svg viewBox="0 0 360 200" role="img" aria-label="Drawing of ${esc(P.en)}">${framed?`<path d="${ARCH}" fill="var(--plate)"/>`:''}<g clip-path="url(#arch)">${body}</g></svg>`;
}

/* ================= PAGES ================= */
const PL=[];let idx=6;
CATS.forEach((c,ci)=>{c.k=ci;c.page=idx++;c.p=c.p.map(a=>{const P={id:a[0],en:a[1],bn:a[2],common:a[3],sci:a[4],L:a[5],lt:a[6],H:a[7],ht:a[8],W:a[9],wf:a[10],wa:a[11],soil:a[12],kind:a[13],ms:months(a[14]),season:a[15],tip:a[16],art:a[17],img:a[18],cat:c,page:idx++};PL.push(P);return P})});
const N=idx+1, META=Array.from({length:N},()=>({}));
CATS.forEach(c=>{META[c.page]={cat:c.k};c.p.forEach(P=>{META[P.page]={cat:c.k,id:P.id}})});

const meter=(v,what)=>`<span class="m" data-v="${v}" role="img" aria-label="${what} ${v} of 3"><i></i><i></i><i></i></span>`;
const ico=n=>`<svg aria-hidden="true"><use href="#i-${n}"/></svg>`;
const hd=(left,i)=>`<div class="hd"><span class="cat">${left}</span><span class="fol">${i+1}</span></div>`;
const go=(label,page)=>`<button type="button" class="go" data-go="${page}"><span>${esc(label)}</span><i>${page+1}</i></button>`;
function calendar(ms,kind,season){
  const mo=MN.map((m,i)=>`<span class="${ms.has(i+1)?'on':''}${i===NOW?' now':''}">${m[0]}<i></i></span>`).join('');
  const ri=RITU.map(([n,a,b])=>`<span lang="bn" style="left:${f(a/12*100)}%;width:${f((b-a)/12*100)}%">${n}</span>`).join('');
  return `<div class="cal"><div class="cl"><b>${KIND[kind]}</b><span>${esc(season)}</span></div><div class="mo" aria-hidden="true">${mo}</div><div class="ritu" aria-hidden="true">${ri}</div></div>`;
}
function plantPage(P){const c=P.cat;
  return `<div class="sheet plant" style="--c:${c.c};--k:${c.k}"><i class="tab"></i>
  ${hd(`<i class="dot"></i>${esc(c.en)} <span lang="bn">${c.bn}</span>`,P.page)}
  <div class="art">${plate(P,1)}</div>
  <div class="nm"><h2>${esc(P.en)}</h2><span class="bn" lang="bn">${P.bn}</span></div>
  <p class="sci">${P.common&&P.common!==P.en?esc(P.common)+' · ':''}<i>${esc(P.sci)}</i></p>
  <dl class="needs">
   <div class="n"><dt>${ico('sun')}Light${meter(P.L,'Light')}</dt><dd>${esc(P.lt)}</dd></div>
   <div class="n"><dt>${ico('hum')}Humidity${meter(P.H,'Humidity')}</dt><dd>${esc(P.ht)}</dd></div>
   <div class="n"><dt>${ico('clock')}Water${meter(P.W,'Water need')}</dt><dd>${esc(P.wf)}</dd></div>
   <div class="n"><dt>${ico('drop')}How much</dt><dd>${esc(P.wa)}</dd></div>
   <div class="n wide"><dt>${ico('soil')}Soil</dt><dd>${esc(P.soil)}</dd></div>
  </dl>
  ${calendar(P.ms,P.kind,P.season)}
  <p class="tip"><b>Tip.</b> ${esc(P.tip)}</p></div>`;
}
function sectionPage(c){
  return `<div class="sheet sec onplate" style="--c:${c.c};--k:${c.k}"><i class="tab"></i>
  ${hd(`${c.p.length} plants`,c.page)}
  <div class="art">${plate(c.p[0],0)}</div>
  <h2 lang="bn">${c.bn}</h2><h3><i class="dot"></i>${esc(c.en)}</h3><p>${esc(c.intro)}</p>
  <div class="g">${c.p.map(P=>go(P.en,P.page)).join('')}</div></div>`;
}
const tocBlock=c=>`<section style="--c:${c.c}"><h3><i class="dot"></i>${esc(c.en)} <span lang="bn">${c.bn}</span></h3><div class="g">${c.p.map(P=>go(P.en,P.page)).join('')}</div></section>`;
const sample=CATS[0].p[0];
const pages=[
 `<div class="sheet cover"><p class="eyebrow">A flip book of garden plants</p>
  <svg class="sun" viewBox="0 0 240 240" aria-hidden="true"><circle cx="120" cy="120" r="116" fill="var(--disc)"/>${flower(120,120,88,{n:10,rings:3,pt:1,pw:.36,c:'#ffffff',c2:'#f6c445',cr:.16})}</svg>
  <h1 lang="bn">বাগান</h1><p class="sub">The Bangladesh Garden Book</p>
  <div class="foot"><span>${PL.length} plants in ${CATS.length} groups: light, water, soil and season</span><button type="button" class="open" data-go="1">Open ${ico('next').replace('<svg','<svg style="width:1em;height:1em"')}</button></div></div>`,

 `<div class="sheet fm">${hd('Guide',1)}<h2><small>Before you start</small>How to read a page</h2>
  <p>Each page holds one plant. Three meters show how demanding it is; the text beside them gives the detail.</p>
  <div class="lg"><b>Light</b><ul><li>${meter(1,'Light')}Shade or indirect light</li><li>${meter(2,'Light')}Part sun, 3–4 hours</li><li>${meter(3,'Light')}Full sun, 6 hours or more</li></ul></div>
  <div class="lg"><b>Humidity</b><ul><li>${meter(1,'Humidity')}Dry air is fine</li><li>${meter(2,'Humidity')}Ordinary room or roof air</li><li>${meter(3,'Humidity')}Needs moist air; mist or group pots</li></ul></div>
  <div class="lg"><b>Water</b><ul><li>${meter(1,'Water need')}Let the pot dry out first</li><li>${meter(2,'Water need')}Water when the topsoil dries</li><li>${meter(3,'Water need')}Keep the soil moist</li></ul></div>
  <div style="--c:var(--ink)">${calendar(months('3-6'),'f','Filled months are in season')}</div>
  <p>The band under the months shows the six Bengali seasons, which begin mid-month. The dot marks ${MN[NOW]}.</p>
  <p><b>Amounts are starting points</b> for the plains of Bangladesh. A hot roof, the coast or the hills will shift them, so check with a finger: water when the top 2–3 cm is dry.</p></div>`,

 `<div class="sheet fm">${hd('The garden year',2)}<h2><small lang="bn">ষড়ঋতু</small>Six seasons, six jobs</h2>
  <ul class="rows">
  <li><div class="k"><b lang="bn">গ্রীষ্ম</b><span>Grishmo<br>mid-Apr–mid-Jun</span></div><div>Heat and Kalboishakhi storms. Water morning and evening, mulch pots, tie in climbers. Sow okra and gourds.</div></li>
  <li><div class="k"><b lang="bn">বর্ষা</b><span>Borsha<br>mid-Jun–mid-Aug</span></div><div>Heavy rain. Clear drainage holes and empty saucers. The best time to plant saplings and root cuttings.</div></li>
  <li><div class="k"><b lang="bn">শরৎ</b><span>Shorot<br>mid-Aug–mid-Oct</span></div><div>Rain eases but the air stays humid. Raise tomato, brinjal and chilli seedlings and start winter flower seed.</div></li>
  <li><div class="k"><b lang="bn">হেমন্ত</b><span>Hemonto<br>mid-Oct–mid-Dec</span></div><div>Dry and mild. Prune roses, plant dahlia and chrysanthemum, move winter vegetables into their final pots.</div></li>
  <li><div class="k"><b lang="bn">শীত</b><span>Sheet<br>mid-Dec–mid-Feb</span></div><div>Cool nights and fog. Annual flowers and vegetables peak. Water less, and keep mango dry before it flowers.</div></li>
  <li><div class="k"><b lang="bn">বসন্ত</b><span>Boshonto<br>mid-Feb–mid-Apr</span></div><div>Warming fast. Repot, feed and prune jasmine. Sow summer vegetables and watch for mites and mealybugs.</div></li>
  </ul></div>`,

 `<div class="sheet fm">${hd('Contents',3)}<h2>Contents</h2><div class="toc">${CATS.slice(0,4).map(tocBlock).join('')}</div></div>`,
 `<div class="sheet fm">${hd('Contents',4)}<div class="toc">${CATS.slice(4).map(tocBlock).join('')}</div></div>`,

 `<div class="sheet fm">${hd('Basics',5)}<h2><small lang="bn">ছাদ বাগান</small>Rooftop and balcony basics</h2>
  <ul class="rows plain">
  <li><div class="k"><b>Pot size</b></div><div>Herbs and annuals: 8–10 inch. Shrubs, chilli, brinjal: 12–14 inch. Climbers and gourds: a 16–20 inch tub. Fruit trees: a half-drum, about 100 litres.</div></li>
  <li><div class="k"><b>Soil mix</b></div><div>Two parts loam (doash) soil, one part cow-dung compost or vermicompost, one part coarse sand or coco peat. Add a handful of bone meal and neem cake per pot.</div></li>
  <li><div class="k"><b>Drainage</b></div><div>Three to five holes covered with broken clay shards. Stand pots on bricks so the roof itself can drain.</div></li>
  <li><div class="k"><b>Watering</b></div><div>In the morning; again in the evening in Choitro–Boishakh heat. Water the soil, not the leaves.</div></li>
  <li><div class="k"><b>Feeding</b></div><div>Mustard oil cake soaked for 5–7 days and diluted 1:10, every 2–3 weeks while plants are growing.</div></li>
  <li><div class="k"><b>Roof load</b></div><div>Wet soil is heavy. A full half-drum can pass 100 kg, so place drums over beams and columns.</div></li>
  </ul></div>`
];
CATS.forEach(c=>{pages.push(sectionPage(c));c.p.forEach(P=>pages.push(plantPage(P)))});
pages.push(`<div class="sheet cover back"><p class="eyebrow">Bangladesh Garden Book</p><h1 lang="bn">শুভ বাগান</h1>
  <p>Care values in this book are general guidance for the plains of Bangladesh. Your nursery and your nearest Upazila agriculture office know your local soil and water best.</p>
  <div class="foot"><span>${PL.length} plants</span><button type="button" class="open" data-go="0">Back to the cover</button></div></div>`);

const $=s=>document.querySelector(s);
const book=$('#book'),area=$('#area'),rngEl=$('#rng'),lbl=$('#lbl');
book.innerHTML=pages.map((h,i)=>`<div class="page"${i===0||i===N-1?' data-density="hard"':''}>${h}</div>`).join('');
rngEl.max=N-1;

/* ================= VIEWER ================= */
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let pf,ready=false,snd=store.get('bgb.snd')==='1';

function shim(start){ // plain page switcher, used only if the flip library did not load
  const ps=[...book.children],H={},set={minWidth:1};let i=start,land=true;
  const norm=k=>(!land||k===0)?k:(k%2?k:k-1);
  const draw=()=>{i=norm(Math.max(0,Math.min(N-1,i)));ps.forEach(p=>{p.style.cssText='';p.classList.remove('--left','--right')});
    (land&&i>0&&i<N-1?[i,i+1]:[i]).forEach(k=>{const right=!land||k%2===0;ps[k].style.cssText=`display:block;top:0;height:100%;width:${land?50:100}%;left:${land&&right?50:0}%`;ps[k].classList.add(right?'--right':'--left')});
    (H.flip||[]).forEach(fn=>fn({data:i}))};
  return{on(e,fn){(H[e]=H[e]||[]).push(fn)},getSettings:()=>set,update(){land=set.minWidth<10;draw()},getCurrentPageIndex:()=>i,getOrientation:()=>land?'landscape':'portrait',
    flip(k){i=k;draw()},turnToPage(k){i=k;draw()},flipNext(){i=land?(i===0?1:i+2):i+1;draw()},flipPrev(){i=land?(i<=1?0:i-2):i-1;draw()}};
}
function fit(){
  const r=area.getBoundingClientRect();if(r.width<50||r.height<50)return;
  const land=r.width>=700&&r.width>r.height*1.12,ratio=500/800;
  const pw=Math.floor(Math.min(land?r.width/2:r.width,r.height*ratio)),ph=Math.floor(pw/ratio);
  book.style.width=(land?pw*2:pw)+'px';book.style.height=ph+'px';
  if(ready){pf.getSettings().minWidth=land?1:1e5;pf.update();place();sync()}
}
function place(){
  const i=pf.getCurrentPageIndex(),land=pf.getOrientation()==='landscape';
  book.classList.toggle('is-front',land&&i===0);book.classList.toggle('is-back',land&&i>=N-1);
}
function sync(){
  const i=pf.getCurrentPageIndex(),two=pf.getOrientation()==='landscape'&&i>0&&i<N-1;
  lbl.textContent=(two?`${i+1}–${i+2}`:`${i+1}`)+` / ${N}`;rngEl.value=i;
  const vis=two?[i,i+1]:[i],cat=(vis.map(k=>META[k]).find(m=>m.cat!=null)||{}).cat,pl=vis.map(k=>META[k]).find(m=>m.id);
  document.querySelectorAll('#cats .chip').forEach((b,k)=>{const on=k===cat;b.setAttribute('aria-current',on);if(on&&b.scrollIntoView)try{b.scrollIntoView({block:'nearest',inline:'nearest'})}catch(e){}});
  ['#sPrev','#bPrev'].forEach(s=>$(s).disabled=i===0);['#sNext','#bNext'].forEach(s=>$(s).disabled=i>=N-1);
  store.set('bgb.page',i);
  try{history.replaceState(null,'',pl?'#'+pl.id:location.pathname+location.search)}catch(e){}
}
function goTo(k){k=Math.max(0,Math.min(N-1,k));if(reduce||!window.St)pf.turnToPage(k);else pf.flip(k);if(reduce)sync();closeDrawer()}

let ac;
function swish(){
  if(!snd)return;
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const d=.3,n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),ch=b.getChannelData(0);
    for(let i=0;i<n;i++){const t=i/n;ch[i]=(Math.random()*2-1)*Math.pow(Math.sin(Math.PI*t),2)*(1-t*.5)}
    const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;fl.type='bandpass';fl.Q.value=.8;
    fl.frequency.setValueAtTime(900,ac.currentTime);fl.frequency.exponentialRampToValueAtTime(3200,ac.currentTime+d);g.gain.value=.12;
    s.connect(fl);fl.connect(g);g.connect(ac.destination);s.start()}catch(e){}
}

function start(saved){
  let st=0;const h=(location.hash||'').slice(1),byHash=PL.find(P=>P.id===h);
  if(byHash)st=byHash.page;else if(saved&&saved.page!=null)st=saved.page;else st=+(store.get('bgb.page')||0)||0;
  st=Math.max(0,Math.min(N-1,st));
  fit();
  if(window.St&&St.PageFlip){
    pf=new St.PageFlip(book,{width:500,height:800,size:'stretch',minWidth:1,maxWidth:3000,minHeight:1,maxHeight:5000,autoSize:false,showCover:true,usePortrait:true,
      mobileScrollSupport:false,maxShadowOpacity:.45,flippingTime:reduce?260:850,startPage:st});
    pf.loadFromHTML(book.querySelectorAll('.page'));
    book.style.minWidth='0';book.style.minHeight='0';
  }else{pf=shim(st)}
  pf.on('flip',()=>{place();sync()});
  pf.on('changeOrientation',()=>{place();sync()});
  pf.on('changeState',e=>{if(e.data==='flipping'){book.classList.remove('is-front','is-back');swish()}else if(e.data==='read')place()});
  ready=true;fit();
  if(window.ResizeObserver)new ResizeObserver(fit).observe(area);else addEventListener('resize',fit);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
}

/* ---------- controls ---------- */
$('#cats').innerHTML=CATS.map(c=>`<button type="button" class="chip" style="--c:${c.c}" data-go="${c.page}" aria-current="false"><i></i>${esc(c.short)}</button>`).join('');
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)goTo(+b.dataset.go)});
$('#sPrev').onclick=$('#bPrev').onclick=()=>pf.flipPrev();
$('#sNext').onclick=$('#bNext').onclick=()=>pf.flipNext();
rngEl.addEventListener('input',()=>{pf.turnToPage(+rngEl.value);place();sync()});
const bSnd=$('#bSnd');bSnd.setAttribute('aria-pressed',snd);
bSnd.onclick=()=>{snd=!snd;bSnd.setAttribute('aria-pressed',snd);store.set('bgb.snd',snd?'1':'0');swish()};
const bFs=$('#bFs');if(!document.fullscreenEnabled)bFs.hidden=true;
bFs.onclick=()=>{try{(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{})}catch(e){}};
addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeDrawer();return}
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)&&e.target.type!=='range')return;
  if(e.target.type==='range')return;
  if(e.key==='ArrowRight'||e.key==='PageDown')pf.flipNext();
  else if(e.key==='ArrowLeft'||e.key==='PageUp')pf.flipPrev();
  else if(e.key==='Home')goTo(0);else if(e.key==='End')goTo(N-1);
});

/* ---------- drawer: search and filters ---------- */
const drawer=$('#drawer'),scrim=$('#scrim'),qEl=$('#q'),list=$('#list');
const FILTERS=[['all','All plants',()=>true],['bloom','In flower in '+MN[NOW],P=>P.kind==='f'&&P.ms.has(NOW+1)],['shade','Fine without full sun',P=>P.L<3],['dry','Low water',P=>P.W===1]];
let filt='all';
$('#filters').innerHTML=FILTERS.map(([k,t])=>`<button type="button" class="chip" data-f="${k}" aria-pressed="${k===filt}">${t}</button>`).join('');
function render(){
  const s=qEl.value.trim().toLowerCase(),fn=FILTERS.find(x=>x[0]===filt)[2];let html='',count=0;
  CATS.forEach(c=>{const rows=c.p.filter(P=>fn(P)&&(!s||[P.en,P.bn,P.common,P.sci,c.en].join(' ').toLowerCase().includes(s)));
    if(!rows.length)return;count+=rows.length;
    html+=`<h3 style="--c:${c.c}"><i></i>${esc(c.en)}</h3>`+rows.map(P=>`<button type="button" class="row" data-go="${P.page}"><b>${esc(P.en)}<span lang="bn">${P.bn}</span></b><small>${esc(P.lt)} · ${esc(P.season)}</small><em>${P.page+1}</em></button>`).join('')});
  list.innerHTML=count?html:'<p class="empty">No plant matches. Try a shorter name, or clear the filter.</p>';
}
function openDrawer(focus){render();drawer.hidden=false;scrim.hidden=false;if(focus)qEl.focus()}
function closeDrawer(){drawer.hidden=true;scrim.hidden=true}
$('#bFind').onclick=()=>openDrawer(true);
$('#bToc').onclick=()=>openDrawer(false);
$('#bClose').onclick=scrim.onclick=closeDrawer;
qEl.addEventListener('input',render);
$('#filters').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;filt=b.dataset.f;document.querySelectorAll('#filters .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});

const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)try{hot.snapshot(()=>({page:pf?pf.getCurrentPageIndex():0}))}catch(e){}
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>

</body></html>
