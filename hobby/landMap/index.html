<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Plot Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;500;700&display=swap">
<style>
/* Layout: toolbar on top; stage (plan canvas + 3D canvas, switchable or split) beside an inspector for the selected plot. Stacks on phones. */
:root{
  --bg:#e9eeec; --surface:#f8faf9; --ink:#17201d; --muted:#5b6a65; --line:#cfd9d5;
  --accent:#0e6f80; --accent-ink:#ffffff; --ground:#dfe7e3; --grid:#c3cfca; --danger:#b3261e;
  --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --surface:#182120; --ink:#e4ece8; --muted:#93a39d; --line:#2b3835;
    --accent:#4cc2d2; --accent-ink:#06222a; --ground:#1d2927; --grid:#2c3a37; --danger:#f2877f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#182120; --ink:#e4ece8; --muted:#93a39d; --line:#2b3835;
  --accent:#4cc2d2; --accent-ink:#06222a; --ground:#1d2927; --grid:#2c3a37; --danger:#f2877f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0; overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;gap:10px;min-height:100%;padding-block:10px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em;margin-right:auto;display:flex;align-items:baseline;gap:8px}
.brand small{font:400 11px var(--mono);color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button+button{border-left:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.status{font:400 11px var(--mono);color:var(--muted)}
.main{display:grid;grid-template-columns:1fr;gap:10px;flex:1;min-height:0}
.stage{display:grid;gap:10px;grid-template-columns:1fr;min-width:0}
.pane{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--ground);height:min(62vh,520px);min-width:0}
.pane canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
#planPane canvas{touch-action:none}
.stage[data-view="plan"] #viewPane{display:none}
.stage[data-view="3d"] #planPane{display:none}
.tools{position:absolute;left:8px;top:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none}
.tools>*{pointer-events:auto}
.tools .btn,.tools .seg,.chip{box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12px}
.chip input[type=range]{width:70px;accent-color:var(--accent)}
.chip input[type=number]{width:62px;border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:1px 4px;font:12px var(--mono)}
.hint{position:absolute;left:10px;bottom:8px;font:11px var(--mono);color:var(--muted);background:var(--surface);padding:2px 7px;border-radius:6px;border:1px solid var(--line);pointer-events:none}
.insp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:12px}
.insp h2{font-size:15px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between}
.insp h3{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:84px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.inline{display:flex;gap:6px}
.inline input{flex:1}
.calc{font:400 12px var(--mono);color:var(--muted)}
.drop{border:1.5px dashed var(--line);border-radius:9px;padding:12px;text-align:center;color:var(--muted);font-size:13px}
.drop.over{border-color:var(--accent);color:var(--accent)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:7px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb[aria-pressed="true"]{border-color:var(--accent)}
.thumb .x{position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;line-height:1;font-size:14px}
.thumb .cov{position:absolute;left:3px;bottom:3px;font:600 9px var(--mono);background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:1px 4px}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.item:hover{border-color:var(--accent)}
.dot{width:12px;height:12px;border-radius:3px}
.item b{font:600 13px var(--mono)}
.item span{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.item i{font:normal 12px var(--mono);color:var(--muted)}
.back{border:0;background:transparent;color:var(--accent);padding:0;font-size:13px}
.note{color:var(--muted);font-size:12px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:980px){
  html,body{overflow:hidden}
  .app{height:100%;min-height:0}
  .main{grid-template-columns:minmax(0,1fr) 350px}
  .pane{height:auto;min-height:0}
  .stage{grid-template-rows:minmax(0,1fr);min-height:0}
  .stage[data-view="split"]{grid-template-columns:1fr 1fr}
  .insp{overflow:auto;min-height:0}
}
@media (max-width:979px){ .seg .wide{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="app">
  <header class="top">
    <div class="brand">Plot Atlas <small id="saveState">saved on this device</small></div>
    <div class="seg" role="group" aria-label="View">
      <button type="button" data-view="plan" aria-pressed="false">Plan</button>
      <button type="button" data-view="3d" aria-pressed="false">3D</button>
      <button type="button" data-view="split" class="wide" aria-pressed="false">Split</button>
    </div>
    <div class="actions">
      <label class="btn primary" for="fileScan" id="scanLbl" hidden title="Upload a photo of a handwritten plot sketch">Scan sketch</label>
      <input id="fileScan" type="file" accept="image/*" class="sr">
      <button type="button" class="btn" id="btnUndoScan" hidden>Undo scan</button>
      <button type="button" class="btn" id="btnExport">Export</button>
      <label class="btn" for="fileImport">Import</label>
      <input id="fileImport" type="file" accept="application/json,.json" class="sr">
      <button type="button" class="btn" id="btnSample">Sample layout</button>
      <button type="button" class="btn danger" id="btnClear">Clear all</button>
    </div>
  </header>

  <div class="main">
    <div class="stage" id="stage" data-view="plan">
      <section class="pane" id="planPane" aria-label="2D plan">
        <canvas id="plan"></canvas>
        <div class="tools">
          <div class="seg" role="group" aria-label="Tool">
            <button type="button" data-tool="select" aria-pressed="true">Select</button>
            <button type="button" data-tool="draw" aria-pressed="false">Draw plot</button>
          </div>
          <label class="btn" for="fileMap">Map image</label>
          <input id="fileMap" type="file" accept="image/*" class="sr">
          <span class="chip" id="bdChip" hidden>
            <label for="bdOpacity">Opacity</label>
            <input id="bdOpacity" type="range" min="10" max="100" value="60">
            <button type="button" class="btn" id="bdRemove" style="padding:1px 7px">Remove</button>
          </span>
          <span class="chip"><label for="mapW">Map width m</label><input id="mapW" type="number" min="20" max="5000" step="5"></span>
          <button type="button" class="btn" id="btnFit">Fit</button>
        </div>
        <div class="hint" id="planHint"></div>
      </section>
      <section class="pane" id="viewPane" aria-label="3D view">
        <canvas id="gl"></canvas>
        <div class="tools">
          <button type="button" class="btn" id="btnReset">Reset view</button>
          <button type="button" class="btn" id="btnTop">Top down</button>
          <button type="button" class="btn" id="btnLabels" aria-pressed="true">Labels</button>
        </div>
        <div class="hint">drag to orbit · scroll to zoom · tap a plot</div>
      </section>
    </div>
    <aside class="insp" id="insp" aria-live="polite"></aside>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var STATUS={
  residential:{label:'Residential',color:'#3f8f6b',h:9},
  commercial:{label:'Commercial',color:'#c77d2e',h:14},
  agricultural:{label:'Agricultural',color:'#8aa63a',h:2},
  vacant:{label:'Vacant',color:'#8a96a3',h:0.6},
  public:{label:'Public',color:'#6a7fc9',h:7}
};
var FT2=10.7639, KATHA_FT2=720; /* Dhaka standard katha */
var KEY='plot-atlas-v1';
var state=null, sel=null, uidN=1, hooks={};
var wideMQ=window.matchMedia('(min-width:980px)');

function newUid(){return 'p'+(uidN++)+'_'+Math.random().toString(36).slice(2,6)}
function r1(n){return Math.round(n*10)/10}
function areaText(p){return (Math.round(p.w*p.d*10)/10).toLocaleString()+' m²'}
function areaCalc(p){
  var m2=p.w*p.d, ft=m2*FT2;
  return r1(p.w)+' × '+r1(p.d)+' m · '+Math.round(m2).toLocaleString()+' m² · '+
    Math.round(ft).toLocaleString()+' ft² · '+r1(ft/KATHA_FT2)+' katha';
}
function mk(label,x,y,w,d,status,owner,desc){
  var p={uid:newUid(),label:label,owner:owner||'',status:status,area:'',areaAuto:true,
    height:STATUS[status].h,desc:desc||'',images:[],cover:0,x:x,y:y,w:w,d:d};
  p.area=areaText(p); return p;
}
function sampleState(){
  var s={map:{w:160,h:110},backdrop:null,plots:[]};
  var N='Sample plot. Edit any field, or delete it and draw your own.';
  s.plots=[
    mk('A-01',8,8,34,26,'residential','Sample Owner A',N),
    mk('A-02',46,8,26,26,'residential','Sample Owner B',N),
    mk('A-03',76,8,40,26,'commercial','Sample Owner C',N),
    mk('A-04',122,8,30,40,'public','Community',N),
    mk('B-01',8,40,22,30,'residential','Sample Owner D',N),
    mk('B-02',34,40,38,30,'vacant','',N),
    mk('B-03',76,40,40,30,'commercial','Sample Owner E',N),
    mk('C-01',8,76,64,28,'agricultural','Sample Owner F',N),
    mk('C-02',76,76,36,28,'residential','Sample Owner G',N),
    mk('D-01',122,54,30,50,'vacant','',N)
  ];
  return s;
}
function validState(s){
  return s&&typeof s==='object'&&Array.isArray(s.plots)&&s.map&&s.map.w>0&&s.map.h>0;
}
function normalize(s){
  s.plots.forEach(function(p){
    if(!p.uid)p.uid=newUid();
    if(!STATUS[p.status])p.status='vacant';
    p.label=String(p.label==null?'':p.label); p.owner=String(p.owner||''); p.desc=String(p.desc||'');
    p.images=Array.isArray(p.images)?p.images.filter(function(i){return typeof i==='string'&&i.indexOf('data:image/')===0}):[];
    p.cover=Math.min(Math.max(0,p.cover|0),Math.max(0,p.images.length-1));
    ['x','y','w','d','height'].forEach(function(k){p[k]=Number(p[k])||0});
    p.w=Math.max(1,p.w); p.d=Math.max(1,p.d); p.height=Math.max(0,p.height);
    if(typeof p.areaAuto!=='boolean')p.areaAuto=true;
    if(p.areaAuto)p.area=areaText(p); else p.area=String(p.area||'');
  });
  if(s.backdrop&&(typeof s.backdrop.src!=='string'||s.backdrop.src.indexOf('data:image/')!==0))s.backdrop=null;
  if(s.backdrop){s.backdrop.opacity=Math.min(1,Math.max(.1,Number(s.backdrop.opacity)||.6));s.backdrop.aspect=Number(s.backdrop.aspect)||(s.map.w/s.map.h)}
  return s;
}
function loadState(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var s=JSON.parse(raw); if(validState(s))return normalize(s)}
  }catch(e){}
  return sampleState();
}

/* persistence */
var saveT=null;
function setSave(t){var el=$('#saveState'); if(el)el.textContent=t}
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(function(){
    try{localStorage.setItem(KEY,JSON.stringify(state)); setSave('saved on this device')}
    catch(e){setSave('not saved: storage full or blocked. Use Export.')}
  },350);
}
var toastT=null;
function toast(msg){
  var t=$('#toast'); t.textContent=msg; t.hidden=false;
  clearTimeout(toastT); toastT=setTimeout(function(){t.hidden=true},3200);
}

/* images */
function readImage(file,maxDim,q){
  return new Promise(function(res,rej){
    var fr=new FileReader(); fr.onerror=rej;
    fr.onload=function(){
      var im=new Image(); im.onerror=rej;
      im.onload=function(){
        var k=Math.min(1,maxDim/Math.max(im.width,im.height));
        var c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.width*k)); c.height=Math.max(1,Math.round(im.height*k));
        var g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
        g.drawImage(im,0,0,c.width,c.height);
        res({src:c.toDataURL('image/jpeg',q),w:c.width,h:c.height});
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
var imgCache={};
function getImg(src,cb){
  var e=imgCache[src];
  if(e){ if(e.ok)return e.img; if(cb)e.cbs.push(cb); return null }
  var img=new Image(); e=imgCache[src]={img:img,ok:false,cbs:cb?[cb]:[]};
  img.onload=function(){e.ok=true;var l=e.cbs;e.cbs=[];l.forEach(function(f){f()})};
  img.src=src; return null;
}

/* shared helpers */
function plotByUid(u){for(var i=0;i<state.plots.length;i++)if(state.plots[i].uid===u)return state.plots[i];return null}
function selPlot(){return sel?plotByUid(sel):null}
function changed(o){
  o=o||{}; save();
  if(hooks.plan)hooks.plan();
  if(hooks.gl)hooks.gl(o);
  if(o.noInsp){if(hooks.inspVals)hooks.inspVals()} else if(hooks.insp)hooks.insp();
}
function select(u){
  if(sel===u)return; sel=u;
  if(hooks.plan)hooks.plan(); if(hooks.gl)hooks.gl({sel:true}); if(hooks.insp)hooks.insp();
}
function theme(){
  var cs=getComputedStyle(document.documentElement);
  function g(n){return cs.getPropertyValue(n).trim()}
  return {bg:g('--bg'),surface:g('--surface'),ink:g('--ink'),muted:g('--muted'),line:g('--line'),
    accent:g('--accent'),ground:g('--ground'),grid:g('--grid')};
}
function setView(v){
  if(v==='split'&&!wideMQ.matches)v='plan';
  $('#stage').dataset.view=v;
  document.querySelectorAll('.seg [data-view]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.view===v))});
  if(hooks.resize)setTimeout(hooks.resize,0);
}

/* ================= 2D plan ================= */
var plan=$('#plan'), pctx=plan.getContext('2d');
var tool='select', view={s:4,ox:0,oy:0}, pw=0, ph=0, dpr=1;
var ptrs={}, drag=null, hoverCur='default';
var HN={nw:[0,0],n:[.5,0],ne:[1,0],e:[1,.5],se:[1,1],s:[.5,1],sw:[0,1],w:[0,.5]};
var HC={nw:'nwse-resize',se:'nwse-resize',ne:'nesw-resize',sw:'nesw-resize',n:'ns-resize',s:'ns-resize',e:'ew-resize',w:'ew-resize'};

function snap(v){return Math.round(v*2)/2}
function toW(pt){return {x:(pt.x-view.ox)/view.s,y:(pt.y-view.oy)/view.s}}
function local(e){var r=plan.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function resizePlan(){
  var r=plan.getBoundingClientRect(); if(!r.width||!r.height)return;
  var first=!pw;
  dpr=Math.min(window.devicePixelRatio||1,2); pw=r.width; ph=r.height;
  plan.width=Math.round(pw*dpr); plan.height=Math.round(ph*dpr);
  if(first)fit(); else drawPlan();
}
function fit(){
  if(!pw)return;
  var top=pw<560?92:46, bottom=30, side=28, M=state.map;
  var s=Math.min((pw-side*2)/M.w,(ph-top-bottom)/M.h);
  view.s=Math.max(.2,s); view.ox=(pw-M.w*view.s)/2; view.oy=top+(ph-top-bottom-M.h*view.s)/2;
  drawPlan();
}
function tag(c,text,x,y,font,T,strong){
  c.font=font; var w=c.measureText(text).width;
  c.fillStyle=T.surface; c.globalAlpha=.88; c.fillRect(x-3,y-11,w+6,15); c.globalAlpha=1;
  c.fillStyle=strong?T.ink:T.muted; c.fillText(text,x,y);
}
function niceStep(s){
  var L=[1,5,10,25,50,100,250,500,1000];
  for(var i=0;i<L.length;i++)if(L[i]*s>=16)return L[i];
  return 1000;
}
function drawPlan(){
  if(!pw)return;
  var T=theme(), c=pctx, s=view.s, M=state.map, x0=view.ox, y0=view.oy;
  c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,pw,ph);
  c.fillStyle=T.ground; c.fillRect(0,0,pw,ph);
  c.fillStyle=T.surface; c.fillRect(x0,y0,M.w*s,M.h*s);
  if(state.backdrop){
    var bi=getImg(state.backdrop.src,drawPlan);
    if(bi){c.globalAlpha=state.backdrop.opacity;c.drawImage(bi,x0,y0,M.w*s,M.h*s);c.globalAlpha=1}
  }
  /* grid */
  var st=niceStep(s); c.lineWidth=1; c.strokeStyle=T.grid; c.globalAlpha=.7; c.beginPath();
  for(var gx=st;gx<M.w;gx+=st){var X=Math.round(x0+gx*s)+.5;c.moveTo(X,y0);c.lineTo(X,y0+M.h*s)}
  for(var gy=st;gy<M.h;gy+=st){var Y=Math.round(y0+gy*s)+.5;c.moveTo(x0,Y);c.lineTo(x0+M.w*s,Y)}
  c.stroke(); c.globalAlpha=1;
  c.strokeStyle=T.muted; c.lineWidth=1.5; c.strokeRect(x0,y0,M.w*s,M.h*s);
  /* plots */
  state.plots.forEach(function(p){
    var x=x0+p.x*s,y=y0+p.y*s,w=p.w*s,h=p.d*s, col=STATUS[p.status].color;
    c.fillStyle=col; c.globalAlpha=.5; c.fillRect(x,y,w,h); c.globalAlpha=1;
    if(p.images.length){
      var im=getImg(p.images[p.cover]||p.images[0],drawPlan);
      if(im){
        var k=Math.max(w/im.width,h/im.height), dw=im.width*k, dh=im.height*k;

  h+='<div class="field"><label for="f-area">Area</label><div class="inline"><input id="f-area" data-f="area" autocomplete="off"><button type="button" class="btn" data-act="auto" title="Fill from the drawn rectangle">Auto</button></div><div class="calc" id="calc"></div></div>';

  h+='<h3>Photos</h3>';
  h+='<label class="drop" id="drop" for="insFile">Drop photos here or tap to choose</label><input id="insFile" class="sr" type="file" accept="image/*" multiple>';
  if(p.images.length){
    h+='<div class="thumbs">';
    p.images.forEach(function(src,i){
      h+='<button type="button" class="thumb" data-img="'+i+'" aria-pressed="'+(i===p.cover)+'" aria-label="Use photo '+(i+1)+' on the 3D roof"><img alt="" src="'+src+'">'+
        (i===p.cover?'<span class="cov">ROOF</span>':'')+'<span class="x" role="button" data-rm="'+i+'" aria-label="Remove photo">×</span></button>';
    });
    h+='</div><p class="note">The photo marked ROOF is mapped onto the top of the 3D structure. Tap another to switch.</p>';
  }
  h+='<h3>Position and size (m)</h3>';
  h+='<div class="row4"><div class="field"><label for="g-x">X</label><input id="g-x" data-g="x" type="number" step="0.5"></div>'+
     '<div class="field"><label for="g-y">Y</label><input id="g-y" data-g="y" type="number" step="0.5"></div>'+
     '<div class="field"><label for="g-w">Width</label><input id="g-w" data-g="w" type="number" min="1" step="0.5"></div>'+
     '<div class="field"><label for="g-d">Depth</label><input id="g-d" data-g="d" type="number" min="1" step="0.5"></div></div>';
  insp.innerHTML=h; inspVals();
}
function inspVals(){
  var p=selPlot(); if(!p)return;
  insp.querySelectorAll('[data-f],[data-g]').forEach(function(el){
    if(el===document.activeElement)return;
    var k=el.dataset.f||el.dataset.g, v=p[k];
    el.value=(typeof v==='number')?r1(v):v;
  });
  var c=$('#calc'); if(c)c.textContent=areaCalc(p);
}
insp.addEventListener('input',function(e){
  var p=selPlot(), t=e.target; if(!p)return;
  var f=t.dataset.f, g=t.dataset.g;
  if(f){
    var v=t.value;
    if(f==='height'){var n=parseFloat(v); if(isNaN(n))return; p.height=Math.max(.3,Math.min(200,n))}
    else if(f==='area'){p.area=v;p.areaAuto=false}
    else if(f==='status'){var old=p.status; p.status=v; if(Math.abs(p.height-STATUS[old].h)<1e-6)p.height=STATUS[v].h}
    else p[f]=v;
    changed({noInsp:true});
  }else if(g){
    var n2=parseFloat(t.value); if(isNaN(n2))return;
    p[g]=n2; if(g==='w'||g==='d')p[g]=Math.max(1,n2);
    clampPlot(p); afterGeom(p);
  }
});
insp.addEventListener('click',function(e){
  var t=e.target, p=selPlot();
  var rm=t.closest('[data-rm]');
  if(rm&&p){var i=parseInt(rm.dataset.rm,10);p.images.splice(i,1);p.cover=Math.min(p.cover>i?p.cover-1:p.cover,Math.max(0,p.images.length-1));changed();return}
  var th=t.closest('[data-img]');
  if(th&&p){p.cover=parseInt(th.dataset.img,10);changed();return}
  var it=t.closest('[data-uid]'); if(it){select(it.dataset.uid);return}
  var a=t.closest('[data-act]'); if(!a)return;
  if(a.dataset.act==='back')select(null);
  else if(a.dataset.act==='delete'&&p)deletePlot(p.uid);
  else if(a.dataset.act==='auto'&&p){p.areaAuto=true;p.area=areaText(p);changed({noInsp:true})}
});
function addImages(files){
  var p=selPlot(); if(!p)return;
  var list=Array.prototype.filter.call(files,function(f){return /^image\//.test(f.type)});
  if(!list.length){toast('Choose image files (JPG, PNG, WebP).');return}
  var room=12-p.images.length; if(room<=0){toast('This plot already has 12 photos.');return}
  list=list.slice(0,room);
  var chain=Promise.resolve(), added=0;
  list.forEach(function(f){chain=chain.then(function(){return readImage(f,900,.78)}).then(function(r){p.images.push(r.src);added++}).catch(function(){toast('Could not read '+f.name)})});
  chain.then(function(){if(added){changed();toast(added+(added>1?' photos':' photo')+' added')}});
}
insp.addEventListener('change',function(e){
  if(e.target.id==='insFile'){addImages(e.target.files);e.target.value=''}
});
insp.addEventListener('dragover',function(e){var d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
insp.addEventListener('dragleave',function(e){var d=e.target.closest('#drop');if(d)d.classList.remove('over')});
insp.addEventListener('drop',function(e){var d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');addImages(e.dataTransfer.files)}});
hooks.insp=renderInsp; hooks.inspVals=inspVals;

/* ================= Toolbar wiring ================= */
document.querySelectorAll('[data-view]').forEach(function(b){b.addEventListener('click',function(){setView(b.dataset.view)})});
document.querySelectorAll('[data-tool]').forEach(function(b){b.addEventListener('click',function(){setTool(b.dataset.tool)})});
$('#btnFit').addEventListener('click',fit);
$('#btnReset').addEventListener('click',function(){if(glOK)resetCam(false)});
$('#btnTop').addEventListener('click',function(){if(glOK)resetCam(true)});
$('#btnLabels').addEventListener('click',function(){
  labelsOn=!labelsOn; this.setAttribute('aria-pressed',String(labelsOn)); syncGL({});
});
$('#mapW').addEventListener('change',function(){
  var w=parseFloat(this.value); if(!(w>=20&&w<=5000)){syncMapUI();return}
  var M=state.map, k=w/M.w; M.w=w; M.h=state.backdrop?w/state.backdrop.aspect:M.h*k;
  syncMapUI(); changed({map:true}); fit();
});
$('#fileMap').addEventListener('change',function(e){
  var f=e.target.files[0]; e.target.value=''; if(!f)return;
  readImage(f,1800,.82).then(function(r){
    state.backdrop={src:r.src,opacity:.6,aspect:r.w/r.h}; state.map.h=state.map.w/state.backdrop.aspect;
    syncMapUI(); changed({map:true}); fit(); toast('Map image added. Set the map width to its real size, then draw plots over it.');
  }).catch(function(){toast('Could not read that image.')});
});
$('#bdOpacity').addEventListener('input',function(){
  if(!state.backdrop)return; state.backdrop.opacity=this.value/100; drawPlan(); save();
});
$('#bdRemove').addEventListener('click',function(){state.backdrop=null;syncMapUI();changed({map:true});fit()});

function armed(btn,armLabel,fn){
  var orig=btn.textContent, t=null;
  btn.addEventListener('click',function(){
    if(t){clearTimeout(t);t=null;btn.textContent=orig;fn();return}
    btn.textContent=armLabel; t=setTimeout(function(){t=null;btn.textContent=orig},3000);
  });
}
function replaceState(s){
  state=s; sel=null; syncMapUI(); changed({map:true}); fit();
}
armed($('#btnSample'),'Replace all plots?',function(){var s=sampleState();replaceState(s)});
armed($('#btnClear'),'Really clear?',function(){var s={map:{w:state.map.w,h:state.map.h},backdrop:null,plots:[]};replaceState(s)});

$('#btnExport').addEventListener('click',function(){
  var json=JSON.stringify(state);
  var fallback=function(){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(json).then(function(){toast('Downloads are blocked here. JSON copied to the clipboard instead.')},function(){toast('Export is not available in this view.')});
    }else toast('Export is not available in this view.');
  };
  if(!window.claude||!window.claude.use){fallback();return}
  window.claude.use('downloads').then(function(dl){
    if(!dl){fallback();return}
    return dl.save({filename:'plot-atlas.json',data:json}).then(function(){toast('Export saved')},function(err){
      if(err&&err.code==='declined')return; fallback();
    });
  },fallback);
});
$('#fileImport').addEventListener('change',function(e){
  var f=e.target.files[0]; e.target.value=''; if(!f)return;
  var fr=new FileReader();
  fr.onload=function(){
    try{var s=JSON.parse(fr.result); if(!validState(s))throw 0; replaceState(normalize(s)); toast('Imported '+state.plots.length+' plots')}
    catch(_){toast('That file is not a Plot Atlas export.')}
  };
  fr.readAsText(f);
});

/* ================= Scan sketch ================= */
var scanLbl=$('#scanLbl'), scanIn=$('#fileScan'), undoBtn=$('#btnUndoScan');
var sampleFn=null, scanning=false, prevJSON=null;
var SCAN_PROMPT=[
  'The attached image is a photo or scan of a hand-drawn land plan. Each plot of land is drawn as a rectangle.',
  'Find every plot rectangle. Ignore roads, arrows, compass marks and decoration unless they are a rectangle plot.',
  'Use a coordinate system where the image is 1000 units wide and 1000 units tall (x to the right, y downward, origin at the top-left corner of the image, each axis scaled independently).',
  'For each rectangle give its axis-aligned bounding box: x and y of the top-left corner, w and h as width and height, all in those units.',
  'Also read any handwriting: "label" is the plot number or name written in or beside the rectangle, "owner" is a person or organisation name, "area" is an area figure written for the plot (for example "5 katha" or "300 sq m"), and "notes" is any other text for that plot. Use an empty string for anything not written. Do not invent text.',
  '"mapWidthMeters" is the real-world width of the whole drawing in metres, only if dimensions written on the sketch let you work it out. Otherwise null.',
  'Reply with only JSON in this shape: {"mapWidthMeters": null, "plots": [{"x": 120, "y": 80, "w": 200, "h": 150, "label": "A-1", "owner": "", "area": "", "notes": ""}]}'
].join('\n');
function dataUrlToBlob(u){
  var p=u.split(','), m=/data:([^;]+)/.exec(p[0])[1], b=atob(p[1]), a=new Uint8Array(b.length);
  for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);
  return new Blob([a],{type:m});
}
function scanMsg(e){
  var c=e&&e.code;
  if(c==='not_granted'||c==='sampling_disabled')return 'Scanning needs permission to use Claude. Allow it when asked, then try again.';
  if(c==='rate_limited')return 'Too many requests right now. Wait a moment and scan again.';
  if(c==='image_rejected')return 'That image could not be read. Try a JPG or PNG under 20 MB.';
  if(c==='invalid_json'||c==='empty_completion')return 'Could not read plots from that image. Try a clearer, straight-on photo.';
  if(c==='refused')return 'That image could not be scanned.';
  return 'Scan failed. Check your connection and try again.';
}
function applyScan(res,img){
  var arr=Array.isArray(res)?res:(res&&res.plots);
  if(!Array.isArray(arr))throw {code:'invalid_json'};
  var rects=[];
  arr.forEach(function(r){
    if(!r)return;
    var x=Number(r.x),y=Number(r.y),w=Number(r.w),h=Number(r.h);
    if([x,y,w,h].some(isNaN))return;
    x=Math.max(0,Math.min(1000,x)); y=Math.max(0,Math.min(1000,y));
    w=Math.min(w,1000-x); h=Math.min(h,1000-y);
    if(w<8||h<8)return;
    rects.push({x:x,y:y,w:w,h:h,label:String(r.label||'').trim(),owner:String(r.owner||'').trim(),
      area:String(r.area||'').trim(),notes:String(r.notes||'').trim()});
  });
  if(!rects.length){toast('No rectangles found. Try a clearer photo with dark lines on light paper.');return}
  var aspect=img.w/img.h, M={w:state.map.w,h:0};
  var mw=Number(res&&res.mapWidthMeters); if(mw>=20&&mw<=5000)M.w=mw;
  M.h=M.w/aspect;
  rects.sort(function(a,b){return (a.y-b.y)||(a.x-b.x)});
  var used={}, n=0, plots=rects.map(function(r){
    var lab=r.label; if(!lab||used[lab]){do{n++;lab='P-'+(n<10?'0':'')+n}while(used[lab])}
    used[lab]=1;
    var p=mk(lab,snap(r.x/1000*M.w),snap(r.y/1000*M.h),Math.max(1,snap(r.w/1000*M.w)),Math.max(1,snap(r.h/1000*M.h)),'residential',r.owner,r.notes);
    clampPlot2(p,M);
    if(r.area){p.area=r.area;p.areaAuto=false}
    return p;
  });
  prevJSON=JSON.stringify(state);
  replaceState({map:M,backdrop:{src:img.src,opacity:.6,aspect:aspect},plots:plots});
  undoBtn.hidden=false; setView(wideMQ.matches?'split':'plan');
  toast('Found '+plots.length+' plots. Check them against your sketch and set the map width to its real size.');
}
function clampPlot2(p,M){
  p.w=Math.min(p.w,M.w); p.d=Math.min(p.d,M.h);
  p.x=Math.max(0,Math.min(M.w-p.w,p.x)); p.y=Math.max(0,Math.min(M.h-p.d,p.y));
  if(p.areaAuto)p.area=areaText(p);
}
scanIn.addEventListener('change',function(e){
  var f=e.target.files[0]; e.target.value=''; if(!f||!sampleFn||scanning)return;
  scanning=true; scanLbl.setAttribute('aria-disabled','true'); scanLbl.style.opacity='.6';
  $('#planHint').textContent='Reading your sketch. This can take up to a minute.';
  readImage(f,1600,.85).then(function(img){
    return sampleFn.json(SCAN_PROMPT,{images:dataUrlToBlob(img.src),cache:false}).then(function(res){applyScan(res,img)});
  }).catch(function(err){toast(scanMsg(err))}).then(function(){
    scanning=false; scanLbl.removeAttribute('aria-disabled'); scanLbl.style.opacity=''; setTool(tool);
  });
});
scanLbl.addEventListener('click',function(e){if(scanning)e.preventDefault()});
undoBtn.addEventListener('click',function(){
  if(!prevJSON)return;
  try{replaceState(normalize(JSON.parse(prevJSON)))}catch(_){toast('Could not restore.');return}
  prevJSON=null; undoBtn.hidden=true; toast('Scan undone');
});
if(window.claude&&window.claude.use){
  window.claude.use('sample').then(function(s){
    if(!s)return;
    return s.limits().then(function(l){if(l&&l.images){sampleFn=s;scanLbl.hidden=false}});
  }).catch(function(){});
}

/* ================= Boot ================= */
state=loadState();
syncMapUI(); setTool('select'); setView(wideMQ.matches?'split':'plan'); renderInsp();
initGL();
if(!glOK){
  var warn=document.createElement('p'); warn.className='note'; warn.style.cssText='position:absolute;inset:60px 16px auto;text-align:center';
  warn.textContent='The 3D view needs WebGL, which is unavailable in this browser.'; $('#viewPane').appendChild(warn);
}
if(window.ResizeObserver){var ro=new ResizeObserver(function(){hooks.resize()});ro.observe($('#planPane'));ro.observe($('#viewPane'))}
window.addEventListener('resize',hooks.resize);
hooks.resize();
function themeChanged(){drawPlan();syncGL({})}
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeChanged)}catch(_){}
new MutationObserver(themeChanged).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
wideMQ.addEventListener&&wideMQ.addEventListener('change',function(){if(!wideMQ.matches&&$('#stage').dataset.view==='split')setView('plan')});
})();
</script>
