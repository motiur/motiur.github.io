<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>World Car Globe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a spinning globe that shrinks to the top-right corner when a country is tapped; the country's cars appear below as coloring pages. Look: paint-chip swatches, road-sign condensed type, a white drawing sheet. */
:root{
  --bg:#E8EBEE; --panel:#F6F7F8; --ink:#13171C; --mute:#5B6570; --line:#C6CCD3;
  --accent:#0E6B6B; --accent-ink:#FFFFFF; --ocean:#D5DCE3; --land:#BFC7CF; --edge:#F6F7F8;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sheet:#FFFFFF; --sheet-ink:#1A1E23;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161A; --panel:#1B2025; --ink:#EDF0F2; --mute:#98A3AE; --line:#323A42;
  --accent:#5FC4C0; --accent-ink:#0B1A1A; --ocean:#1D252C; --land:#39434D; --edge:#12161A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161A; --panel:#1B2025; --ink:#EDF0F2; --mute:#98A3AE; --line:#323A42;
  --accent:#5FC4C0; --accent-ink:#0B1A1A; --ocean:#1D252C; --land:#39434D; --edge:#12161A; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,canvas:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.05;margin:0;text-wrap:balance}
.bar{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px;padding:4px 0 8px}
.bar h1{font-size:30px;letter-spacing:.01em;text-transform:uppercase}
.tag{font:500 12px var(--mono);color:var(--mute);letter-spacing:.04em;text-transform:uppercase}

/* stage: globe + country heading */
#stage{position:relative;height:min(92vw,440px);transition:height .7s cubic-bezier(.4,0,.2,1)}
#stage.mini{height:132px}
#globeWrap{position:absolute;top:0;left:50%;width:min(92vw,440px);aspect-ratio:1;transform:translateX(-50%);
  transition:width .7s cubic-bezier(.4,0,.2,1),left .7s cubic-bezier(.4,0,.2,1),transform .7s cubic-bezier(.4,0,.2,1)}
#stage.mini #globeWrap{width:128px;left:100%;transform:translateX(-100%)}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#head{position:absolute;left:0;top:0;right:144px;height:128px;display:flex;flex-direction:column;justify-content:center;gap:4px;
  opacity:0;pointer-events:none;transition:opacity .4s .3s}
#stage.mini #head{opacity:1;pointer-events:auto}
#head h2{font-size:38px}
#head p{margin:0;color:var(--mute);font-size:14px}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-weight:500;text-align:left;width:max-content}

/* chips of lit countries */
#chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
#chips[hidden]{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px 8px 10px;min-height:44px;font-weight:500}
.dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:none}
.hint{color:var(--mute);font-size:14px;margin:8px 0 0}

/* car cards */
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.card .pic{background:var(--sheet);border-bottom:1px solid var(--line)}
.card .pic svg{display:block;width:100%;height:auto}
.card .txt{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.card h3{font-size:24px}
.meta{font:400 12px var(--mono);color:var(--mute);letter-spacing:.03em;text-transform:uppercase}
.card .sum{font-size:14px;color:var(--mute);margin:0}
.empty{border:1px dashed var(--line);border-radius:6px;padding:18px;color:var(--mute);margin-top:18px}

/* coloring view */
#colorView[hidden],#home[hidden]{display:none}
.top{display:flex;align-items:center;gap:12px;margin:6px 0 10px}
.back{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:10px 14px;min-height:44px;font-weight:500}
.top h2{font-size:30px;flex:1;min-width:0}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:6px}
.sheet svg{display:block;width:100%;height:auto;touch-action:manipulation}
.sheet path.r,.pic path.r{stroke:var(--sheet-ink);stroke-width:1.6;stroke-linejoin:round}
.sheet path.r{cursor:pointer}
.sheet path.r:hover{stroke-width:2.6}
path.d{fill:none;stroke:var(--sheet-ink);stroke-width:1;stroke-linecap:round;pointer-events:none}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:10px 14px;min-height:44px;font-weight:500}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:inline-flex}
.seg .btn:first-child{border-radius:6px 0 0 6px}.seg .btn:last-child{border-radius:0 6px 6px 0;border-left:0}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.sw{height:44px;border-radius:6px;border:1px solid rgba(0,0,0,.3);padding:0;position:relative}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.custom{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--mute)}
.custom input{width:56px;height:44px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:2px}
.notes{margin-top:22px;display:grid;gap:16px}
.notes h3{font-size:22px;margin-bottom:4px}
.notes p{margin:0;max-width:65ch}
.notes ul{margin:0;padding-left:18px;max-width:65ch}
.notes a{color:var(--accent);overflow-wrap:anywhere}
.fine{font-size:13px;color:var(--mute)}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#overlay[hidden]{display:none}
#overlay .box{background:var(--panel);border-radius:8px;padding:12px;max-width:560px;width:100%;display:grid;gap:10px}
#overlay img{width:100%;height:auto;border:1px solid var(--line);background:#fff}
@media(prefers-reduced-motion:reduce){#stage,#globeWrap,#head{transition:none}}
</style>

<div class="wrap">
  <div class="bar"><h1>World Car Globe</h1><span class="tag">Pilot · 17 countries</span></div>

  <section id="home">
    <div id="stage">
      <div id="head"><h2 id="cName"></h2><p id="cSub"></p><button class="link" id="cBack" type="button">Back to globe</button></div>
      <div id="globeWrap"><canvas id="globe" width="440" height="440" tabindex="0" aria-label="Globe. Drag to spin. Tap a lit country to see its cars."></canvas></div>
    </div>
    <div id="chips" aria-label="Countries in the pilot"></div>
    <p class="hint" id="homeHint">Drag the globe to spin it. Tap a painted country or its chip. Each country is painted in the main colour of its first car; that colour is my pick, not a rule.</p>
    <div id="list"></div>
  </section>

  <section id="colorView" hidden>
    <div class="top"><button class="back" id="back" type="button">Back</button><h2 id="cvTitle"></h2></div>
    <div class="sheet"><svg id="art" viewBox="0 0 400 200" role="img"></svg></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Fill mode"><button class="btn" id="mOne" type="button" aria-pressed="true">One shape</button><button class="btn" id="mAll" type="button" aria-pressed="false">All matching</button></div>
      <button class="btn" id="undo" type="button">Undo</button><button class="btn" id="redo" type="button">Redo</button>
    </div>
    <div class="pal" id="pal" role="group" aria-label="Colours"></div>
    <div class="custom"><label for="custom">Your own colour</label><input type="color" id="custom" value="#c0262d"></div>
    <div class="tools">
      <button class="btn" id="typ" type="button">Typical colours</button>
      <button class="btn" id="reset" type="button">Start over</button>
      <button class="btn" id="save" type="button">Make a picture</button>
    </div>
    <div class="notes" id="notes"></div>
  </section>
</div>

<div id="overlay" hidden><div class="box"><img id="outImg" alt="Your coloured car"><div class="fine">Press and hold the picture to save it to your device.</div><button class="btn" id="closeOv" type="button">Close</button></div></div>

const PALETTE=['#c0262d','#e4572e','#f08a24','#e4b534','#8fb339','#1f5a3a','#2fa6a0','#2b4fa0','#6f8aa3','#6a3fa0','#c2578f','#7a4a2b',

/* ---------- state ---------- */
const $=id=>document.getElementById(id);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let current=null,fills=[],undoS=[],redoS=[],color=PALETTE[0],mode='one',selected=null;

function svgOf(car,f,interactive){
  let s=`<path d="${GROUND}" class="d" stroke-dasharray="2 5"/>`;
  s+=`<g transform="translate(0 ${car.dy})">`;
  car.regions.forEach((r,i)=>{s+=`<path class="r" data-i="${i}" d="${r[1]}" fill="${f[i]||'#ffffff'}"${interactive?'':' style="pointer-events:none"'}><title>${r[3]}</title></path>`});
  car.deco.forEach(d=>{s+=`<path class="d" d="${d}"/>`});
  return s+'</g>';
}
function loadFills(car){const v=store.get('car:'+car.id);return Array.isArray(v)&&v.length===car.regions.length?v:car.regions.map(()=>null)}

/* ---------- list ---------- */
function openCountry(name){
  selected=name;
  const cars=CARS.filter(c=>c.country===name);
  $('stage').classList.add('mini');
  $('cName').textContent=NAMES[name]||name;
  $('cSub').textContent=cars.length?`${cars.length} car${cars.length>1?'s':''} in the pilot`:'No cars in the pilot yet';
  $('chips').hidden=true;$('homeHint').hidden=true;
  const L=$('list');L.innerHTML='';
  if(!cars.length){L.innerHTML='<div class="empty">No cars for this country yet. The pilot covers 17 countries: Germany, France, Italy, the United Kingdom, Sweden, Norway, Japan, the United States, Czechia, Spain, Brazil, South Korea, Australia, Russia, China, India and East Germany.</div>';return}
  cars.forEach(car=>{
    const b=document.createElement('button');b.type='button';b.className='card';
    b.innerHTML=`<div class="pic"><svg viewBox="0 0 400 200" aria-hidden="true">${svgOf(car,loadFills(car),false)}</svg></div><div class="txt"><span class="meta">${car.cat} · ${car.era}</span><h3>${car.name}</h3><p class="sum">${car.sum}</p></div>`;
    b.onclick=()=>openCar(car);L.appendChild(b);
  });
}
function backToGlobe(){
  selected=null;$('stage').classList.remove('mini');$('list').innerHTML='';$('chips').hidden=false;$('homeHint').hidden=false;
}
$('cBack').onclick=backToGlobe;

/* ---------- coloring ---------- */
function openCar(car){
  current=car;fills=loadFills(car);undoS=[];redoS=[];
  $('home').hidden=true;$('colorView').hidden=false;
  $('cvTitle').textContent=car.name;
  const pal=[...new Set([...car.colors,...PALETTE])];
  $('pal').innerHTML='';
  pal.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='sw';b.style.background=c;b.setAttribute('aria-label','Colour '+c);b.dataset.c=c;
    b.onclick=()=>setColor(c);$('pal').appendChild(b)});
  setColor(car.colors[0]);
  const n=car.notes;
  $('notes').innerHTML=`<div><h3>What it is</h3><p>${n.what}</p></div><div><h3>Who and where</h3><p>${n.who}</p></div><div><h3>Why it matters</h3><p>${n.why}</p></div>
  <div><h3>Sources</h3><ul>${car.src.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a></li>`).join('')}</ul></div>
  <p class="fine">${car.country} · ${car.cat} · ${car.era}. The drawing is an original generic shape. It is not a copy of any specific model and carries no badges or logos. Notes paraphrase the sources above.</p>`;
  render();window.scrollTo(0,0);
}
function setColor(c){color=c;$('custom').value=/^#[0-9a-f]{6}$/i.test(c)?c:'#c0262d';document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.c===c)))}
function render(){
  $('art').innerHTML=svgOf(current,fills,true);
  $('undo').disabled=!undoS.length;$('redo').disabled=!redoS.length;
  store.set('car:'+current.id,fills);
}
function push(){undoS.push(fills.slice());if(undoS.length>80)undoS.shift();redoS=[]}
$('art').addEventListener('click',e=>{
  const p=e.target.closest('path.r');if(!p)return;
  const i=+p.dataset.i;push();
  if(mode==='all'){const g=current.regions[i][0];current.regions.forEach((r,j)=>{if(r[0]===g)fills[j]=color})}else fills[i]=color;
  render();
});
$('mOne').onclick=()=>{mode='one';$('mOne').setAttribute('aria-pressed','true');$('mAll').setAttribute('aria-pressed','false')};
$('mAll').onclick=()=>{mode='all';$('mAll').setAttribute('aria-pressed','true');$('mOne').setAttribute('aria-pressed','false')};
$('undo').onclick=()=>{if(!undoS.length)return;redoS.push(fills.slice());fills=undoS.pop();render()};
$('redo').onclick=()=>{if(!redoS.length)return;undoS.push(fills.slice());fills=redoS.pop();render()};
$('typ').onclick=()=>{push();fills=current.regions.map(r=>r[2]);render()};
$('reset').onclick=()=>{push();fills=current.regions.map(()=>null);render()};
$('custom').oninput=e=>setColor(e.target.value);
$('back').onclick=()=>{$('colorView').hidden=true;$('home').hidden=false;if(selected)openCountry(selected);window.scrollTo(0,0)};
$('save').onclick=()=>{
  const xml=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="1200" height="600"><rect width="400" height="200" fill="#fff"/><style>path.r{stroke:#1A1E23;stroke-width:1.6;stroke-linejoin:round}path.d{fill:none;stroke:#1A1E23;stroke-width:1;stroke-linecap:round}</style>${svgOf(current,fills,false).replace(/<title>.*?<\/title>/g,'')}</svg>`;
  const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=1200;c.height=600;c.getContext('2d').drawImage(img,0,0);
    try{$('outImg').src=c.toDataURL('image/png')}catch(e){$('outImg').src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml)}$('overlay').hidden=false};
  img.onerror=()=>{$('outImg').src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);$('overlay').hidden=false};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
};
$('closeOv').onclick=()=>{$('overlay').hidden=true};

/* ---------- chips ---------- */
Object.keys(COUNTRIES).forEach(n=>{
  const b=document.createElement('button');b.type='button';b.className='chip';
  b.innerHTML=`<span class="dot" style="background:${COUNTRIES[n].color}"></span>${NAMES[n]||n}`;
  b.onclick=()=>pick(n);$('chips').appendChild(b);
});

/* ---------- globe ---------- */
const cv=$('globe'),ctx=cv.getContext('2d');
const proj=d3.geoOrthographic().clipAngle(90).rotate([-10,-30]);
const path=d3.geoPath(proj,ctx);
const grat=d3.geoGraticule10();
let countries=[],rot=[-10,-30],auto=true,drag=null,anim=null,theme={},themeAt=0;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

const MAP_URLS=[
  'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json',
  'https://unpkg.com/world-atlas@2/countries-110m.json'
];
async function loadWorld(){
  for(const u of MAP_URLS){
    try{const r=await fetch(u);if(r.ok)return await r.json()}catch(e){}
  }
  return null;
}

function readTheme(){const s=getComputedStyle(document.documentElement);['--ocean','--land','--edge','--line'].forEach(k=>theme[k]=s.getPropertyValue(k).trim())}
function size(){
  const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.max(60,Math.round(r.width*d));
  if(cv.width!==w){cv.width=w;cv.height=w}
  return w;
}
function frame(t){
  if(t-themeAt>400){readTheme();themeAt=t}
  const w=size();
  if(auto&&!reduce&&!drag&&!anim&&!selected)rot[0]+=0.12;
  if(anim){const k=Math.min(1,(t-anim.t0)/anim.dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    rot=[anim.a[0]+(anim.b[0]-anim.a[0])*e,anim.a[1]+(anim.b[1]-anim.a[1])*e];if(k>=1)anim=null}
  proj.rotate([rot[0],rot[1],0]).translate([w/2,w/2]).scale(w/2-2);
  ctx.clearRect(0,0,w,w);
  ctx.beginPath();path({type:'Sphere'});ctx.fillStyle=theme['--ocean'];ctx.fill();
  ctx.beginPath();path(grat);ctx.strokeStyle=theme['--line'];ctx.globalAlpha=.5;ctx.lineWidth=.6;ctx.stroke();ctx.globalAlpha=1;
  for(const f of countries){
    const c=COUNTRIES[f.properties.name];
    ctx.beginPath();path(f);ctx.fillStyle=c?c.color:theme['--land'];ctx.fill();
    ctx.strokeStyle=theme['--edge'];ctx.lineWidth=c?1.2:.6;ctx.stroke();
  }
  if(selected&&COUNTRIES[selected]){
    const f=countries.find(x=>x.properties.name===selected);
    if(f){ctx.beginPath();path(f);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}
  }
  ctx.beginPath();path({type:'Sphere'});ctx.strokeStyle=theme['--line'];ctx.lineWidth=1.5;ctx.stroke();
  requestAnimationFrame(frame);
}
function rotateTo(lonlat){
  const b=[-lonlat[0],-lonlat[1]];let a=rot.slice();
  let da=((b[0]-a[0])%360+540)%360-180;a[0]=b[0]-da;
  anim={a,b,t0:performance.now(),dur:reduce?1:900};
}
function pick(name){
  const f=countries.find(x=>x.properties.name===name);
  if(!COUNTRIES[name]&&!f)return;
  const c=COUNTRIES[name]?COUNTRIES[name].center:d3.geoCentroid(f);
  rotateTo(c);openCountry(name);
}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,r:rot.slice(),moved:false};anim=null});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;
  if(drag.moved){const k=180/cv.getBoundingClientRect().width;rot=[drag.r[0]+dx*k,Math.max(-80,Math.min(80,drag.r[1]-dy*k))]}});
cv.addEventListener('pointerup',e=>{
  if(drag&&!drag.moved){
    const r=cv.getBoundingClientRect(),s=cv.width/r.width,p=proj.invert([(e.clientX-r.left)*s,(e.clientY-r.top)*s]);
    if(p){const f=countries.find(x=>d3.geoContains(x,p));if(f)pick(f.properties.name)}
  }
  drag=null;
});
cv.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')rot[0]-=10;if(e.key==='ArrowRight')rot[0]+=10});

readTheme();
(async()=>{
  const world=await loadWorld();
  if(world){
    countries=topojson.feature(world,world.objects.countries).features;
  }else{
    $('homeHint').textContent='Could not load the map data. Check your connection and reload the page.';
  }
  requestAnimationFrame(frame);
})();
</script>

</body></html>
